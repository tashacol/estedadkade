function graphSVG(g){const ty=state.results[g.y]?.t||50,tx=state.results[g.x]?.t||50,ys=ty>=50?'+':'-',xs=tx>=50?'+':'-',active=ys+xs;const W=340,H=330,cx=170,cy=165,R=125,map01=t=>Math.max(0,Math.min(1,(t-20)/60)),mx=cx+(map01(tx)-.5)*2*R,my=cy-(map01(ty)-.5)*2*R;const qcol=c=>c==='cool'?'#3f6d8c':'#c2703d';const qL={'+-':[cx-R*.62,cy-R*.72],'++':[cx+R*.30,cy-R*.72],'--':[cx-R*.62,cy+R*.80],'-+':[cx+R*.30,cy+R*.80]};const qkeys=['+-','++','--','-+'];const tints=qkeys.map(k=>{const activeK=k===active;const fill=activeK?(g.q[k][1]==='cool'?'#e6eff5':'#f6e9df'):'transparent';const x=k==='+-'||k==='--'?cx-R:cx,y=k==='+-'||k==='++'?cy-R:cy;return `<rect x="${x}" y="${y}" width="${R}" height="${R}" fill="${fill}" class="quad" data-q="${k}"></rect>`}).join('');const labels=qkeys.map(k=>{const p=qL[k],isTrue=k===active,color=isTrue?qcol(g.q[k][1]):'#94a3b8';return `<text x="${p[0]}" y="${p[1]}" font-size="11" font-weight="700" fill="${color}" text-anchor="start">${escapeHtml(g.q[k][0])}</text>`}).join('');return `<div class="card" style="overflow:hidden"><div style="padding:16px;border-bottom:1px solid var(--border)"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span style="width:24px;height:24px;border-radius:50%;background:#0f172a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900">${fa(g.num)}</span><h3 style="margin:0;font-size:18px">${escapeHtml(g.fa)}</h3><span style="font-size:11px;color:var(--muted);letter-spacing:.08em">${escapeHtml(g.en)}</span></div><div style="font-size:11px;color:var(--muted);margin-top:7px">عمودی: <b style="color:var(--text)">${escapeHtml(g.y)}</b> · افقی: <b style="color:var(--text)">${escapeHtml(g.x)}</b></div></div><div style="padding:12px;display:flex;justify-content:center"><svg viewBox="0 0 ${W} ${H}" class="canvas" data-graph="${escapeHtml(g.key)}" aria-label="${escapeHtml(g.fa)}"><defs><clipPath id="clip_${escapeHtml(g.key)}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs><g clip-path="url(#clip_${escapeHtml(g.key)})">${tints}<line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" stroke="#cbd5e1" stroke-dasharray="3 3"/><line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="#cbd5e1" stroke-dasharray="3 3"/>${labels}</g><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="${cx}" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="${DATA.SCC[g.y]}">${escapeHtml(g.y)}↑</text><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="700" fill="${DATA.SCC[g.y]}">${escapeHtml(g.y)}↓</text><text x="${W-6}" y="${cy-6}" text-anchor="end" font-size="11" font-weight="700" fill="${DATA.SCC[g.x]}">${escapeHtml(g.x)}↑</text><text x="6" y="${cy-6}" font-size="11" font-weight="700" fill="${DATA.SCC[g.x]}">${escapeHtml(g.x)}↓</text><circle cx="${mx}" cy="${my}" r="14" fill="none" stroke="${qcol(g.q[active][1])}" stroke-width="1" opacity=".4"/><line x1="${mx-6}" y1="${my-6}" x2="${mx+6}" y2="${my+6}" stroke="#b1330f" stroke-width="2.5" stroke-linecap="round"/><line x1="${mx-6}" y1="${my+6}" x2="${mx+6}" y2="${my-6}" stroke="#b1330f" stroke-width="2.5" stroke-linecap="round"/></svg></div><div style="padding:16px 20px;background:var(--bg2);border-top:1px solid var(--border)"><span class="badge" style="background:${g.q[active][1]==='cool'?'#e0f2fe':'#ffedd5'};color:${g.q[active][1]==='cool'?'#0369a1':'#c2410c'};border:1px solid ${g.q[active][1]==='cool'?'#bae6fd':'#fed7aa'}">ربع فعال کاربر</span><h4 style="margin:8px 0 5px;font-size:16px">${escapeHtml(g.q[active][0])}</h4><p style="margin:0;font-size:13px;line-height:2.2;text-align:justify">${escapeHtml(g.q[active][2])}</p>${state.expert?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-family:monospace;direction:ltr;text-align:left;font-size:11px;color:var(--muted)">Y(${escapeHtml(g.y)}): T=${ty} (raw:${state.results[g.y]?.raw||0}) → <b>${ty>=50?'HIGH(+)':'LOW( function bindGraphs(){document.querySelectorAll('[data-graph]').forEach(svg=>{const g=DATA.GRAPHS.find(x=>x.key===svg.dataset.graph);if(!g)return;const activeQ=(state.results[g.y]?.t>=50?'+':'-')+(state.results[g.x]?.t>=50?'+':'-');const apply=q=>{svg.querySelectorAll('.quad').forEach(x=>{const qq=x.dataset.q;x.setAttribute('fill',qq===q?(g.q[qq][1]==='cool'?'#e6eff5':'#f6e9df'):'transparent')});const card=svg.parentElement.parentElement;const h=card.querySelector('h4'),p=card.querySelector('p'),badge=card.querySelector('.badge');if(h&&p&&badge){badge.textContent=q===activeQ?'ربع فعال کاربر':'نمایش ربع '+q;badge.style.color=g.q[q][1]==='cool'?'#0369a1':'#c2410c';h.textContent=g.q[q][0];p.textContent=g.q[q][2]}};apply(activeQ);svg.querySelectorAll('.quad').forEach(r=>{r.addEventListener('mouseenter',()=>apply(r.dataset.q));r.addEventListener('click',()=>apply(r.dataset.q));r.addEventListener('mouseleave',()=>apply(activeQ))})})}
function lineChart(points,isMain){const n=points.length,W=isMain?720:1240,PAD={t:36,r:18,b:isMain?62:122,l:46},plotH=isMain?210:220,H=PAD.t+plotH+PAD.b,plotW=W-PAD.l-PAD.r,xStep=plotW/(n>1?n-1:1),minT=20,maxT=80,yt=t=>PAD.t+plotH-((t-minT)/(maxT-minT))*plotH,xp=i=>PAD.l+i*xStep;const bands=[['بسیار پایین',20,35,'#f5c6c6','#c0392b'],['پایین',35,45,'#fde8c8','#d35400'],['متوسط',45,55,'#fafafa','#7f8c8d'],['بالا',55,65,'#d5efd5','#27ae60'],['بسیار بالا',65,80,'#b8e6c8','#1e8449']];let s=`<div class="card" dir="ltr" style="padding:12px;overflow:auto"><svg viewBox="${- (isMain?66:58)} 0 ${W+2*(isMain?66:58)} ${H}" style="width:100%;display:block;font-family:sans-serif">`;bands.forEach(b=>{const y1=yt(b[2]),y2=yt(b[1]);s+=`<rect x="${PAD.l}" y="${y1}" width="${plotW}" height="${y2-y1}" fill="${b[3]}"/><text x="${PAD.l+plotW/2}" y="${yt((b[1]+b[2])/2)+5}" font-size="13" fill="${b[4]}" text-anchor="middle" opacity=".32" font-weight="bold">${b[0]}</text>`});[20,30,40,50,60,70,80].forEach(t=>{const y=yt(t);s+=`<line x1="${PAD.l}" y1="${y}" x2="${PAD.l+plotW}" y2="${y}" stroke="#aaa" stroke-width=".7" stroke-dasharray="5,4"/><text x="${PAD.l-6}" y="${y+4}" font-size="10.5" fill="#444" text-anchor="end">${t}</text>`});points.forEach((p,i)=>{if(isMain?(i!==0&&i!==n-1):true)s+=`<line x1="${xp(i)}" y1="${PAD.t}" x2="${xp(i)}" y2="${PAD.t+plotH}" stroke="${isMain?'#5599bb':'#ccc'}" stroke-width=".8" opacity=".4"/>`});let d='';points.forEach((p,i)=>{d+=(i?'L ':'M ')+xp(i).toFixed(1)+' '+yt(p.t).toFixed(1)+' '});s+=`<path d="${d}" fill="none" stroke="#2c7a7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;const xBase=PAD.t+plotH+12;points.forEach((p,i)=>{const x=xp(i),y=yt(p.t);s+=`<text x="${x}" y="${y-9}" font-size="${isMain?11:(n>25?8.5:9.5)}" fill="#111" text-anchor="middle" font-weight="bold">${p.t}</text><circle cx="${x}" cy="${y}" r="4" fill="#2c7a7a" stroke="#fff" stroke-width="1.8"/>`;if(isMain)s+=`<text x="${x}" y="${xBase+6}" font-size="11" fill="#111" function radarChart(vals){const W=360,H=300,cx=180,cy=150,R=105,n=5,step=Math.PI*2/n;const pts=vals.map((v,i)=>{const a=-Math.PI/2+i*step;const r=R*(v/80);return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]});const outer=vals.map((_,i)=>{const a=-Math.PI/2+i*step;return [cx+Math.cos(a)*R,cy+Math.sin(a)*R]});let s=`<div class="card" style="padding:14px;overflow:hidden" dir="ltr"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">`;for(let ring=1;ring<=4;ring++){const r=R*ring/4;const p=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*step;return `${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`}).join(' ');s+=`<polygon points="${p}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`}outer.forEach(p=>s+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#e2e8f0"/>`);s+=`<polygon points="${outer.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#cbd5e1" stroke-width="1"/>`;s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(59,130,246,.25)" stroke="#1d4ed8" stroke-width="2"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2563eb"/>`);const labs=DATA.MAIN;labs.forEach((lab,i)=>{const a=-Math.PI/2+i*step;s+=`<text x="${cx+Math.cos(a)*(R+28)}" y="${cy+Math.sin(a)*(R+28)+4}" font-size="11" text-anchor="middle" fill="#475569">${escapeHtml(lab)}</text>`});s+=`</svg></div>`;return s}
function renderWelcome(){return `${toggleThemeButton()}<section class="welcome"><div class="hero glass"><div class="icon-badge">${icon('brain')}</div><h1>آزمون شخصیت نئو</h1><h2>NEO Personality Inventory – Revised (NEO-PI-R)</h2><div class="line"></div><p class="primary-copy">این آزمون جامع شامل <b style="color:#1d4ed8;font-size:20px">۲۴۰ سوال</b> است که دقیق‌ترین تصویر از ویژگی‌های شخصیتی شما را ارائه می‌دهد.</p><p style="font-size:14px;opacity:.92">با پاسخگویی صادقانه، شناخت عمیق‌تری از نقاط قوت، سبک ارتباطی، و تمایلات درونی خود به دست آورید.</p><div class="hero-actions"><button class="btn btn-primary" onclick="state.step='info';state.tempUser={name:'',age:'',education:'',gender:'female'};render()">شروع ارزیابی ${icon('back')}</button><button class="btn btn-secondary" onclick="state.step='hr';render()">${icon('users')} ورود منابع انسانی</button></div></div></section>`}
function renderInfo(){const d=state.tempUser||{name:state.user?.name||'',age:state.user?.age||'',education:state.user?.education||'',gender:state.user?.gender||'female'};return `${toggleThemeButton()}<section class="info-screen"><div class="form-card glass"><h2>مشخصات ارزیابی‌شونده</h2><div class="field"><label>نام و نام خانوادگی</label><input type="text" value="${escapeHtml(d.name)}" oninput="inputUser('name',this.value)" placeholder="نام کامل خود را وارد کنید"></div>${state.infoError?`<div class="error">${escapeHtml(state.infoError)}</div>`:''}<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="field"><label>سن (سال)</label><input type="number" value="${escapeHtml(d.age)}" oninput="inputUser('age',this.value)" placeholder="مثال: ۲۵"></div><div class="field"><label>جنسیت</label><div class="gender"><button class="${d.gender==='female'?'active':''}" onclick="inputUser('gender','female');render()">زن</button><button class="${d.gender==='male'?'active':''}" onclick="inputUser('gender','male');render()">مرد</button></div></div></div><div class="field"><label>تحصیلات</label><select onchange="inputUser('education',this.value)"><option value="" ${!d.education?'selected':''} disabled>سطح تحصیلات خود را انتخاب کنید</option><option value="زیر دیپلم" ${d.education==='زیر دیپلم'?'selected':''}>زیر دیپلم</option><option value="دیپلم" ${d.education==='دیپلم'?'selected':''}>دیپلم</option><option value="کاردانی" ${d.education==='کاردانی'?'selected':''}>کاردانی</option><option value="کارشناسی" ${d.education==='کارشناسی'?'selected':''}>کارشناسی</option><option value="کارشناسی ارشد" ${d.education==='کارشناسی ارشد'?'selected':''}>کارشناسی ارشد</option><option value="دکتری و بالاتر" ${d.education==='دکتری و بالاتر'?'selected':''}>دکتری و بالاتر</option></select></div><div class="form-actions"><button class="btn btn-secondary" onclick="state.step='welcome';render()">${icon('back')} بازگشت</button><button class="btn btn-primary" onclick="submitInfo()">ایجاد پروفایل و ادامه ${icon('back')}</button></div></div></section>`}
function renderHeader(){if(!['quiz','results'].includes(state.step)||!state.user)return '';return `<div class="header no-print"><div class="user-mini"><div class="avatar">${state.user.avatar?`<img src="${state.user.avatar}" alt="${escapeHtml(state.user.name)}">`:escapeHtml(state.user.name.charAt(0))}</div><div><div class="name">${escapeHtml(state.user.name)}</div><div class="meta">${escapeHtml(state.user.age)} ساله • ${escapeHtml(state.user.education)} • ${state.user.gender==='female'?'زن':'مرد'}</div></div></div><button class="icon-btn" onclick="setTheme(!state.isDark)" title="تغییر تم">${state.isDark?icon('sun'):icon('moon')}</button></div>`}
function renderProfile(){const d=currentDraft();const c=getMyCompleted();return `<section class="profile"><div class="shell"><div style="display:flex;align-items:center;justify-content:space-between;gap:16px"><h1 style="margin:0;font-size:25px">پروفایل کاربری</h1><button class="btn btn-secondary" onclick="logout()">${icon('logout')} خروج و بازگشت به صفحه اصلی</button></div><div class="profile-grid"><div class="card profile-card"><div class="profile-avatar">${state.user.avatar?`<img src="${state.user.avatar}" alt="${escapeHtml(state.user.name)}">`:escapeHtml(state.user.name.charAt(0))}</div><label style="display:flex;justify-content:center;gap:6px;margin-top:-12px;margin-bottom:14px;color:var(--muted);font-size:11px"><input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"><span class="icon-btn" title="آپلود تصویر پروفایل">${icon('camera')}</span></label><h2>${escapeHtml(state.user.name)}</h2><div class="center"><span class="pill">آزمون‌دهنده</span></div><div class="profile-facts"><div class="fact"><div class="fact-icon">${icon('user')}</div><div><div style="font-size:11px;color:var(--muted2)">جنسیت</div><div style="font-size:13px;font-weight:800">${state.user.gender==='female'?'زن':'مرد'}</div></div></div><div class="fact"><div class="fact-icon">${icon('calendar')}</div><div><div style="font-size:11px;color:var(--muted2)">سن</div><div style="font-size:13px;font-weight:800">${escapeHtml(state.user.age)} ساله</div></div></div><div class="fact"><div class="fact-icon">${icon('book')}</div><div><div style="font-size:11px;color:var(--muted2)">تحصیلات</div><div style="font-size:13px;font-weight:800">${escapeHtml(state.user.education||'')}</div></div></div></div></div><div><div class="card profile-status"><h3 style="margin:0 0 18px;font-size:17px">${icon('activity')} وضعیت آزمون نئو (NEO-PI-R)</h3>${c?`<div class="status-box complete"><div class="status-icon">${icon('file')}</div><h4 style="color:#065f46">آزمون شما با موفقیت تکمیل شده است</h4><p style="color:#047857">پاسخ‌های شما ثبت و تحلیل کامل شخصیتی شما آماده شده است.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn btn-success" onclick="viewCompletedById('${c.id}')">مشاهده نتایج آزمون ${icon('back')}</button><button class="btn btn-secondary" onclick="startQuiz()">آزمون مجدد ${icon('play')}</button></div></div>`:d&&d.user?.name===state.user.name?`<div class="status-box draft"><div class="status-icon">${icon('activity')}</div><h4 style="color:#92400e">آزمون ناتمام</h4><p style="color:#b45309">شما یک آزمون ناتمام دارید. پیشرفت شما ذخیره شده است.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn btn-warning" onclick="continueQuiz()">ادامه آزمون ${icon('play')}</button><button class="btn btn-secondary" onclick="removeDraft()">شروع مجدد</button></div></div>`:`<div class="status-box ready"><div class="status-icon">${icon('play')}</div><h4>پروفایل شما آماده است</h4><p>برای شروع ارزیابی شخصیت خود، در آزمون شرکت کنید. این آزمون شامل ۲۴۰ سوال است و حدود ۳۰ تا ۴۵ دقیقه زمان می‌برد.</p><button class="btn btn-primary" onclick="startQuiz()">شروع آزمون ${icon('back')}</button></div>`}</div><div class="about"><h3 style="margin:0 0 8px;font-size:15px">درباره آزمون نئو</h3><p>این پرسشنامه (NEO-PI-R) یکی از معتبرترین ابزارهای سنجش شخصیت است که ۵ عامل اصلی (روان‌نژندی، برون‌گرایی، انعطاف‌پذیری، دلپذیر بودن و با وجدان بودن) را به همراه ۳۰ ویژگی فرعی اندازه‌گیری می‌کند.</p></div></div></div></div></section>`}
function finishEarly(){const n=state.answers.filter(a=>a===null).length;if(n>0)showConfirm(`مجموعاً ${n} سوال بی‌پاسخ مانده است. آیا مطمئنید که می‌خواهید آزمون را پایان دهید و نتایج را ببینید؟`,completeQuiz);else completeQuiz()}
function renderQuiz(){const total=Math.ceil(DATA.Q.length/DATA.PER),start=state.page*DATA.PER,end=Math.min(start+DATA.PER,DATA.Q.length),answered=state.answers.filter(a=>a!==null).length,remain=DATA.Q.length-answered,last=state.page>=total-1,mins=Math.floor(remain*10/60),secs=(remain*10)%60;return `<section class="quiz"><div class="quiz-head"><div class="quiz-info"><div class="small-label">سوالات ${fa(start+1)} تا ${fa(end)}</div><div class="progress"><div style="width:${answered/DATA.Q.length*100}%"></div></div><div style="font-size:11px;font-weight:900;color:var(--muted)">${Math.round(answered/DATA.Q.length*100)}٪</div></div><button class="btn btn-secondary no-print" onclick="validateAndFinish()">پایان و مشاهده نتایج</button><div class="quiz-stat"><span class="hide-sm">وضعیت پاسخ‌دهی</span><span>⏳ تخمین زمان: ${mins}:${String(secs).padStart(2,'0')}</span><span><b style="color:#1d4ed8">${fa(answered)} پاسخ داده</b> | ${fa(remain)} باقیمانده</span></div></div><main class="quiz-main"><div class="questions">${DATA.Q.slice(start,end).map((q,i)=>{const idx=start+i,sel=state.answers[idx],cc=DATA.SCC[q.scale]||'#533483';return `<div class="question"><div class="qno">سوال ${fa(q.id)}</div><h1>${escapeHtml(q.text)}</h1><div>${DATA.ANS.map(ans=>`<div class="option ${sel===ans?'active':''}" onclick='selectAnswer(${idx},${JSON.stringify(ans)})'><div class="radio"></div><div style="flex:1;font-size:14px;${sel===ans?'font-weight:800':''}">${escapeHtml(ans)}</div></div>`).join('')}</div></div>`}).join('')}</div></main><div class="quiz-foot"><div class="quiz-foot-in"><button class="btn btn-secondary" onclick="prevPage()">${icon('back')} قبلی</button><button class="btn btn-secondary no-print" onclick="finishEarly()">${last?'':'پایان آزمون'}</button><button class="btn btn-primary" onclick="nextPage()">${last?'مشاهده نتایج ✓':'بعدی '+icon('back')}</button></div></div></section>`}
function resultTabs(){return state.isHRView?[['summary','پروفایل من'],['charts','نمودارها'],['behavior','تحلیل رفتاری'],['work','تحلیل شغلی'],['hr','گزارش منابع انسانی (HR)']]:[['summary','پروفایل من'],['charts','نمودارها'],['behavior','تحلیل رفتاری'],['work','تحلیل شغلی']];}
function renderSummary(){let s='';if(state.warnings.length)s+=`<div class="warning"><h3>${icon('warn')} توجه: بررسی اعتبار پاسخ‌ها</h3><ul style="margin:0;padding-right:18px">${state.warnings.map(w=>`<li style="margin-bottom:6px">${escapeHtml(w)}</li>`).join('')}</ul></div>`;s+=`<div class="card glass chart-card"><h3 class="section-title">پروفایل کلی شخصیت (۵ عامل اصلی)</h3>${barChart(DATA.MAIN.map(sc=>({label:sc,t:state.results[sc]?.t||0,color:DATA.SCC[sc]})))}</div>`;DATA.MAIN.forEach(sc=>{const rv=state.results[sc];if(!rv)return;const cc=DATA.SCC[sc],lc=DATA.LVC[rv.l5],pct=Math.min(rv.t,80)/80*100,subs=DATA.SORD[sc]||[];s+=`<div class="card factor"><div class="factor-top" style="background:${cc}"></div><div class="factor-body"><div class="factor-row"><span class="badge" style="background:${lc}">${rv.l5}</span><span class="factor-name" style="color:${cc}">${sc}</span></div><div class="scores-line"><span>سطح: <b style="color:var(--text)">${rv.l3}</b></span><span>تراز (T): <b style="color:var(--text)">${rv.t}</b></span><span>خام: <b style="color:var(--text)">${rv.raw}</b></span></div><div class="bar"><div style="width:${pct}%;background:${cc}"></div></div><button class="detail-toggle" onclick='state.expanded=state.expanded===${JSON.stringify(sc)}?null:${JSON.stringify(sc)};render()'>⌄ جزئیات خرده‌مقیاس‌ها (۶ مورد)</button>${state.expanded===sc?`<div class="subs-grid">${subs.map(sub=>{const sv=state.results[sub];return `<div class="sub-mini"><div class="sub-head"><b>${escapeHtml(sub)}</b><span class="badge" style="background:${DATA.LVC[sv.l5]}">${sv.l5}</span></div><div class="sub-score"><span>تراز (T): <b>${sv.t}</b></span><span>خام: <b>${sv.raw}</b></span></div></div>`}).join('')}</div>`:''}</div></div>`});s+=`<div style="margin-top:42px"><h3 class="section-title">۱۰ نمودار سبک شخصیتی</h3><div class="charts-grid">${DATA.GRAPHS.map(graphSVG).join('')}</div></div>`;return s}
function barChart(points){const W=760,H=300,pl=52,pt=24,pb=60,pr=24,max=100;const chartW=W-pl-pr,step=chartW/points.length,barW=Math.min(55,step*.58);let s=`<div dir="ltr" style="width:100%;overflow:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;font-family:sans-serif"><rect x="${pl}" y="${pt+H*0.06}" width="${chartW}" height="${H-pb-pt}" fill="rgba(148,163,184,.05)"/>`;[0,20,40,60,80,100].forEach(t=>{const y=pt+(100-t)/100*(H-pb-pt);s+=`<line x1="${pl}" y1="${y}" x2="${pl+chartW}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="4 4"/><text x="${pl-8}" y="${y+4}" font-size="10" text-anchor="end" fill="#64748b">${t}</text>`});points.forEach((p,i)=>{const x=pl+step*i+(step-barW)/2,h=(p.t/max)*(H-pb-pt),y=H-pb-h;s+=`<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="5" fill="${p.color}"/><text x="${x+barW/2}" y="${y-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${p.t}</text><text x="${x+barW/2}" y="${H-20}" text-anchor="middle" font-size="10.5" fill="#475569">${escapeHtml(p.label)}</text>`});s+=`</svg></div><div class="legend"><span><i class="swatch" style="background:#fee2e2"></i>پایین (T ≤ 44)</span><span><i class="swatch" style="background:#fef08a"></i>متوسط (45-55)</span><span><i class="swatch" style="background:#dcfce3"></i>بالا (T &gt; 55)</span></div>`;return s}
function renderCharts(){const mainPts=DATA.MAIN.map(sc=>({label:sc,t:state.results[sc]?.t||50,color:DATA.SCC[sc]}));const all=[];DATA.MAIN.forEach(sc=>(DATA.SORD[sc]||[]).forEach(sub=>all.push({label:sub,t:state.results[sub]?.t||50,color:DATA.SCC[sc],parent:sc})));return `<div class="charts-grid"><div><h3 class="section-title">پروفایل شخصیت (رادار)</h3>${radarChart(mainPts.map(x=>x.t))}<div style="margin-top:28px"><h3 class="section-title">تفسیر ابعاد اصلی</h3>${DATA.MAIN.map((sc,i)=>{const rv=state.results[sc],desc=getDimensionInterpretation(sc,rv.l5);return `<div class="card" style="padding:14px;margin-bottom:10px;background:var(--bg2)"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${DATA.SCC[sc]}"></span><b style="font-size:13px">${sc}</b><span class="badge" style="background:${DATA.LVC[rv.l5]}">${rv.l5}</span></div><p style="margin:6px 0 0;padding-right:18px;font-size:12px;line-height:1.9;color:var(--muted)">${escapeHtml(desc)}</p></div>`}).join('')}</div></div><div><h3 class="section-title">وضعیت در ۵ مقیاس اصلی</h3>${lineChart(mainPts,true)}</div></div><div style="margin-top:26px"><h3 class="section-title">وضعیت در خرده‌مقیاس‌ها</h3>${lineChart(all,false)}</div><div style="margin-top:42px"><h3 class="section-title">۱۰ نمودار سبک شخصیتی</h3><div class="charts-grid">${DATA.GRAPHS.map(graphSVG).join('')}</div></div>`}
function renderAnalysis(isWork){const arrMain=isWork?DATA.AN.work_main:DATA.AN.beh_main,arrSub=isWork?DATA.AN.work_sub:DATA.AN.beh_sub;return DATA.MAIN.map(sc=>{const rv=state.results[sc],cc=DATA.SCC[sc],lc=DATA.LVC[rv.l3],info=findAnalysis(arrMain,sc,rv.l3);return `<div class="card analysis-card"><div class="analysis-head" style="border-right-color:${cc}"><div class="name" style="color:${cc}">${sc}</div><div class="right"><span>T=${rv.t} · خام:${rv.raw}</span><span class="badge" style="background:${lc}">${rv.l3}</span></div></div><div class="analysis-body">${info.desc?`<div class="text-block"><h4>● ${isWork?'شغلی':'رفتاری'}</h4><p>${escapeHtml(info.desc)}</p></div>`:''}${info.traits?`<div class="text-block"><h4>● ویژگی‌های روانی ${isWork?'در محیط کار':'و رفتاری'}</h4><p>${escapeHtml(info.traits)}</p></div>`:''}${info.challenges?`<div class="text-block"><h4>● چالش‌ها</h4><p>${escapeHtml(info.challenges)}</p></div>`:''}${info.performance?`<div class="text-block"><h4>● ویژگی / عملکرد در کار</h4><p>${escapeHtml(info.performance)}</p></div>`:''}<div class="sub-stack" style="border-right-color:${cc}">${(DATA.SORD[sc]||[]).map(sub=>{const sv=state.results[sub],si=findAnalysis(arrSub,sub,sv.l3);if(!si.desc&&!si.traits)return '';return `<div class="sub-card"><div class="sub-card-head"><b style="color:${cc}">${escapeHtml(sub)}</b><span>T=${sv.t} <span class="badge" style="background:${DATA.LVC[sv.l3]};color:#fff;margin-right:7px">${sv.l3}</span></span></div><div class="sub-card-body">${si.desc?`<div class="text-block"><h4>● توضیح</h4><p>${escapeHtml(si.desc)}</p></div>`:''}${si.traits?`<div class="text-block" style="margin-bottom:0"><h4>● ویژگی‌ها</h4><p>${escapeHtml(si.traits)}</p></div>`:''}</div></div>`}).join('')}</div></div></div>`}).join('')}
function renderHRReport(){const r=state.results,u=state.user;const strengths=[];if(r['با وجدان بودن']?.t>=55)strengths.push('<strong>وظیفه‌شناسی بالا:</strong> دارای انضباط شخصی، پیگیری امور تا حصول نتیجه، و قابلیت اتکای بالا.');if(r['انعطاف پذیری']?.t>=55)strengths.push('<strong>تفکر نوآورانه:</strong> توانایی حل خلاقانه مسائل، استقبال از تغییرات سازمانی، و یادگیری مستمر.');if(r['دلپذیر بودن']?.t>=55)strengths.push('<strong>کار تیمی سازنده:</strong> ایجاد جو مثبت در تیم، همدلی با همکاران و مشتریان، و حل مسالمت‌آمیز تعارضات.');if(r['روان نژندی']?.t<=45)strengths.push('<strong>ثبات هیجانی:</strong> مقاومت بالا در برابر استرس‌های محیط کار و تصمیم‌گیری منطقی در شرایط بحرانی.');if(r['برونگرایی']?.t>=55)strengths.push('<strong>انرژی و روابط عمومی:</strong> توانایی شبکه‌سازی، متقاعدسازی، و ایجاد شور و شوق در محیط کار.');if(!strengths.length)strengths.push('<span style="color:var(--muted)">نیاز به مصاحبه عمیق‌تر برای کشف نقاط قوت پنهان.</span>');const risks=[];if(r['روان نژندی']?.t>=55)risks.push('<strong>آسیب‌پذیری به استرس:</strong> ممکن است در محیط‌های پرفشار و ضرب‌الاجل‌های فشرده دچار فرسودگی شغلی شود.');if(r['با وجدان بودن']?.t<=45)risks.push('<strong>چالش‌های نظم‌پذیری:</strong> نیاز به نظارت بیشتر و ساختارهای کنترلی مشخص؛ مناسب برای کارهای چارچوب‌دار نیست.');if(r['دلپذیر بودن']?.t<=45)risks.push('<strong>ریسک تعارضات:</strong> رویکرد انتقادی صریح ممکن است باعث ایجاد اصطکاک در کار تیمی شود (هرچند برای مذاکرات سخت مفید است).');if(r['انعطاف پذیری']?.t<=45)risks.push('<strong>مقاومت در برابر تغییر:</strong> ترجیح می‌دهد در چارچوب‌های آشنا و روتین کار کند؛ تطبیق با سیستم‌های جدید زمان‌بر است.');if(!risks.length)risks.push('<span style="color:var(--muted)">ریسک جدی و برجسته‌ای بر اساس پروفایل پایه مشاهده نشد.</span>');return `<div class="hr-box"><h3>گزارش محرمانه منابع انسانی (HR)</h3><p>این بخش شامل تحلیل‌های تخصصی است که برای ارزیابان، مدیران منابع انسانی و روان‌شناسان صنعتی-سازمانی طراحی شده است.</p><div class="hr-grid"><div class="hr-small"><div class="label">اطلاعات کاندیدا</div><div class="value">${escapeHtml(u.name)} (${u.gender==='female'?'زن':'مرد'})</div><div style="font-size:12px;color:var(--muted);margin-top:5px">${escapeHtml(u.age)} ساله • تحصیلات: ${escapeHtml(u.education)}</div></div><div class="hr-small"><div class="label">شاخص روایی آزمون</div><div class="value" style="color:${state.warnings.length?'#d97706':'#059669'}">${state.warnings.length?'مشکوک به سوگیری یا بی‌دقتی':'پاسخ‌دهی معتبر و قابل اتکا'}</div></div></div></div><div class="card hr-section"><h3>پروفایل استعدادیابی (نقاط قوت و ریسک‌ها)</h3><h4 style="color:#059669;margin:0 0 10px">نقاط قوت سازمانی</h4><ul>${strengths.map(x=>`<li>• ${x}</li>`).join('')}</ul><div style="border-top:1px solid var(--border);margin-top:20px;padding-top:18px"><h4 style="color:#e11d48;margin:0 0 10px">ریسک‌های بالقوه (نیاز به مدیریت)</h4><ul>${risks.map(x=>`<li>• ${x}</li>`).join('')}</ul></div></div><div class="card hr-section"><h3>توصیه‌های جایگذاری و تیم‌سازی</h3><p style="font-size:13px;line-height:2.2;text-align:justify;margin:0">این فرد در محیط‌هایی که ${r['با وجدان بودن']?.t>=55?' ساختارمند و هدف‌گرا هستند ':' نیازمند انعطاف و آزادی عمل هستند '}عملکرد بهتری خواهد داشت. با توجه به سطح برونگرایی (${r['برونگرایی']?.l5})، ${r['برونگرایی']?.t>=55?' مشاغلی با تعاملات انسانی گسترده و پویایی بالا ':' مشاغل متمرکز، تحلیلی و با نیاز به تمرکز فردی '}به شدت توصیه می‌شود. همچنین با در نظر گرفتن سطح دلپذیر بودن، در یک تیم ${r['دلپذیر بودن']?.t>=55?' به عنوان عامل چسبندگی و پشتیبان همکاران ':' به عنوان صدای منتقد و واقع‌گرای تیم، که از تفکر گروهی جلوگیری می‌کند، '}نقش مفیدی ایفا خواهد کرد.</p></div>`}
function renderResults(){const tabs=resultTabs();let body='';if(state.activeTab==='summary')body=renderSummary();else if(state.activeTab==='charts')body=renderCharts();else if(state.activeTab==='behavior')body=renderAnalysis(false);else if(state.activeTab==='work')body=renderAnalysis(true);else if(state.activeTab==='hr')body=renderHRReport();return `<section class="results">${renderHeader()}<div class="tabs no-print"><div class="tabs-inner"><div class="tab-list">${tabs.map(t=>`<button class="tab ${state.activeTab===t[0]?'active':''}" onclick="state.activeTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div class="expert"><span style="font-size:10px;color:var(--muted);font-weight:800">نمای تخصصی</span><button class="switch ${state.expert?'on':''}" onclick="state.expert=!state.expert;render()"><i></i></button></div></div></div><main class="content">${body}<div class="method"><h4>${icon('info')} ملاحظات علمی و اخلاقی (متدولوژی)</h4><p><strong>مبنای محاسبه:</strong> نمرات تراز (T) در این گزارش مستقیماً بر اساس جداول هنجاری تفکیک‌شده بر حسب جنسیت (جداول <strong>${state.user.gender==='female'?'زنان':'مردان'}</strong>) استخراج شده است تا دقت سنجش حفظ شود. نمرات نشان‌دهنده‌ی جایگاه فرد نسبت به جمعیت هنجار هستند.</p><p><strong>سلب مسئولیت بالینی:</strong> این سامانه تنها یک ابزار ارزیابی روان‌سنجی است و نتایج آن در حکم <em>فرضیه‌هایی درباره سبک شخصیتی</em> می‌باشند. این نتایج <strong>به هیچ‌وجه جایگزین تشخیص بالینی، مشاوره تخصصی یا ارزیابی روان‌شناختی جامع نیستند</strong>. تصمیم‌گیری‌های حساس (درمان، استخدام و غیره) نباید صرفاً بر مبنای این گزارش انجام شود.</p></div></main><div class="footer-fixed no-print"><div class="footer-in"><button class="btn btn-secondary" onclick="backFromResults()">${state.isHRView?'بازگشت به پنل مدیر':'بازگشت به پروفایل من'}</button><div class="share"><a class="icon-btn" target="_blank" rel="noopener" title="اشتراک‌گذاری در تلگرام" href="https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(shareText())}">${icon('telegram')}</a><a class="icon-btn" target="_blank" rel="noopener" title="اشتراک‌گذاری در واتس‌اپ" href="https://wa.me/?text=${encodeURIComponent(shareText()+'\n '+location.href)}">${icon('whatsapp')}</a><button class="btn btn-primary" onclick="window.print()">دانلود گزارش PDF</button></div></div></div></section>`}
function shareText(){return 'آزمون شخصیت نئو (NEO) - نتایج من\n\n'+DATA.MAIN.map(sc=>`${sc}: ${state.results[sc]?.l5} (${state.results[sc]?.t})`).join('\n')+'\n\nشما هم می‌توانید در این آزمون شرکت کنید!'}
function renderHR(){let tests=completedTests().sort((a,b)=>new Date(b.date)-new Date(a.date));const q=(state.hrSearch||'').toLowerCase();tests=tests.filter(t=>(t.user?.name||'').toLowerCase().includes(q)||(t.user?.nationalId||'').toLowerCase().includes(q));return `<section class="hr-page"><div class="shell"><div class="hr-head"><div class="hr-title"><button class="btn btn-secondary" onclick="state.step='welcome';render()">${icon('back')} بازگشت به صفحه اصلی</button><div><h1>${icon('users')} پنل منابع انسانی</h1><p>مدیریت و بررسی نتایج کاندیداها</p></div></div><button class="btn ${state.hrConfirm?'btn-danger':''}" onclick="${state.hrConfirm?`localStorage.removeItem('neo_completed_tests');state.hrConfirm=false;render()`:`state.hrConfirm=true;render()`}">${icon('trash')} ${state.hrConfirm?'مطمئن هستید؟ (برای حذف کلیک کنید)':'پاک‌سازی همه'}</button></div><div class="search-row"><div class="search"><input value="${escapeHtml(state.hrSearch||'')}" oninput="state.hrSearch=this.value;render()" placeholder="جستجوی نام کاندیدا..."></div><div class="card stat"><div><b>تعداد کل ارزیابی‌ها</b><strong>${tests.length}</strong></div><div style="font-size:25px;color:#4f46e5">${icon('file')}</div></div></div><div class="card">${tests.length?tests.map((t,i)=>{const d=new Date(t.date),ds=d.toLocaleDateString('fa-IR'),ts=d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});return `<div class="test-row"><div class="test-main"><div class="avatar">${t.user?.avatar?`<img src="${t.user.avatar}" alt="${escapeHtml(t.user.name||'')}">`:escapeHtml(t.user?.name?.charAt(0)||'?')}</div><div><div style="font-size:16px;font-weight:900">${escapeHtml(t.user?.name||'بدون نام')}</div><div style="font-size:12px;color:var(--muted);margin-top:5px">${escapeHtml(t.user?.age)} ساله • ${t.user?.gender==='female'?'زن':'مرد'} • ${escapeHtml(t.user?.education||'')}</div></div></div><div class="test-actions"><span style="font-size:11px;color:var(--muted2)">${ds} - ${ts}</span><button class="icon-btn" onclick="deleteTest('${t.id}')" title="حذف رکورد">${icon('trash')}</button><button class="btn btn-primary" onclick="viewTestById('${t.id}')">مشاهده گزارش</button></div></div>`}).join(''):`<div class="empty">موردی یافت نشد.</div>`}</div></div></section>`}
function deleteTest(id){const xs=completedTests().filter(t=>t.id!==id);localStorage.setItem('neo_completed_tests',JSON.stringify(xs));render()}
function render(){document.documentElement.classList.toggle('dark',state.isDark);let body=state.step==='welcome'?renderWelcome():state.step==='info'?renderInfo():state.step==='profile'?renderProfile():state.step==='quiz'?renderQuiz():state.step==='results'?renderResults():renderHR();app.innerHTML=body;bindGraphs();}
render();
</script>
</body>
</html>`;
