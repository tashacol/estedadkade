  AN: {"beh_main":[{"type":"مقیاس","name":"روان نژندی","level":"پایین","kind":"رفتاری","desc":"این افراد در برابر استرس و فشارهای زندگی واکنش کمتری نشان می‌دهند و معمولاً در مواجهه با چالش‌ها آرامش خود را حفظ می‌کنند.\nاز نظر هیجانی پایدار و قوی هستند و به راحتی دچار اضطراب، افسردگی یا احساسات منفی نمی‌شوند.\nآن‌ها قادرند مشکلات را با دید مثبت و منطقی تحلیل کنند و به راحتی از شکست‌ها یا مشکلات عبور کنند.\nبه طور کلی، این افراد اغلب از سطح بالای آرامش و رضایت زندگی برخوردارند.","traits":"ثبات احساسی بالا حتی در شرایط دشوار و آرامش در مواجهه با بحران‌ها و اعتماد به نفس بالا در انجام وظایف و  پذیرش آسان تغییرات و انتقادات","challenges":"برخورداری از روابط بین‌فردی پایدار و آرام و توانایی همدلی و کنترل خشم در تعاملات و  عدم تأثیرپذیری زیاد از اختلافات یا انتقادات"},{"type":"مقیاس","name":"روان نژندی","level":"متوسط","kind":"رفتاری","desc":"این افراد ممکن است گاهی تحت تأثیر استرس و فشار قرار بگیرند، اما معمولاً قادرند احساسات خود را کنترل کرده و از آن‌ها عبور کنند.\nآن‌ها به طور متوسط در موقعیت‌های چالش‌برانگیز دچار اضطراب یا افسردگی می‌شوند، اما این واکنش‌ها گذرا و مدیریت‌شدنی هستند.\nافرادی با نمرات متوسط در این شاخص ممکن است به راحتی دچار تردید یا نگرانی شوند، اما معمولاً این احساسات پس از مدتی بهبود می‌یابند.","traits":"توانایی کنترل نسبی احساسات در شرایط عادی و  ترکیبی از اضطراب و آرامش بسته به میزان فشار و حساسیت متعادل به انتقاد و بازخورد و  تمایل به رفع تدریجی نگرانی","challenges":"گاهی تنش در روابط به دلیل نگرانی از قضاوت دیگران و  حساسیت گاه‌به‌گاه به رفتار دیگران  و  قدرت تعامل بهتر نسبت به افراد با عصبی بودن بالا"},{"type":"مقیاس","name":"روان نژندی","level":"بالا","kind":"رفتاری","desc":"این افراد به راحتی تحت تأثیر احساسات منفی مانند اضطراب، افسردگی، و نگرانی قرار می‌گیرند.\nممکن است در شرایط استرس‌زا به طور مکرر دچار اضطراب یا افسردگی شوند و این وضعیت می‌تواند به کاهش کیفیت زندگی آن‌ها منجر شود.\nافراد با نمرات بالا در این شاخص ممکن است احساسات خود را به سختی کنترل کنند و در مواجهه با مشکلات، واکنش‌های هیجانی شدیدتری از خود نشان دهند.\nاین ویژگی می‌تواند در روابط اجتماعی یا محیط کار چالش‌هایی ایجاد کند، زیرا این افراد ممکن است به راحتی تحت تأثیر نظرات دیگران قرار گیرند یا با مشکلات کوچکی دچار اضطراب شوند.","traits":"حساسیت بالا به استرس و شرایط محیطی و اضطراب زیاد در مواقع ناشناخته و واکنش‌های احساسی شدید به انتقاد و درگیری با نگرانی مداوم درباره اشتباهات و قضاوت‌ها","challenges":"دشواری در مدیریت روابط با همکاران به‌ویژه در شرایط تنش‌آمیز و  تمایل به واکنش دفاعی یا پرخاشگری در مواجهه با انتقاد و عدم تحمل اختلاف‌ نظر"},{"type":"مقیاس","name":"با وجدان بودن","level":"پایین","kind":"رفتاری","desc":"افراد با سطح پایین وجدان، معمولاً بی‌برنامه، بی‌نظم و کمتر مسئولیت‌پذیر هستند.\nآن‌ها اغلب در اولویت‌ بندی کارها با مشکل مواجه می‌شوند و ممکن است کارها را به تعویق بیندازند.\nتمایل دارند انعطاف‌پذیر باشند و از روال‌های ساختاریافته دوری می‌کنند.\nممکن است در دقت و توجه به جزئیات دچار ضعف باشند.\nمی‌توانند بی‌پروا و بی‌احتیاط به نظر برسند و کمتر به عواقب کارها فکر کنند.\nاین افراد در محیط‌های انعطاف‌پذیر و بدون قوانین دست و پا گیر عملکرد بهتری دارند.","traits":"عدم دقت، بی‌نظمی، عدم مسئولیت‌پذیری","challenges":"روابط ضعیف اجتماعی، مشکلات در کار گروهی"},{"type":"مقیاس","name":"با وجدان بودن","level":"متوسط","kind":"رفتاری","desc":"این افراد دارای تعادل نسبی بین نظم و انعطاف‌پذیری هستند.\nآن‌ها معمولاً مسئولیت‌پذیرند اما نه به شدت افراد با وجدان بالا.\nمی‌توانند برنامه‌ریزی کنند و به آن پایبند باشند، اما گاهی اوقات ممکن است دچار بی‌نظمی شوند.\nدر انجام وظایف معمولاً دقیق هستند، اما کمال‌گرا نیستند.\nمی‌توانند هم در کارهای روتین و هم در کارهای خلاقانه عملکرد خوبی داشته باشند.\nتمایل دارند به تعهدات خود عمل کنند اما ممکن است گاهی دچار اهمال کاری شوند.","traits":"تعادل در دقت و انعطاف‌پذیری، تمایل به همکاری","challenges":"حساسی در برابر انتقادات، چالش‌هایی در تعهدات"},{"type":"مقیاس","name":"با وجدان بودن","level":"بالا","kind":"رفتاری","desc":"افراد با سطح بالای وجدان، بسیار منظم، دقیق و وظیفه‌شناس هستند. \nآن‌ها معمولاً هدفمند و مسئولیت‌پذیر بوده و به برنامه‌ها و زمان‌بندی‌ها کاملاً پایبند هستند.\nاغلب کمال‌گرا بوده و تمایل دارند کارها را با دقت و به بهترین نحو انجام دهند.\nبه جزئیات توجه زیادی دارند و بسیار منظم هستند.\nمعمولاً در تکمیل وظایف به موقع و با کیفیت بالا موفق عمل می‌کنند.\nمی‌توانند در محیط‌های ساختاریافته و با قوانین سختگیرانه بهترین عملکرد را داشته باشند.\nممکن است گاهی اوقات به دلیل کمال‌گرایی دچار استرس شوند.","traits":"دقت بالا، مسئولیت‌پذیری قوی، مدیریت زمان مؤثر","challenges":"کمال‌گرایی، مشکل در مواجهه با تغییرات ناگهانی"},{"type":"مقیاس","name":"انعطاف پذیری","level":"پایین","kind":"رفتاری","desc":"افرادی که در این شاخص نمرات کمتری دریافت می‌کنند، معمولاً در چارچوب‌های تثبیت شده و روال‌های روزمره باقی می‌مانند.\nآن‌ها به تغییرات مقاوم هستند و دوست دارند برنامه‌ریزی‌های دقیق و آشنا داشته باشند.\nممکن است در برابر ایده‌های جدید و تجربیات متفاوت مقاومت نشان دهند و در انتخاب‌های خود بر روال‌های معمول تمرکز کنند.\nاین افراد ممکن است در برخورد با دیگران قضاوت‌های بیشتری انجام دهند و از برقراری ارتباط‌های جدید هراس داشته باشند.","traits":"مقاومت در برابر تغییر، دقت کم در تخیل، ترس از ناشناخته‌ها","challenges":"اجتناب از تجربیات جدید، محدودیت در تعاملات خلاقانه"},{"type":"مقیاس","name":"انعطاف پذیری","level":"متوسط","kind":"رفتاری","desc":"این افراد دارای تعادل نسبی بین پذیرش تغییرات و حفظ روال‌های معمول هستند.\nآن‌ها معمولاً به راحتی با محیط‌های جدید سازگار می‌شوند و از ایده‌ها و تجربیات جدید استقبال می‌کنند.\nدر مواجهه با تغییرات و چالش‌ها، توانایی خوبی در حل مشکلات و مدیریت تغییرات دارند.","traits":"تمایل به ترکیب سنت و نوآوری، کنجکاوی محدود، انعطاف‌پذیری منطقی","challenges":"محدودیت در نوآوری، تردید در مواجهه با تغییرات بزرگ"},{"type":"مقیاس","name":"انعطاف پذیری","level":"بالا","kind":"رفتاری","desc":"افرادی که در این شاخص نمره بالایی کسب می‌کنند، معمولاً به راحتی با محیط‌های جدید سازگار می‌شوند و از ایده‌ها و تجربیات جدید استقبال می‌کنند.\nاین ویژگی به آن‌ها کمک می‌کند تا در موقعیت‌های غیرمنتظره و چالش‌برانگیز به خوبی عمل کنند.\nتوانایی بالایی در حل مشکلات و مدیریت تغییرات دارند و به سرعت واکنش نشان می‌دهند.","traits":"خلاقیت بالا، کنجکاوی شدید، پذیرش نوآوری، ریسک‌ پذیری","challenges":"دشواری در تعامل با افرادی که نیاز به ثبات دارند."},{"type":"مقیاس","name":"برونگرایی","level":"پایین","kind":"رفتاری","desc":"افرادی که در این شاخص نمرات کمتری دریافت می‌کنند، معمولاً تمایل به انزوا و فعالیت‌های فردی دارند.\nممکن است در محیط‌های اجتماعی احساس خستگی کنند و ترجیح دهند زمان بیشتری را به تنهایی بگذرانند.\nاین افراد ممکن است در برقراری ارتباطات جدید و تعاملات اجتماعی محتاط باشند.","traits":"تمایل به انزوا و کمتر بودن در جمع‌ها و  کمتر تمایل به ابراز احساسات در جمع‌ها.","challenges":"چالش در ارتباطات تیمی و مشارکت در فعالیت‌های گروهی و ممکن است در تیم‌های اجتماعی و برون‌گرا احساس عدم تناسب کنند."},{"type":"مقیاس","name":"برونگرایی","level":"متوسط","kind":"رفتاری","desc":"این افراد تعادل خوبی بین فعالیت‌های اجتماعی و فردی دارند.\nمعمولاً در محیط‌های اجتماعی راحت هستند اما نیاز به زمان‌هایی برای استراحت و تنهایی نیز دارند.\nتوانایی برقراری ارتباطات مؤثر و تعامل با دیگران را دارند.","traits":"تمایل به حفظ تعادل میان تنهایی و ارتباطات اجتماعی و  توانایی تعامل در جمع‌های اجتماعی متوسط و به‌دست آوردن انرژی از جمع.","challenges":"گاهی اوقات با چالش در برقراری تعادل بین کارهای فردی و گروهی مواجه می‌شوند و نیاز به بهبود مهارت‌های تعامل اجتماعی در گروه‌های متنوع و تیم‌های مختلف."},{"type":"مقیاس","name":"برونگرایی","level":"بالا","kind":"رفتاری","desc":"افرادی که در این شاخص نمره بالایی کسب می‌کنند، معمولاً بسیار اجتماعی و پرانرژی هستند.\nاز تعاملات اجتماعی لذت می‌برند و به راحتی با دیگران ارتباط برقرار می‌کنند.\nاین افراد معمولاً در محیط‌های گروهی و شلوغ احساس راحتی می‌کنند و به دنبال تجربیات جدید هستند.","traits":"فعال، پرانرژی و اجتماعی و تمایل به جلب توجه و مشارکت فعال در جمع‌ها.","challenges":"چالش در مدیریت روابط با افراد کم‌برونگرا که انرژی کمتری دارند و نیاز به زمان‌های بیشتر برای تمرکز دارند.\nممکن است در محیط‌های کاری که بر فعالیت‌های فردی و متمرکز تاکید دارند، احساس بی‌انگیزگی یا محدودیت کنند."},{"type":"مقیاس","name":"دلپذیر بودن","level":"پایین","kind":"رفتاری","desc":"افراد با نمرات پایین در توافق، بیشتر به دنبال برتری خود در موقعیت‌های اجتماعی یا کاری هستند.\nاین افراد ممکن است کمتر قادر باشند خود را جای دیگران بگذارند و کمتر به احساسات و نیازهای دیگران توجه کنند.\nاین افراد ممکن است تمایل داشته باشند انتقادهای بیشتری به دیگران وارد کنند یا بر اشتباهات دیگران تأکید کنند.\nافراد با توافق پایین معمولاً استقلال بیشتری در نظرات و تصمیم‌گیری‌های خود دارند و کمتر نیازمند تایید دیگران هستند.","traits":"تمرکز بر خود، مقاومت در برابر فشار اجتماعی","challenges":"مشکلات در روابط تیمی"},{"type":"مقیاس","name":"دلپذیر بودن","level":"متوسط","kind":"رفتاری","desc":"این افراد قادرند هم در موقعیت‌های رقابتی و هم در موقعیت‌هایی که نیاز به همدلی و همکاری دارند، به خوبی عمل کنند.\nدر مواقعی که نیاز است، این افراد به احساسات و نیازهای دیگران توجه دارند، اما گاهی اوقات می‌توانند صریح و بی‌پرده باشند.\nاین افراد معمولاً در گروه‌ها به دنبال یافتن راه‌حل‌های مشترک هستند و در حل اختلافات نقش فعالی دارند.","traits":"همکاری متعادل، پذیرش بازخورد، دفاع از خود","challenges":"چالش در مدیریت تعارض‌ها"},{"type":"مقیاس","name":"دلپذیر بودن","level":"بالا","kind":"رفتاری","desc":"افراد با نمرات بالا در توافق به راحتی می‌توانند احساسات دیگران را درک کنند و به آن‌ها پاسخ دهند.\nافراد معمولاً در محیط‌های اجتماعی و حرفه‌ای تمایل دارند تا به دیگران کمک کنند و در رسیدن به اهداف گروهی مشارکت داشته باشند.\nافرادی که توافق بالایی دارند، به طور معمول در موقعیت‌های پرتنش از خود صبر نشان می‌دهند و سعی در کاهش استرس و ایجاد فضایی مثبت دارند.\nاین افراد معمولاً در روابط خود حساس و دقیق هستند و در تلاشند تا از هر گونه ایجاد تنش جلوگیری کنند.","traits":"همدلی، همکاری، اجتناب از تعارض","challenges":"مشکلات در مواجهه با تعارضات شدید"}],"work_main":[{"type":"مقیاس","name":"روان نژندی","level":"پایین","kind":"شغلی","desc":"افراد با عصبی بودن پایین، یا به عبارت دیگر افراد با پایداری عاطفی بالا، کمتر تحت تأثیر احساسات منفی قرار می‌گیرند و در شرایط استرس‌زا و بحرانی می‌توانند آرامش خود را حفظ کنند. این ویژگی باعث می‌شود که این افراد توانایی بالایی در مواجهه با چالش‌ها و فشارهای محیطی داشته باشند و در محیط‌های کاری پویا و پرفشار عملکرد بسیار خوبی از خود نشان دهند.","traits":"آرامش و کنترل در شرایط استرس‌زا: این افراد به‌طور طبیعی در مواجهه با بحران‌ها یا شرایط دشوار آرامش خود را حفظ کرده و تصمیمات منطقی می‌گیرند. آن‌ها در موقعیت‌های حساس قادر به حفظ تمرکز هستند.\nثبات عاطفی و اعتماد به نفس بالا: افراد با عصبی بودن پایین معمولاً به‌راحتی احساسات منفی را مدیریت می‌کنند و در محیط‌های کاری پیچیده یا بحرانی می‌توانند عملکرد بالایی داشته باشند.\nپذیرش تغییرات و چالش‌ها: این افراد معمولاً به‌راحتی با تغییرات و تحولات سازگار می‌شوند و در مواجهه با شرایط جدید به‌سرعت تطبیق می‌یابند.","challenges":"در محیط‌های کم‌چالش ممکن است حس کاهش انگیزه داشته باشد و احتمال کاهش حساسیت به نیازهای تیم در شرایط بسیار چالش‌زا","performance":"عملکرد بالا در محیط‌های پر استرس و پویا و توانایی مدیریت بحران با آرامش و منطق و مشارکت مؤثر در حل چالش‌ها و پیشبرد اهداف تیمی"},{"type":"مقیاس","name":"روان نژندی","level":"متوسط","kind":"شغلی","desc":"افراد با سطوح متوسط عصبی بودن قادر به مدیریت احساسات منفی خود هستند، اما در شرایط خاص یا تحت فشار، ممکن است نگرانی‌ها و اضطراب‌هایی احساس کنند. این افراد معمولاً توانایی تطبیق با تغییرات و شرایط دشوار را دارند، اما در مواجهه با فشارهای زیاد ممکن است از نظر عاطفی آسیب‌پذیر شوند.","traits":"مدیریت احساسات در شرایط عادی: این افراد معمولاً در شرایط کاری عادی به‌خوبی می‌توانند احساسات خود را مدیریت کنند و تمرکز خود را حفظ کنند. با این حال، در شرایط خاص یا تحت فشار ممکن است اضطراب‌هایی را تجربه کنند.\nتوانایی بازخورد گرفتن: افراد با عصبی بودن متوسط به‌طور معمول قادر به دریافت و استفاده از بازخوردها هستند، اما ممکن است نسبت به انتقادات احساس ناراحتی کنند، به‌ویژه اگر انتقادات شدید باشد.\nاحساسات مختلط: این افراد ممکن است در شرایطی که تغییرات سریع یا ناگهانی در محیط کاری رخ می‌دهد، احساس عدم اطمینان و اضطراب کنند، اما در عین حال قادر به انطباق تدریجی با تغییرات هستند.","challenges":"کمی زمان‌بر بودن در پاسخ به شرایط بحرانی و احساس ناامنی یا اضطراب در شرایط فشار بالا و نیاز به بازه زمانی برای تطبیق با کارهای غیراستاندارد","performance":"عملکرد متعادل و پایدار در محیط‌های معمولی و برقراری تعامل با تیم پس از تطبیق با وظایف و شناسایی و حل مشکلات در زمان مناسب"},{"type":"مقیاس","name":"روان نژندی","level":"بالا","kind":"شغلی","desc":"افراد با سطوح بالا از عصبی بودن یا روان‌نژندی، معمولاً به راحتی تحت تأثیر احساسات منفی قرار می‌گیرند و در شرایط استرس‌زا ممکن است به سرعت احساس اضطراب، افسردگی یا خشم کنند. این افراد ممکن است در محیط‌های شغلی که نیاز به آرامش و تصمیم‌گیری منطقی دارند، با چالش‌هایی روبه‌رو شوند.","traits":"حساسیت به فشارهای محیطی: افراد با عصبی بودن بالا تمایل دارند که به فشارهای کاری و محیطی حساسیت بیشتری نشان دهند. آن‌ها ممکن است به سرعت از تغییرات یا شرایط دشوار ناراحت شوند و این می‌تواند بر عملکردشان تأثیر منفی بگذارد.\nاضطراب و نگرانی: این افراد ممکن است از نگرانی‌های بیش از حد نسبت به آینده، تأثیرگذاری در محیط کاری، یا اشتباهات جزئی رنج ببرند که موجب کاهش اعتماد به نفس آن‌ها می‌شود.\nواکنش‌های احساسی شدید: افراد با سطوح بالا از عصبی بودن ممکن است در مواجهه با انتقاد یا مشکلات، واکنش‌های احساسی شدیدی نشان دهند که بر روابط کاری و تصمیم‌گیری‌هایشان تأثیر می‌گذارد.","challenges":"عدم کفایت در محیط‌های پر استرس یا متغیر و  کاهش عملکرد تحت فشار زمانی و دشواری در مدیریت وظایف غیرمنتظره یا جدید","performance":"عملکرد مناسب در محیط‌های ساختاریافته و قابل پیش‌بینی و حساسیت زیاد به تایید شدن از سوی مدیران و همکاران و  کاهش اعتماد به نفس در مواجهه با چالش‌ها"},{"type":"مقیاس","name":"با وجدان بودن","level":"پایین","kind":"شغلی","desc":"افرادی با سطح کم وجدانی بودن معمولاً در محیط‌های کاری با چالش‌هایی مواجه هستند، به دلیل عدم تعهد کافی به برنامه‌ریزی یا جزئیات کار. آن‌ها تمایل به کارهای آنی و بدون ساختار داشته و ممکن است در اجرای وظایف خود پراکنده‌کار باشند.","traits":"دقت پایین و اشتباه در کارها: کارهایی که نیاز به جزئیات دارند ممکن است با خطا انجام شوند.\nضعف در پیگیری وظایف و مسئولیت‌ها: این افراد پروژه‌ها و وظایف محول‌شده به خود را به سختی از ابتدا تا انتها دنبال می‌کنند.\nکاهش قابل‌اعتماد بودن: ممکن است تیم یا مدیران کمتر به آن‌ها در موارد حساس اعتماد کنند.\nبی‌نظمی در محیط کار: میز کار یا برنامه‌کاری آن‌ها معمولاً بی‌نظم و نشانی از مدیریت ضعیف زمان است.\nمقاومت در برابر نظم و سازماندهی: کار کردن در محیط‌های ساختارمند و قانون‌مند می‌تواند برای آن‌ها دشوار باشد.","challenges":"عدم تعهد، بی‌توجهی به جزئیات","performance":"غیرنظم ‌یافته، غیرمسئول، انعطاف‌پذیری بالا"},{"type":"مقیاس","name":"با وجدان بودن","level":"متوسط","kind":"شغلی","desc":"افراد با سطح متوسط وجدانی بودن معمولاً نسبت به مسئولیت‌های محول‌شده به خود تعهد نسبی دارند و در محیط کاری عملکرد متعادلی نشان می‌دهند. این افراد می‌توانند هم در پروژه‌های با نظم معین و هم در موقعیت‌هایی با عدم ساختار کافی، تطابق داشته باشند.","traits":"تعادل بین دقت و سرعت در کار: این افراد می‌توانند وظایف خود را با دقت نسبی انجام دهند و در عین حال به مهلت‌های مقرر احترام بگذارند.\nقابل‌اعتماد بودن تا حد زیادی: معمولاً تعهد کافی دارند، اما ممکن است گاهی اوقات بسته به شرایط انگیزه خود را از دست بدهند.\nانعطاف در کار: این افراد می‌توانند در محیط‌های کاری با سطوح مختلف انعطاف کار کنند.\nپراکندگی گاه‌به‌گاه: اگرچه معمولاً سازمان‌یافته هستند، ولی ممکن است گاهی دچار بی‌نظمی یا پشت گوش انداختن شوند.","challenges":"پراکندگی گاه‌ به‌ گاه","performance":"متعادل، سازمان‌یافته، صرفه‌جویی در زمان"},{"type":"مقیاس","name":"با وجدان بودن","level":"بالا","kind":"شغلی","desc":"افرادی با سطح بالای وجدانی بودن در محیط شغلی بسیار دقیق، سازمان‌یافته، و مسئولیت‌پذیر هستند. این افراد معمولاً در نقش‌های مدیریتی یا پروژه‌هایی که نیاز به برنامه‌ریزی بلند مدت و دقت بالا دارند، بسیار موفق عمل می‌کنند.","traits":"انجام دقیق وظایف: این افراد به کوچک‌ترین جزئیات توجه می‌کنند و کارهای خود را با بالاترین استاندارد ممکن انجام می‌دهند.\nمسئولیت‌پذیر و متعهد: آن‌ها قول‌ها و وظایفی که برعهده گرفته‌اند را به طور کامل انجام می‌دهند و به ندرت شکست می‌خورند.\nسخت‌گیری و کمال‌گرایی: ممکن است بیش از حد روی کارها متمرکز شوند، حتی زمانی که نیازی به این مقدار دقت نیست.\nمدیریت زمان فوق‌العاده: زمان خود را به دقت مدیریت کرده و معمولاً تمام وظایف را قبل از ضرب‌العجل به پایان می‌رسانند.\nتمایل به کاهش انعطاف‌پذیری: ممکن است در محیط‌هایی که نیاز به تغییرات ناگهانی است، کمی سختگیرانه عمل کنند.","challenges":"کاهش انعطاف‌پذیری، فشار زیاد برای تیم یا خودشان","performance":"دقیق، متعهد، قابل اعتماد با کمال‌گرایی بالا"},{"type":"مقیاس","name":"انعطاف پذیری","level":"پایین","kind":"شغلی","desc":"افراد با انعطاف‌پذیری کم تمایل به ساختار و قوانین ثابت دارند و از تغییرات و تجربیات جدید اجتناب می‌کنند. این ویژگی در شغل‌های با نیاز به ثبات، رویه‌های ثابت، و کمترین تغییرات می‌تواند مفید باشد، اما در مشاغلی که نیاز به نوآوری یا سازگاری با تغییرات دارند، ممکن است چالش‌ساز باشد.","traits":"تمرکز بر وظایف آشنا و تکراری: این افراد اغلب ترجیح می‌دهند که کارهای خود را طبق روش‌های ثابت انجام دهند و به روش‌های سنتی پایبند باشند. در مشاغلی که نیاز به دقت و تکرار دارد، این ویژگی می‌تواند مفید باشد.\nکمبود ابتکار و نوآوری: در مشاغلی که نیاز به تفکر خلاقانه و حل مسائل نوآورانه دارند، این افراد ممکن است دچار مشکل شوند. آن‌ها تمایل دارند که راه‌حل‌ها را از تجربیات گذشته و روش‌های شناخته‌شده جستجو کنند و از پذیرفتن ایده‌های جدید و تغییرات اجتناب کنند.\nحساسیت کم به ایده‌های جدید: این افراد ممکن است در تیم‌های خلاق یا محیط‌هایی که به ابتکار و تفکر انتزاعی نیاز دارند، نتوانند مشارکت مؤثری داشته باشند.","challenges":"مشکل در سازگاری با تغییرات، چالش در نوآوری","performance":"عملکرد خوب در مشاغل با ثبات و رویه‌های ثابت و توانایی انجام وظایف تکراری و دقیق"},{"type":"مقیاس","name":"انعطاف پذیری","level":"متوسط","kind":"شغلی","desc":"افراد با انعطاف‌پذیری متوسط تمایل دارند که به‌طور معقول از تجربیات جدید استقبال کنند، اما در عین حال ارزش‌های سنتی و روش‌های شناخته‌شده را نیز رعایت کنند. این افراد توانایی سازگاری با تغییرات را دارند اما در شرایطی که تغییرات بسیار بزرگ یا پرریسک باشند، ممکن است نیاز به زمان برای پذیرش آن‌ها داشته باشند.","traits":"تعادل در پذیرش تغییرات: این افراد می‌توانند با تغییرات سازگار شوند اما به‌طور معمول به زمان نیاز دارند تا اطمینان حاصل کنند که تغییرات مناسب و قابل‌قبول هستند. آن‌ها تمایل دارند که تغییرات را به‌طور تدریجی و منطقی بپذیرند.\nترکیب ایده‌های جدید با سنت‌ها: این افراد توانایی دارند که ایده‌های جدید را با روش‌های سنتی ترکیب کنند. آن‌ها ممکن است در محیط‌هایی که به نوآوری تدریجی نیاز دارند، عملکرد خوبی داشته باشند.\nکنجکاوی منطقی: این افراد تمایل دارند که به‌طور منطقی و تحلیلی به مسائل نگاه کنند و از ایده‌های جدید زمانی استقبال کنند که در راستای بهبود کارایی و بهره‌وری باشد.","challenges":"کندی در پذیرش تغییرات بزرگ، چالش در تصمیم‌گیری‌های سریع","performance":"عملکرد مناسب در محیط‌های با تغییرات تدریجی و کنترل‌شده و به خوبی می‌تواند در موقعیت‌های میان‌ مدت که نیاز به ترکیب سنت و نوآوری دارند، عمل کند."},{"type":"مقیاس","name":"انعطاف پذیری","level":"بالا","kind":"شغلی","desc":"افراد با انعطاف‌پذیری زیاد به‌طور معمول از تجربیات جدید استقبال می‌کنند و علاقه‌مند به نوآوری، یادگیری، و تغییرات هستند. این افراد تمایل دارند که به ایده‌های نو و راه‌حل‌های غیرمتعارف توجه کنند و در مشاغلی که نیاز به تفکر خلاقانه و حل مسائل جدید دارند، عملکرد بسیار خوبی خواهند داشت.","traits":"تمایل به نوآوری و تفکر خلاقانه: این افراد به‌راحتی وارد دنیای جدیدی از ایده‌ها و تجربیات می‌شوند. آن‌ها از چالش‌های فکری لذت می‌برند و می‌توانند در محیط‌های خلاقانه و پژوهشی عملکرد برجسته‌ای داشته باشند.\nکنجکاوی بی‌پایان: این افراد علاقه زیادی به یادگیری دارند و همواره در جستجوی اطلاعات جدید هستند. تمایل دارند که همیشه به‌دنبال روش‌های نوین برای انجام کارها باشند.\nپذیرش تغییرات بزرگ و ریسک‌پذیری: این افراد به راحتی با تغییرات عمده در سازمان‌ها یا پروژه‌ها سازگار می‌شوند و ممکن است خود نیز پیشگام این تغییرات باشند.","challenges":"مشکل در محیط‌های سنتی و ثابت، تعامل با افراد مقاوم به تغییر","performance":"عملکرد برتر در محیط‌های نوآور و خلاقانه و قادر به ایجاد راه‌ حل‌های نوآورانه و انجام وظایف پیچیده و رهبری در پروژه‌های نوآورانه و تطبیق با تحولات سریع."},{"type":"مقیاس","name":"برونگرایی","level":"پایین","kind":"شغلی","desc":"افراد با برون‌گرایی کم (درون‌گرا) تمایل دارند که در محیط‌های آرام و کم‌تعامل فعالیت کنند. این افراد اغلب ترجیح می‌دهند کارهای خود را به‌صورت مستقل انجام دهند و در جمع‌های شلوغ انرژی زیادی از دست می‌دهند.","traits":"تمرکز بر کارهای انفرادی: توانایی بسیار بالا در انجام وظایف انفرادی که نیاز به تمرکز عمیق دارند.\nتوجه به جزئیات: کسانی که برون‌گرایی کمی دارند اغلب صبور و دقیق هستند و در کارهایی که نیازمند دقت بالا است، عملکرد مثبتی نشان می‌دهند.\nتعامل محدود: این افراد معمولاً در روابط اجتماعی محتاط هستند و تمایل دارند تنها در صورت نیاز وارد تعاملات تیمی شوند.","challenges":"دشواری در پروژه‌های تیمی و کمبود مشارکت اجتماعی یا ارائه ایده و احساس انزوا در محیط‌های برون‌گرا و ضعف در ارائه ایده‌ها در جمع یا دفاع از پروژه‌ها و نظرات شخصی.","performance":"استقلال‌طلبی و تمایل به محیط‌های آرام و ساختارمند و  ترجیح به کار به‌صورت فردی و خودمختار و پرهیز از حضور فعال در فعالیت‌های جمعی."},{"type":"مقیاس","name":"برونگرایی","level":"متوسط","kind":"شغلی","desc":"افراد با سطح متوسط برون‌گرایی تعادل خوبی بین کارهای انفرادی و تعاملات اجتماعی دارند. آن‌ها می‌توانند در محیط‌های ترکیبی به‌خوبی عملکرد داشته باشند و انعطاف‌پذیری بیشتری در کارهای تیمی یا انفرادی دارند.","traits":"تعامل مناسب با دیگران: این افراد تمایل دارند روابط اجتماعی خوبی با همکاران خود برقرار کنند، اما در عین حال برای حفظ بهره‌وری نیازمند زمان‌هایی برای تمرکز شخصی هستند.\nانعطاف‌پذیری در دادوستد اجتماعی: می‌توانند هم در جمع‌های گروهی و هم در کارهای انفرادی عملکرد متعادلی داشته باشند.\nعملکرد بهینه در محیط‌های منعطف: این افراد توانایی بالایی در ترکیب کارهای خلاقانه و ساختاریافته دارند.","challenges":"احساس ناهمخوانی در محیط‌های بسیار اجتماعی یا بسیار فردگرا و خستگی روانی در محیط‌های فشارمحور","performance":"توانایی کار تیمی یا فردی با انعطاف بالا در موقعیت‌های مختلف و مشارکت در جمع‌های کاری در صورت ضرورت، نه به‌عنوان یک نیاز اصلی و توانایی انجام کارهای تحت فشار، اما ممکن است در تصمیم‌گیری‌های سریع با چالش مواجه شوند."},{"type":"مقیاس","name":"برونگرایی","level":"بالا","kind":"شغلی","desc":"افراد بسیار برون‌گرا تمایل به تعاملات اجتماعی بالا، جلب توجه، و انرژی گرفتن از کارهای گروهی دارند. این ویژگی‌ها باعث می‌شود که آن‌ها در محیط‌هایی با تعاملات اجتماعی گسترده عملکرد بسیار مطلوبی داشته باشند.","traits":"انرژی و نشاط بالا: این افراد در جمع‌های بزرگ راحت هستند و از تعاملات اجتماعی مداوم انرژی می‌گیرند.\nتعامل و شبکه‌سازی قوی: ارتباط‌گیری سریع و ساخت روابط اجتماعی یکی از نقاط قوت آن‌ها است.\nتمایل به رهبری و جلب توجه: ذهنیت فعال و رهبری در جمع ویژگی قابل‌توجه این افراد است.","challenges":"چالش در محیط‌های نیازمند تمرکز فردی و ناتوانی در درک نیاز افراد درون‌گرا و کاهش کیفیت در کارهای جزئی","performance":"انرژی‌گرفتن از تعاملات اجتماعی و همکاری تیمی و علاقه شدید به شبکه‌سازی و برقراری ارتباطات جدید و مقاومت کمتر در برابر تغییرات."},{"type":"مقیاس","name":"دلپذیر بودن","level":"پایین","kind":"شغلی","desc":"افراد با توافق پایین تمایل دارند تا بیشتر بر منافع شخصی خود تمرکز کنند و ممکن است در شرایطی که نیاز به همکاری و تعامل سازنده با دیگران است، با چالش روبه‌رو شوند. این افراد معمولاً کمتر تحت تأثیر نیازهای اجتماعی و فردی دیگران قرار می‌گیرند و بیشتر تمایل دارند تصمیمات خود را بر اساس اصول و منافع خود اتخاذ کنند.","traits":"تمرکز بر خود: افراد با توافق پایین ممکن است در موقعیت‌های کاری کمتر به همکاران خود توجه داشته باشند و بیشتر بر اهداف و منافع خود تمرکز کنند. این ویژگی می‌تواند در مشاغلی که به استقلال و تصمیم‌گیری فردی نیاز دارند، مفید باشد.\nمقاومت در برابر فشار اجتماعی: این افراد ممکن است در برابر فشارهای تیمی یا اجتماعی کمتر تسلیم شوند و توانایی بالایی در اتخاذ تصمیمات مستقل دارند.\nتوانایی در مدیریت تعارض‌ها: در صورت بروز تعارض یا مشکلات بین‌فردی، این افراد تمایل دارند تا به‌طور مستقیم و قاطعانه مسائل را حل کنند و از کنار آمدن با اختلافات اجتناب نمی‌کنند.","challenges":"مواجهه با مخالفت‌ها و انتقادات","performance":"عملکرد قوی در مشاغل مدیریتی و رقابتی"},{"type":"مقیاس","name":"دلپذیر بودن","level":"متوسط","kind":"شغلی","desc":"افراد با سطوح متوسط توافق و دلپذیر بودن معمولاً قادر به حفظ تعادل بین همکاری با دیگران و دفاع از منافع خود هستند. این افراد تمایل دارند که در موقعیت‌های تیمی و اجتماعی همکاری کنند، اما در مواقع لزوم قادرند در مقابل انتقادات یا فشارهای محیطی ایستادگی کنند و از دیدگاه‌های خود دفاع کنند.","traits":"همکاری متعادل: این افراد تمایل دارند به‌طور متعادل در محیط‌های تیمی همکاری کنند و در عین حال استقلال و خودکفایی خود را حفظ نمایند.\nپذیرش بازخورد: افراد با توافق متوسط قادر به پذیرش بازخورد و انتقادات هستند و معمولاً از آن‌ها برای بهبود عملکرد خود استفاده می‌کنند، اما در صورت لزوم از دفاع از خود نیز نمی‌هراسند.\nدفاع از دیدگاه‌ها: این افراد در مواجهه با شرایط چالش‌برانگیز یا درگیری‌های کاری، قادر به ایستادگی در برابر فشارهای تیمی یا فشارهای بیرونی هستند.","challenges":"دفاع از خود در برابر فشارهای بیش از حد","performance":"عملکرد خوب در مشاغل با تعامل و رقابت متوسط"},{"type":"مقیاس","name":"دلپذیر بودن","level":"بالا","kind":"شغلی","desc":"افراد با توافق و دلپذیر بودن بالا به‌طور طبیعی تمایل دارند تا روابط مثبت و سازنده‌ای با دیگران برقرار کنند. این ویژگی باعث می‌شود که آن‌ها در محیط‌های کاری که نیاز به همکاری، هماهنگی و درک متقابل دارند، عملکرد بسیار خوبی داشته باشند. این افراد تمایل دارند در موقعیت‌های اجتماعی و گروهی با مهربانی و همدلی برخورد کنند، اما ممکن است در شرایطی که نیاز به تصمیم‌گیری قاطع و دفاع از منافع شخصی دارند، دچار چالش شوند.","traits":"همدلی و همکاری: این افراد تمایل دارند تا در فعالیت‌های گروهی مشارکت کنند و به همکاری با همکاران خود اهمیت زیادی می‌دهند. آن‌ها در برقراری ارتباطات مؤثر، ایجاد انگیزه و حفظ روحیه تیمی مهارت دارند.\nتمایل به اجتناب از درگیری: افراد با توافق بالا معمولاً از درگیری‌های بین‌فردی و نزاع‌های شغلی اجتناب می‌کنند و سعی می‌کنند جو مثبت و آرامی در محیط کار حفظ کنند.\nپذیرش نظرات دیگران: این افراد قادر به پذیرش نظرات مختلف و همکاری با افراد با دیدگاه‌های متفاوت هستند. با این حال، ممکن است در مواجهه با انتقادات منفی و مواجهه با افراد بسیار تهاجمی یا رقیب‌طلب، احساس آسیب‌پذیری کنند.","challenges":"فداکاری بیش از حد، ناتوانی در دفاع از خود","performance":"عملکرد عالی در مشاغل تیمی و خدماتی"}],"beh_sub":[{"name":"کفایت","level":"پایین","desc":"افرادی که در شاخص شایستگی نمرات پایین‌تری کسب می‌کنند، معمولاً به سازماندهی و انجام وظایف با دقت کمتر توجه دارند. این افراد ممکن است به راحتی از مسیر اهداف خود منحرف شوند و تمرکز کمتری بر وظایف بلندمدت داشته باشند.","traits_short":"کمتر خود انضباط: این افراد ممکن است به راحتی از کارهای مهم خود منحرف شوند و تمایل به انجام کارها به صورت فوری یا به شکل غیرمنظم دارند.\nبی‌برنامه‌ریزی: نداشتن برنامه‌ریزی دقیق برای انجام کارها و نداشتن اولویت‌بندی مناسب ممکن است موجب شود که این افراد در رسیدن به اهداف خود با مشکل مواجه شوند.\nبی‌توجه به جزئیات: این افراد ممکن است به جزئیات کارها توجه کمی داشته باشند و از دقت لازم در انجام وظایف خود برخوردار نباشند.\nاحساسات فردی غالب: ممکن است تمایلات و احساسات شخصی بر رفتارها و تصمیماتشان تأثیر بگذارد و کمتر به تعهدات یا اهداف بلندمدت خود پایبند باشند.","traits":"اعتماد به نفس پایین، وابستگی به دیگران، اجتناب از چالش","challenges":"حساسیت به انتقاد، مشکل در همکاری مؤثر"},{"name":"کفایت","level":"متوسط","desc":"افرادی که در این شاخص نمرات متوسط دارند، معمولاً ویژگی‌های متعادل‌تری از شایستگی را از خود نشان می‌دهند. این افراد توانایی مدیریت وظایف خود را دارند، اما ممکن است در بعضی مواقع نسبت به دقت در جزئیات یا سازماندهی کارها دقت کمتری داشته باشند.","traits_short":"تعادل در سازماندهی: افراد با نمرات متوسط در شایستگی قادرند تا در بیشتر موارد کارهای خود را سازماندهی کنند، اما در مواقع خاص ممکن است از مسیر مشخص خود منحرف شوند یا برنامه‌ریزی کمتری انجام دهند.\nتوانایی در مدیریت زمان: این افراد معمولاً در انجام وظایف خود توانایی خوبی دارند، اما ممکن است گاهی اوقات در مدیریت زمان یا پایبندی به تعهدات خود با چالش‌هایی مواجه شوند.\nمراقبت از جزئیات: این افراد در اکثر موارد به جزئیات توجه می‌کنند، اما ممکن است گاهی اوقات به دلیل فشار کار یا تصمیمات فوری از دقت در جزئیات غافل شوند.\nهدف‌گذاری متغیر: این افراد معمولاً به دنبال اهداف مشخصی هستند، اما در عین حال ممکن است نیاز به کمک یا مشاوره برای ایجاد نظم و انضباط بیشتر در زندگی خود داشته باشند.","traits":"تعادل در اعتماد به نفس، پذیرش یادگیری، سازگاری","challenges":"نیاز به راهنمایی، نوسان در تنظیم انتظارات"},{"name":"کفایت","level":"بالا","desc":"افرادی که نمرات بالایی در شاخص شایستگی کسب می‌کنند، معمولاً افرادی بسیار دقیق، منظم و هدف‌گرا هستند که توانایی بالایی در سازماندهی و انجام کارها به بهترین نحو دارند. این افراد بیشتر از دیگران به جزئیات توجه کرده و به تعهدات خود پایبند هستند.","traits_short":"خودانضباطی بالا: این افراد معمولاً از خود انضباط بالایی برخوردارند و به راحتی می‌توانند کارهای خود را طبق برنامه پیش ببرند.\nهدف‌گذاری و سازماندهی دقیق: آن‌ها به راحتی اهداف بلندمدت خود را مشخص کرده و به دنبال تحقق آن‌ها به طور سیستماتیک و دقیق می‌روند.\nتوجه به جزئیات: این افراد به جزئیات کارها توجه زیادی دارند و هیچ چیزی را بی‌دقت انجام نمی‌دهند.\nاعتماد به نفس در انجام وظایف: این افراد معمولاً خود را مسئول و قابل اعتماد می‌دانند و به راحتی می‌توانند وظایف پیچیده و چالش‌برانگیز را با موفقیت انجام دهند.","traits":"اعتماد به نفس بالا، عملکرد متعهد، رهبری مؤثر","challenges":"انتظارات بالا از دیگران، گرایش به کنترل‌گری"},{"name":"نظم و قدرت","level":"پایین","desc":"افرادی که در شاخص نظم و ترتیب نمرات پایین کسب می‌کنند، انعطاف بیشتری نسبت به چیدمان و ساختار محیط اطراف خود دارند و معمولاً خیلی نگران بی‌نظمی یا عدم سازماندهی نیستند.","traits_short":"بی‌توجه به ساختار: این افراد ممکن است نسبت به نظم محیط اطراف (مانند میز کار، اتاق، یا فعالیت‌های روزمره) بی‌تفاوت باشند.\nتمرکز بر ایده‌ها: تمایل دارند بیشتر روی خلاقیت یا انجام کارهای فوری تمرکز کنند تا برنامه‌ریزی دقیق یا سازماندهی جزئیات.\nبی‌برنامگی: ممکن است برنامه‌های زمانی جدی نداشته باشند یا کارهای خود را در آخرین لحظه انجام دهند.\nانگیزه تصادفی: این افراد برای انجام کارها بیشتر به انگیزه‌های موقت متکی هستند تا به دنبال یک ساختار ثابت.","traits":"انعطاف بالا، بی‌علاقگی به جزئیات، رویکرد غیررسمی","challenges":"ناهماهنگی در تیم، ناتوانی در رعایت استانداردها"},{"name":"نظم و قدرت","level":"متوسط","desc":"افرادی که در شاخص نظم و ترتیب نمرات متوسط کسب می‌کنند، معمولاً تعادلی بین گرایش به نظم و انعطاف در محیط خود دارند. آن‌ها سازمان‌دهی را می‌پذیرند اما بسته به موقعیت ممکن است رویکرد خود را تغییر دهند.","traits_short":"ترکیب نظم و انعطاف: این افراد در برخی موارد محیط اطراف خود را منظم می‌کنند اما همیشه به دنبال حفظ این ساختار نیستند.\nمدیریت قابل قبول: توانایی مدیریت وظایف روزمره را دارند، اما گاهی اوقات ممکن است شرایط غیرمنتظره یا فشار زیاد عملکردشان را تحت تأثیر قرار دهد.\nگاهی بی‌برنامه: ممکن است برخی از روزها منظم و دقیق عمل کنند، اما در مواقعی نیز ترجیح دهند بی‌نظمی را بپذیرند.","traits":"تعادل در دقت و سرعت، انعطاف‌پذیری نسبی","challenges":"توازن در انتظارات، نیاز به هدایت گاه‌به‌گاه"},{"name":"نظم و قدرت","level":"بالا","desc":"افرادی که نمرات بالایی در شاخص نظم و ترتیب کسب می‌کنند، علاقه شدیدی به سازماندهی و حفظ ترتیب در کارها، محیط اطراف و حتی افکار خود دارند. آن‌ها به دنبال ساختاردهی و داشتن یک سیستم مشخص برای هر چیز هستند.","traits_short":"توجه بالا به ساختار: این افراد معمولاً تمام ابزارها، اسناد و محیط اطراف خود را مرتب نگه می‌دارند.\nاولویت‌بندی دقیق: آن‌ها می‌دانند که چگونه کارها را به ترتیب اهمیت انجام دهند و تمام برنامه‌هایشان را از پیش مشخص کرده‌اند.\nاستانداردهای بالا: این افراد ممکن است نسبت به کوچک‌ترین بی‌نظمی حساس باشند و حتی دیگران را نیز به رعایت نظم تشویق کنند.\nتعهد به سازمان‌دهی: معمولاً در کارها و پروژه‌های گروهی نقش ساماندهی و مدیریت ساختاری را ایفا می‌کنند.","traits":"دقت و جزئی‌نگری، برنامه‌ریزی دقیق، تعهد به حفظ نظم","challenges":"انتظارات بالا از دیگران، انعطاف‌ناپذیری"},{"name":"وظیفه شناسی","level":"پایین","desc":"افرادی که وظیفه‌شناسی کمی دارند معمولاً در پایبندی به تعهدات و قوانین ضعف نشان می‌دهند و گاهی تمایل دارند بر اساس میل شخصی یا انگیزه‌های لحظه‌ای عمل کنند.","traits_short":"نادیده‌گرفتن تعهدات: ممکن است وظایفی که به آن‌ها محول شده را به موقع یا به درستی انجام ندهند.\nاولویت دادن به نیازهای شخصی: اغلب ترجیح می‌دهند کارهایی را انجام دهند که برایشان لذت‌بخش است، حتی اگر این کارها با وظایفشان تناقض داشته باشد.\nبی‌تفاوتی به انتظارات جمعی: ممکن است نسبت به قواعد اجتماعی یا کاری بی‌اعتنا باشند.\nتأخیر در انجام وظایف: تمایل به تعلل و انجام کارها در دقیقه آخر دارند.","traits":"بی‌اعتنایی به قوانین، انعطاف بیش‌ازحد، تمرکز بر آزادی عمل","challenges":"کمبود تعهد، تضاد با مدیران"},{"name":"وظیفه شناسی","level":"متوسط","desc":"افرادی در این سطح معمولاً در رعایت تعهدات و انجام وظایف تعادل برقرار می‌کنند. گاهی به خوبی وظایف را انجام می‌دهند، اما ممکن است در شرایط فشار یا پیچیدگی زیاد، از مسئولیت‌ها منحرف شوند.","traits_short":"رعایت نسبی تعهدات: معمولاً وظایف خود را انجام می‌دهند، اما ممکن است گاهی بی‌دقتی یا بی‌تفاوتی نشان دهند.\nاولویت‌بندی متغیر: وظایفی که برایشان جذاب‌تر یا ساده‌ترند، در اولویت آن‌ها قرار می‌گیرد.\nفشارپذیری: گاهی تحت فشار ممکن است کیفیت کارشان کاهش یابد یا تعهدشان کمرنگ شود.","traits":"تعهد مطلوب، رعایت قوانین همراه با انعطاف، تمرکز بر نتایج","challenges":"توازن در انتظارات، نیاز به تأیید"},{"name":"وظیفه شناسی","level":"بالا","desc":"افرادی که از وظیفه‌شناسی بالایی برخوردارند، به تعهدات خود بسیار پایبندند و انجام درست وظایف را بخشی از هویت خود می‌دانند. این افراد به شدت به اصول اخلاقی، قوانین و مقررات اهمیت داده و تلاش می‌کنند وظایف خود را به بهترین نحو ممکن انجام دهند.","traits_short":"پایبندی بالا به تعهدات: این افراد نه تنها به تعهدات خود احترام می‌گذارند بلکه به دیگران نیز برای رعایت مسئولیت‌ها فشار وارد می‌کنند.\nاخلاق‌مداری: اصول اخلاقی و رعایت قوانین برایشان بسیار مهم است و سعی می‌کنند دیگران را نیز به این موضوع تشویق کنند.\nپیگیری کامل وظایف: حتی در شرایط سخت، تا پایان وظایفشان را دنبال می‌کنند.\nحساسیت زیاد: ممکن است نسبت به کوچک‌ترین نقص یا کوتاهی در انجام وظایف خود یا دیگران واکنش نشان دهند.","traits":"تعهد بالا به مسئولیت‌ها، پایبندی به قوانین، وجدان قوی","challenges":"سخت‌گیری نسبت به دیگران، عدم تحمل خطا"},{"name":"تلاش برای موفقیت","level":"پایین","desc":"افرادی که در این سطح از تلاش برای موفقیت هستند ممکن است کمتر به اهداف بلندمدت اهمیت دهند و انگیزه کمتری برای پیشرفت در زندگی حرفه‌ای و شخصی داشته باشند.","traits_short":"بی‌تفاوتی به اهداف: ممکن است علاقه‌ چندانی به تعیین و پیگیری اهداف بزرگ نداشته باشند.\nرضایت از وضعیت فعلی: تمایل به حفظ وضعیت موجود بدون تلاش برای بهبود.\nاجتناب از چالش‌ها: تمایل به اجتناب از فشار و رقابت ممکن است باعث شود که کمتر خواهان ورود به موقعیت‌های چالش‌برانگیز باشند.\nانگیزه پایین: اغلب به انگیزه‌ها و تشویق‌های خارجی نیاز دارند تا بتوانند از محدوده راحتی خود خارج شوند.","traits":"انگیزه پایین، عدم هدف‌گذاری، تمرکز بر راحتی","challenges":"عدم تعهد به تیم، تضاد با افراد هدف‌گرا"},{"name":"تلاش برای موفقیت","level":"متوسط","desc":"افرادی با نمرات متوسط تلاش برای موفقیت معمولاً توازنی میان دستیابی به اهداف و حفظ راحتی و رضایت خود دارند. آن‌ها در برخی مواقع مصمم و در مواقع دیگر بی‌تفاوت به نظر می‌رسند.","traits_short":"تعادل بین اهداف و لذت: به دنبال موفقیت هستند، اما ممکن است در مواقعی از تلاش برای حفظ تعادل بین عملکرد و راحتی خودداری کنند.\nانگیزه تابع شرایط: در شرایط مناسب می‌توانند خود را به تمرکز بیشتری معطوف کنند، اما ممکن است در شرایط دیگری انگیزه کاهش یابد.\nآگاهی از توانمندی‌ها: می‌دانند چه کارهایی را می‌توانند به‌خوبی انجام دهند و در آن‌ها موفق می‌باشند.","traits":"انگیزه متعادل، هدف‌گذاری واقع‌بینانه، انعطاف‌پذیری","challenges":"مدیریت انتظارات، نیاز به انگیزه خارجی"},{"name":"تلاش برای موفقیت","level":"بالا","desc":"افرادی که در این دسته قرار می‌گیرند، انگیزه بالایی برای دستیابی به موفقیت و بهبود مستمر خود دارند. آن‌ها به شدت متعهد به پیشرفت شخصی و حرفه‌ای هستند و معمولاً در پی دستیابی به معیارهای بالای عملکردی می‌باشند.","traits_short":"هدف‌گرایی قوی: تمایل به تعیین اهداف بلندپروازانه و پیشرفت مداوم.\nپیگیری و پایداری: به‌ندرت از اهداف خود دست می‌کشند و تا رسیدن به نتایج مطلوب تلاش می‌کنند.\nحساس به کیفیت عملکرد: تمایل به ارزیابی دقیق کارها و تلاش برای بهبود مداوم.\nرقابت‌طلبی: انگیزه برای رقابت با دیگران و رسیدن به موقعیت‌های برتر.","traits":"انگیزه بالا، هدف‌گرایی، پشتکار","challenges":"رقابت‌طلبی بیش‌ازحد، انتظارات بالا"},{"name":"خویشتن داری","level":"پایین","desc":"افرادی که خویشتنداری کمی دارند معمولاً در کنترل انگیزه‌های فوری و تحمل شرایط ناخواسته ضعف نشان می‌دهند و ممکن است به‌راحتی از برنامه‌های خود منحرف شوند.","traits_short":"ضعف در برنامه‌ریزی و پیگیری: اغلب نمی‌توانند برنامه‌های خود را به‌درستی اجرا کنند.\nتفریح‌گرایی بیش از حد: تمایل به انتخاب فعالیت‌هایی که سریعاً لذت‌بخش هستند به‌جای پایبندی به وظایف.\nتردید در مقابل تغییرات: ممکن است به‌راحتی از تغییرات در برنامه یا اهداف کناره‌گیری کنند.\nعدم تحمل تأخیرات: برای رسیدن به نتایج فوری عجله دارند.","traits":"اهمال‌کاری و تأخیر، مشکل در تمرکز، تمایل به کارهای آسان","challenges":"عدم اعتماد همکاران، تنش با مدیران"},{"name":"خویشتن داری","level":"متوسط","desc":"در این سطح، افراد می‌توانند به‌طور متوسطی تعادلی از خویشتنداری را نشان دهند. آن‌ها ممکن است در برخی موقعیت‌ها از انجام وظایف عقب‌نشینی کنند اما به‌طور کلی در کنترل رفتارشان موفق هستند.","traits_short":"تعادل میان انگیزه‌ها و وظایف: معمولاً می‌توانند میان لذت فوری و تعهدات بلندمدت تعادل برقرار کنند.\nتلاش برای حفظ تمرکز: اگرچه ممکن است گاهی منحرف شوند، اما به‌طور کلی قادر به انجام وظایف هستند.\nحساسیت به زمان: به‌طور کلی زمان‌بندی خوبی دارند اما گاهی ممکن است تا حدودی از زمان منحرف شوند.","traits":"تعهد متعادل، تمرکز نسبی، انعطاف‌پذیری منطقی","challenges":"خطر کمبود تأثیرگذاری، نیاز به تشویق"},{"name":"خویشتن داری","level":"بالا","desc":"این افراد سطح بالایی از کنترل و پایداری در انجام وظایف دارند. خویشتنداری بالا به آن‌ها این امکان را می‌دهد که در مواجهه با فشار و وسوسه به‌خوبی رفتار خود را مدیریت کنند.","traits_short":"اجرای دقیق برنامه‌ها: به‌صورت دقیق و مداوم بر روی اهداف خود متمرکز می‌مانند.\nپایداری در مقابل چالش‌ها: بدون در نظر گرفتن موانع، وظایف خود را انجام می‌دهند.\nکنترل هیجانات و انگیزه‌ها: توانایی فوق‌العاده‌ای در کنترل و تعدیل این عوامل دارند.\nتعهد به اهداف بلندمدت: توانایی تدبیر و دستیابی به اهداف بلندمدت دارند.","traits":"تمرکز بالا، پایبندی به تعهدات، پایداری","challenges":"سخت‌گیری نسبت به دیگران، کمبود انعطاف در شرایط متغیر"},{"name":"محتاط در تصمیم گیری","level":"پایین","desc":"افرادی که در این سطح از محتاط بودن قرار دارند، معمولاً بدون فکر کردن کافی و ارزیابی دقیق به انتخاب‌های خود دست می‌زنند و ممکن است به‌راحتی در معرض اشتباهات یا تصمیمات ناخواسته قرار گیرند.","traits_short":"عجول بودن در تصمیم‌گیری: این افراد ممکن است سریع‌تر از دیگران تصمیم بگیرند بدون آنکه تمامی جوانب آن را بررسی کنند.\nعدم توجه به پیامدها: اغلب به پیامدهای بلندمدت و عواقب تصمیمات خود توجه نمی‌کنند.\nریسک‌پذیری بالا: تمایل به انتخاب گزینه‌هایی دارند که ممکن است دارای ریسک یا عدم اطمینان بالا باشند.\nاعتماد بیش از حد به غریزه: ممکن است بیشتر بر اساس احساسات یا غریزه عمل کنند تا تجزیه و تحلیل منطقی.","traits":"ریسک‌پذیری بالا، اقدام سریع، تمرکز بر نوآوری","challenges":"عدم پذیرش جزئیات‌نگری، ایجاد احساس خطر در تیم"},{"name":"محتاط در تصمیم گیری","level":"متوسط","desc":"افرادی که در سطح متوسط از محتاط بودن در تصمیم‌گیری قرار دارند، به‌طور نسبی قادر به ارزیابی تصمیمات خود هستند، اما گاهی ممکن است در مواقعی که نیاز به سرعت عمل دارند، به انتخاب‌های عجولانه روی بیاورند.","traits_short":"توازن میان احتیاط و سرعت: این افراد معمولاً توانایی خوبی در تصمیم‌گیری‌های متعادل دارند و در مواقع بحرانی قادر به تصمیم‌گیری سریع هستند، اما در شرایط عادی بیشتر از زمان و تجزیه و تحلیل بهره می‌برند.\nبررسی پیامدهای کوتاه‌مدت: ممکن است در تصمیم‌گیری‌های روزمره بیشتر به پیامدهای فوری و کوتاه‌مدت توجه کنند.\nانعطاف‌پذیری در مواجهه با شرایط جدید: این افراد ممکن است در مواجهه با شرایط جدید به‌سرعت واکنش نشان دهند، ولی همچنان از ارزیابی دقیق بی‌بهره نمی‌مانند.\nاستفاده از تجربیات گذشته: ممکن است از تجربیات گذشته برای تصمیم‌گیری در شرایط مشابه استفاده کنند، ولی این ارزیابی همیشه دقیق نباشد.","traits":"انعطاف‌پذیری، ریسک‌پذیری معقول، کارآیی در تصمیم‌گیری","challenges":"مدیریت نظرات متناقض، نیاز به بازخورد"},{"name":"محتاط در تصمیم گیری","level":"بالا","desc":"افرادی که در این دسته قرار دارند، بسیار دقیق و حساب‌شده عمل می‌کنند و به‌ندرت از تصمیمات خود پشیمان می‌شوند. این افراد تمایل دارند تمامی گزینه‌ها و پیامدهای ممکن را بررسی کنند قبل از اینکه اقدامی انجام دهند.","traits_short":"تحلیل دقیق و گسترده: این افراد قبل از تصمیم‌گیری به‌طور دقیق و جامع تمامی جوانب و گزینه‌های موجود را بررسی می‌کنند.\nاحتیاط در مواجهه با ریسک‌ها: تمایل دارند از ریسک‌های غیرضروری اجتناب کنند و همیشه به دنبال انتخاب کم‌خطرتر هستند.\nتوجه به پیامدهای بلندمدت: این افراد بیشتر به تأثیرات بلندمدت تصمیمات خود توجه دارند و برای آنها اهمیت بالایی قائل هستند.\nکندی در تصمیم‌گیری: ممکن است در شرایطی که نیاز به تصمیم‌گیری سریع دارند، دچار تردید یا تأخیر شوند.","traits":"دقت بالا، پرهیز از ریسک، تمرکز بر برنامه‌ریزی","challenges":"کندی در اجرای تیمی، ارتباط محدود با افراد ریسک‌پذیر"},{"name":"تخیل","level":"پایین","desc":"افرادی که تخیل کمی دارند، معمولاً به واقعیت‌های موجود و روش‌های سنتی پایبند هستند و کمتر به دنبال ایده‌های جدید و خلاقانه می‌روند.","traits_short":"پایبندی به واقعیت: این افراد معمولاً به واقعیت‌های موجود و روش‌های سنتی پایبند هستند.\nعدم تمایل به تغییر: تمایل کمتری به تغییر و نوآوری دارند و بیشتر به روش‌های اثبات‌شده اعتماد می‌کنند.\nتفکر خطی: معمولاً به‌صورت خطی و منطقی فکر می‌کنند و کمتر به ایده‌های خلاقانه و نوآورانه می‌پردازند.\nتمرکز بر جزئیات: بیشتر به جزئیات و واقعیت‌های ملموس توجه دارند تا ایده‌های انتزاعی.","traits":"پایبندی به واقعیت، ثبات در عملکرد، تمرکز بر جزئیات","challenges":"مقاومت در برابر تغییر، ارتباط محدود با افراد خلاق"},{"name":"تخیل","level":"متوسط","desc":"افرادی که در سطح متوسط از تخیل قرار دارند، توانایی خوبی در خلق ایده‌های جدید دارند اما ممکن است در برخی مواقع به واقعیت‌های موجود پایبند بمانند.","traits_short":"تعادل میان واقعیت و تخیل: این افراد معمولاً توانایی خوبی در خلق ایده‌های جدید دارند اما همچنان به واقعیت‌های موجود پایبند هستند.\nانعطاف‌پذیری در تفکر: قادر به تغییر دیدگاه‌ها و پذیرش ایده‌های جدید هستند.\nتمایل به نوآوری: علاقه‌مند به نوآوری و تجربه‌های جدید هستند اما ممکن است در برخی مواقع به روش‌های سنتی بازگردند.\nتفکر تحلیلی و خلاقانه: توانایی ترکیب تفکر تحلیلی و خلاقانه را دارند.","traits":"خلاقیت متعادل، توانایی حل مسئله، انعطاف‌پذیری معقول","challenges":"نیاز به تأیید، مدیریت انتظارات"},{"name":"تخیل","level":"بالا","desc":"افرادی که در این دسته قرار دارند، ذهنی بسیار خلاق و پویا دارند و به‌راحتی می‌توانند ایده‌های جدید و نوآورانه خلق کنند.","traits_short":"تفکر خلاقانه و نوآورانه: این افراد ذهنی بسیار خلاق و پویا دارند و به‌راحتی می‌توانند ایده‌های جدید و نوآورانه خلق کنند.\nپذیرش ایده‌های جدید: تمایل به پذیرش و بررسی ایده‌های جدید و متفاوت دارند.\nانعطاف‌پذیری در تفکر: قادر به تغییر دیدگاه‌ها و پذیرش ایده‌های جدید هستند.\nتوجه به احتمالات: بیشتر به احتمالات و ایده‌های انتزاعی توجه دارند تا واقعیت‌های ملموس.","traits":"خلاقیت بالا، دیدگاه‌های نوآورانه، انعطاف‌پذیری ذهنی","challenges":"عدم درک توسط دیگران، تضاد با ساختارهای سنتی"},{"name":"زیبایی پسندی","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً توجه چندانی به جنبه‌های زیبایی‌شناختی زندگی ندارند. آن‌ها ممکن است نسبت به هنر، موسیقی یا تجربیات زیباشناختی واکنش قوی نشان ندهند یا علاقه‌ی خاصی به این نوع فعالیت‌ها نداشته باشند.","traits_short":"تمرکز بر عملکرد و کاربرد: این افراد بیشتر به جنبه‌های عملی و کاربردی محیط خود توجه دارند تا جنبه‌های زیبایی‌شناختی.\nبی‌تفاوتی یا حس‌گری ضعیف: ممکن است در برابر زیبایی‌های طبیعت، آثار هنری یا موسیقی واکنش زیادی نشان ندهند.\nعدم علاقه به هنرهای زیباشناختی: ممکن است به هنر، موسیقی یا ادبیات علاقه چندانی نداشته باشند یا آن‌ها را نوعی فعالیت وقت‌گیر تلقی کنند.\nتفکر منطقی و پراگماتیک: بیشتر با مسائل منطقی و ملموس سر و کار دارند و کمتر با موضوعاتی که نیازمند حساسیت هنری است ارتباط برقرار می‌کنند.","traits":"عملگرا، ساده‌نگری، پایبندی به استانداردها","challenges":"ناتوانی در الهام‌بخشی، مقاومت در برابر تغییرات هنری"},{"name":"زیبایی پسندی","level":"متوسط","desc":"این افراد ترکیبی متعادل از تمایل به زیبایی و توجه به سایر جنبه‌های زندگی دارند. آن‌ها ممکن است از تجربیات هنری و زیبایی‌شناختی لذت ببرند، اما نقش اصلی زندگی خود را حول این موضوعات قرار نمی‌دهند.","traits_short":"لذت بردن از تجربه‌های زیبایی: این افراد از هنر، موسیقی یا طبیعت گاه‌به‌گاه لذت می‌برند، اما شاید به‌طور عمیق و مستمر به این تجربیات نپردازند.\nتعادل میان عملگرایی و زیباشناسی: آن‌ها توجه متعادلی به جهان عملی و جنبه‌های زیباشناختی دارند.\nعلاقه به فعالیت‌های هنری ساده: ممکن است به فعالیت‌هایی مثل فیلم، تئاتر، یا گاهی خواندن ادبیات کلاسیک علاقه‌مند باشند.\nباز بودن برای تجربه‌های جدید: این افراد حاضرند تجربیات جدید زیباشناختی را امتحان کنند، به شرط اینکه زمان یا هزینه زیادی را به خود اختصاص ندهد.","traits":"حساسیت متعادل، تمرکز روی بهره‌وری، انعطاف‌پذیری","challenges":"ارتباط با افراد کمال‌گرا، مدیریت تعادل تیمی"},{"name":"زیبایی پسندی","level":"بالا","desc":"افرادی که در این سطح قرار دارند، حساسیتی عمیق نسبت به زیبایی‌های هنری و طبیعی دارند. مواجهه با موسیقی، هنر، ادبیات یا زیبایی طبیعت، تأثیری عمیق و گاه احساسی بر آن‌ها می‌گذارد.","traits_short":"حساسیت عمیق: این افراد می‌توانند با موسیقی، هنر و طبیعت ارتباطی احساسی و اغلب معنوی برقرار کنند.\nجستجوی تجربیات زیباشناختی: آن‌ها به طور مداوم در جستجوی تجربیات هنری یا زیبایی‌شناختی هستند (مانند بازدید از موزه‌ها، شرکت در کنسرت‌ها یا وقت گذراندن در طبیعت).\nلذت از پیچیدگی‌های هنری: آثار پیچیده در موسیقی، ادبیات یا هنر کنترل‌نشده ارزش زیادی برای آن‌ها دارد.\nنقش عاطفی هنر: ممکن است آثار هنری یا زیبایی‌های طبیعی به‌شدت بر احساسات آن‌ها تأثیر بگذارند.","traits":"درک زیبایی، خلق محیط جذاب، توجه به جزئیات بصری","challenges":"عدم درک توسط دیگران، کمال‌گرایی"},{"name":"احساسات","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً کمتر به احساسات خود و دیگران توجه می‌کنند و ممکن است درک عمیقی از احساسات پیچیده نداشته باشند.","traits_short":"بی‌تفاوتی عاطفی: ممکن است نسبت به احساسات خود و دیگران بی‌تفاوت باشند یا واکنش‌های عاطفی ضعیفی نشان دهند.\nتمرکز بر منطق و عقلانیت: بیشتر به جنبه‌های منطقی و عقلانی مسائل توجه دارند و کمتر به احساسات و عواطف اهمیت می‌دهند.\nعدم تمایل به ابراز احساسات: ممکن است تمایل کمتری به ابراز احساسات خود داشته باشند و درک عمیقی از احساسات دیگران نداشته باشند.\nتفکر عملی و واقع‌گرایانه: بیشتر به مسائل عملی و واقع‌گرایانه توجه دارند و کمتر به جنبه‌های عاطفی و احساسی مسائل می‌پردازند.","traits":"ثبات عاطفی، هدف‌محوری، روابط منطقی","challenges":"فقدان همدلی، ناتوانی در تعامل عمیق عاطفی"},{"name":"احساسات","level":"متوسط","desc":"این افراد ترکیبی متعادل از توجه به احساسات و تمرکز بر جنبه‌های منطقی زندگی دارند. آن‌ها ممکن است از تجربیات عاطفی لذت ببرند، اما نقش اصلی زندگی خود را حول این موضوعات قرار نمی‌دهند.","traits_short":"تعادل میان احساسات و منطق: این افراد توانایی خوبی در تجربه و درک احساسات دارند، اما همچنان به جنبه‌های منطقی و عقلانی مسائل توجه می‌کنند.\nابراز احساسات به‌صورت متعادل: ممکن است احساسات خود را به‌صورت متعادل ابراز کنند و درک خوبی از احساسات دیگران داشته باشند.\nانعطاف‌پذیری عاطفی: قادر به تغییر دیدگاه‌ها و پذیرش احساسات جدید هستند.\nتمایل به تجربه‌های عاطفی: علاقه‌مند به تجربه‌های عاطفی و احساسی هستند، اما ممکن است در برخی مواقع به جنبه‌های منطقی بازگردند.","traits":"همدلی متعادل، مدیریت مؤثر احساسات، روابط منطقی","challenges":"رویکرد سرد نسبت به عاطفی‌ها، کمبود در موقعیت‌های حساس"},{"name":"احساسات","level":"بالا","desc":"افرادی که در این سطح قرار دارند، حساسیتی عمیق نسبت به احساسات خود و دیگران دارند و می‌توانند احساسات پیچیده و عمیق را تجربه کنند.","traits_short":"حساسیت عاطفی بالا: این افراد می‌توانند با احساسات خود و دیگران ارتباطی عمیق و اغلب معنوی برقرار کنند.\nتجربه احساسات پیچیده: قادر به تجربه و درک احساسات پیچیده و عمیق هستند.\nابراز احساسات به‌صورت قوی: تمایل به ابراز احساسات خود به‌صورت قوی و درک عمیق احساسات دیگران دارند.\nنقش عاطفی در تصمیم‌گیری: ممکن است احساسات نقش مهمی در تصمیم‌گیری‌های آن‌ها ایفا کند.","traits":"همدلی بالا، آگاهی عاطفی، ارتباط مؤثر","challenges":"حساسیت زیاد، احساس فرسودگی"},{"name":"اعمال","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً تمایل کمتری به تجربه‌های جدید و تغییرات دارند و ممکن است به روال‌های ثابت و آشنا پایبند باشند.","traits_short":"پایبندی به روال‌های ثابت: این افراد معمولاً به روال‌های روزمره و آشنا پایبند هستند و تمایل کمتری به تغییر دارند.\nمقاومت در برابر تغییر: ممکن است در برابر تغییرات و نوآوری‌ها مقاومت نشان دهند و به دنبال ثبات و امنیت باشند.\nتمرکز بر فعالیت‌های آشنا: بیشتر به فعالیت‌هایی که با آن‌ها آشنا هستند و احساس راحتی می‌کنند، می‌پردازند.\nتفکر محافظه‌کارانه: ممکن است دیدگاه‌های محافظه‌کارانه‌تری نسبت به زندگی و تغییرات داشته باشند.","traits":"ثبات‌محوری، تمرکز، احتیاط بالا","challenges":"عدم علاقه به تغییر، درک نشدن از سوی ماجراجویان"},{"name":"اعمال","level":"متوسط","desc":"این افراد ترکیبی متعادل از تمایل به تجربه‌های جدید و پایبندی به روال‌های آشنا دارند. آن‌ها ممکن است از فعالیت‌های جدید لذت ببرند، اما نقش اصلی زندگی خود را حول این موضوعات قرار نمی‌دهند.","traits_short":"تعادل میان ثبات و تغییر: این افراد توانایی خوبی در تجربه و پذیرش تغییرات دارند، اما همچنان به روال‌های آشنا پایبند هستند.\nانعطاف‌پذیری در فعالیت‌ها: قادر به تغییر فعالیت‌ها و پذیرش تجربه‌های جدید هستند، اما ممکن است به روال‌های ثابت نیز علاقه‌مند باشند.\nتمایل به تجربه‌های جدید: علاقه‌مند به تجربه‌های جدید و متنوع هستند، اما ممکن است در برخی مواقع به روال‌های آشنا بازگردند.\nپذیرش نوآوری‌ها: تمایل به پذیرش نوآوری‌ها و تغییرات در زندگی دارند، اما ممکن است به تدریج و با احتیاط عمل کنند.","traits":"ریسک‌پذیری منطقی، انعطاف متعادل، تمایل به پیشرفت","challenges":"تماشای محتاطانه، ضعف در محیط‌های بسیار پویا"},{"name":"اعمال","level":"بالا","desc":"افرادی که در این سطح قرار دارند، تمایل زیادی به تجربه‌های جدید و متنوع دارند و معمولاً به دنبال ماجراجویی و نوآوری هستند.","traits_short":"تمایل به ماجراجویی: این افراد به دنبال تجربه‌های جدید و ماجراجویی‌های متنوع هستند و از تغییرات استقبال می‌کنند.\nپذیرش نوآوری‌ها: قادر به پذیرش نوآوری‌ها و تغییرات در زندگی هستند و از آن‌ها لذت می‌برند.\nانعطاف‌پذیری بالا: توانایی بالایی در تغییر فعالیت‌ها و پذیرش تجربه‌های جدید دارند.\nنقش فعال در تغییرات: ممکن است نقش فعالی در ایجاد تغییرات و نوآوری‌ها در زندگی خود و دیگران ایفا کنند.","traits":"ریسک‌پذیری بالا، نوآوری، انرژی زیاد","challenges":"بی‌توجهی به نظرات محافظه‌کار، تحمل پایین یکنواختی"},{"name":"عقاید","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً نظرات و باورهای خود را به شدت ثابت و مقاوم در برابر تغییرات حفظ می‌کنند. آن‌ها به ندرت تمایل دارند دیدگاه‌های جدیدی را بپذیرند و در تفکر خود انعطاف‌پذیری کمی دارند.","traits_short":"پافشاری بر باورهای قبلی: این افراد ممکن است به شدت به باورها و دیدگاه‌های قبلی خود پایبند باشند و از پذیرش نظرات مخالف یا جدید پرهیز کنند.\nمحدودیت در تفکر انتقادی: ممکن است تفکر انتقادی یا توانایی تحلیل عقاید دیگران را نداشته باشند و تمایل به پذیرش فقط آنچه که برایشان آشناست، داشته باشند.\nتمایل به تفکر دودویی: در برخی مواقع، ممکن است تمایل به تفکر تک‌بعدی و سیاه‌وسفید داشته باشند و پیچیدگی‌های موجود در مسائل را نادیده بگیرند.\nاجتناب از تنوع فکری: از آنجا که این افراد تغییرات و نظرات مختلف را تهدیدی برای ثبات فکری خود می‌بینند، ممکن است از مواجهه با ایده‌های جدید اجتناب کنند.","traits":"تمرکز بر عملگرایی و انعطاف بیش از حد و بی‌نیازی به تئوری‌های پیچیده","challenges":"عدم جذابیت در بحث‌های فکری وسطحی بودن تعاملات"},{"name":"عقاید","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، تمایل دارند که نظرات خود را بر اساس تجربه و شواهد جدید بازبینی کنند، اما در عین حال ممکن است تمایلی به پذیرش تغییرات اساسی نداشته باشند.","traits_short":"انعطاف‌پذیری نسبی در عقاید: این افراد معمولاً قادرند نظرات و باورهای خود را در برابر اطلاعات جدید تغییر دهند، اما ممکن است همچنان دیدگاه‌های قدیمی خود را حفظ کنند.\nتعادل میان تثبیت عقاید و پذیرش ایده‌های جدید: در این سطح، افراد قادرند به راحتی با ایده‌های جدید برخورد کنند، اما تغییرات عقیدتی اساسی ممکن است زمان‌بر باشد.\nتمایل به کمال‌گرایی در افکار: این افراد ممکن است نظرات خود را بر اساس داده‌های جدید تصحیح کنند، اما احتمالاً به دنبال پاسخ‌های قطعی و کامل می‌گردند.\nبررسی عقاید جدید: ممکن است به مرور زمان به پذیرش عقاید جدید تمایل پیدا کنند، اما این فرآیند معمولاً تدریجی و با احتیاط صورت می‌گیرد.","traits":"انعطاف‌پذیری و توانایی سازگاری و رویکرد متعادل و میل به یادگیری","challenges":"عدم موضع‌گیری قاطع و موافقت بی‌مورد و تعارض‌های درونی"},{"name":"عقاید","level":"بالا","desc":"افرادی که در این سطح قرار دارند، از تنوع فکری و پذیرش ایده‌های جدید و متفاوت لذت می‌برند. آن‌ها قادرند به راحتی دیدگاه‌های خود را اصلاح کنند و تمایل به پذیرفتن تغییرات و نوآوری‌های فکری دارند.","traits_short":"پذیرش تغییرات فکری: این افراد از دیدگاه‌های جدید استقبال می‌کنند و قادرند به سرعت باورهای خود را در مواجهه با اطلاعات جدید تغییر دهند.\nگسترش مداوم افکار: این افراد دائماً به دنبال توسعه و گسترش افکار و عقاید خود هستند و به راحتی از ایده‌ها و مفاهیم جدید بهره می‌برند.\nتفکر انتقادی قوی: توانایی تفکر انتقادی و تحلیل دقیق‌تر عقاید و ایده‌های مختلف را دارند و ممکن است نظرات پیچیده‌ای داشته باشند.\nپذیرش تنوع فکری: از تنوع فکری به عنوان یک منبع غنی از یادگیری و رشد شخصی استقبال می‌کنند و عقاید متنوع و مخالف را بررسی می‌کنند.","traits":"باور های اصولی و تمرکز بر ارزش ها ایستادگی در برابر تغییرات","challenges":"تعامل دشوار با نظرات مخالف و تعارض میان‌فردی و محدودیت در گوش سپردن"},{"name":"ارزشها","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً در برابر تغییرات در ارزش‌ها و اصول اخلاقی خود مقاوم هستند. این افراد ممکن است به شدت به اصول ثابت و سنتی پایبند باشند و از پذیرش تغییرات در ارزش‌ها اجتناب کنند.","traits_short":"پایبندی به اصول سنتی: این افراد تمایل دارند که به ارزش‌ها و اصول اخلاقی آشنا و سنتی خود پایبند باشند و از پذیرش تغییرات در این زمینه خودداری کنند.\nمقاومت در برابر تغییرات ارزشی: در برابر تغییرات اجتماعی یا اخلاقی مقاوم بوده و تمایل دارند تا به ارزش‌های گذشته وفادار بمانند.\nعدم انعطاف‌پذیری در اصول اخلاقی: این افراد ممکن است در برخورد با ایده‌ها یا نظرات جدید، انعطاف‌پذیری کمتری نشان دهند.\nتمرکز بر اصول ثابت: زندگی این افراد معمولاً بر اساس اصولی ثابت و از پیش تعیین شده است که به نظر می‌رسد کمتر قادر به تغییر یا تطبیق با شرایط جدید باشند.","traits":"تمرکز بر نتایج، انعطاف‌پذیری در اصول اخلاقی","challenges":"بی‌اعتمادی دیگران، تصمیمات مشکوک"},{"name":"ارزشها","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، به طور کلی به ارزش‌ها و اصول اخلاقی خود پایبند هستند، اما در عین حال قادرند با تجربه‌های جدید و تغییرات اجتماعی در ارتباط با اصول خود، تطبیق پیدا کنند.","traits_short":"پذیرش تغییرات ارزش‌ها: این افراد ممکن است قادر به تغییر اصول اخلاقی خود باشند، اما این تغییرات برایشان تدریجی و با ملاحظه است.\nتعادل میان اصول ثابت و پذیرش تغییرات: این افراد به ارزش‌های خود وفادار هستند اما از بررسی و گسترش آن‌ها بر اساس تجربیات جدید نیز استقبال می‌کنند.\nگسترش تدریجی دیدگاه‌ها: در برابر تغییرات اجتماعی و فرهنگی، این افراد ممکن است به طور طبیعی دیدگاه‌های جدیدتری اتخاذ کنند، اما به سرعت و به طور بنیادین این تغییرات را قبول نمی‌کنند.\nتوجه به اصول شخصی و اجتماعی: این افراد ممکن است در ارتباط با مسائل اجتماعی و فرهنگی، اصول خود را بررسی کرده و آن‌ها را به‌روز کنند.","traits":"انعطاف‌پذیری در اصول، احترام به اخلاق با سازش","challenges":"مقاومت در برابر فشارها، عدم انعطاف‌پذیری کامل"},{"name":"ارزشها","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به شدت آماده برای پذیرش و تغییر ارزش‌های خود بر اساس تجربیات جدید و تغییرات اجتماعی هستند. این افراد ممکن است به طور فعال به دنبال به‌روزرسانی ارزش‌ها و اصول اخلاقی خود باشند.","traits_short":"پذیرش مستمر تغییرات ارزش‌ها: این افراد به طور مداوم آماده هستند که ارزش‌ها و اصول اخلاقی خود را بر اساس تغییرات اجتماعی، فرهنگی یا تجربیات جدید تغییر دهند.\nگستردگی و تنوع ارزش‌ها: این افراد تمایل دارند از اصول اخلاقی و اجتماعی متنوع و متعددی استفاده کنند و قادر به تغییر و تطبیق با شرایط جدید هستند.\nتفکر انعطاف‌پذیر: این افراد قادرند به سرعت باورهای خود را تطبیق دهند و در برابر تغییرات و تجربیات جدید، انعطاف‌پذیر باشند.\nپذیرش تغییرات اخلاقی و اجتماعی: به راحتی با تغییرات در ارزش‌ها و اصول اخلاقی جامعه یا فردی تطبیق پیدا می‌کنند.","traits":"عهد به اصول اخلاقی، صداقت، مسئولیت‌پذیری","challenges":"تضاد با افراد سودگرایانه، نارضایتی از بی‌عدالتی"},{"name":"صمیمیت","level":"پایین","desc":"افرادی که در این سطح از صمیمیت قرار دارند، معمولاً در روابط عاطفی و اجتماعی خود محافظه‌کار هستند. این افراد تمایل دارند فاصله عاطفی و اجتماعی خود را با دیگران حفظ کنند و از برقراری روابط عمیق یا به اشتراک‌گذاری احساسات و افکار شخصی خود اجتناب کنند.","traits_short":"مقاومت در برابر نزدیکی عاطفی: این افراد به طور کلی تمایل دارند از برقراری روابط صمیمی و عاطفی با دیگران اجتناب کنند یا آن‌ها را سطحی نگه دارند.\nنگرانی از آسیب‌پذیری: ممکن است از ترس آسیب‌پذیری یا قضاوت دیگران، خود را در روابط نشان ندهند و از ایجاد ارتباط عمیق با دیگران پرهیز کنند.\nخودکفایی و انزوا: این افراد ممکن است خود را به شدت مستقل و خودکفا ببینند و از وابستگی به دیگران یا نیاز به کمک‌های عاطفی جلوگیری کنند.\nمحدودیت در ابراز احساسات: تمایل به حفظ فاصله عاطفی در روابط با دیگران و اجتناب از بیان احساسات درونی خود دارند.","traits":"تمرکز بر اهداف شغلی، بی‌نیازی از روابط اجتماعی","challenges":"دوری از همکاران، احساس بی‌توجهی یا انزوا در تیم‌ها"},{"name":"صمیمیت","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، قادرند ارتباطات صمیمی‌تری را برقرار کنند، اما این روابط معمولاً محدود به یک یا دو نفر یا دایره‌ای کوچک از افراد نزدیک است. این افراد ممکن است در ایجاد روابط عمیق‌تر با دیگران، مشکلاتی داشته باشند، اما در نهایت می‌توانند به برقراری ارتباطات عاطفی باز و قابل اعتماد بپردازند.","traits_short":"آمادگی برای برقراری روابط عاطفی: این افراد به طور نسبی آماده هستند تا روابط عاطفی و صمیمی را ایجاد کنند، اما این روابط ممکن است نیاز به زمان و تلاش داشته باشد.\nتقویت روابط نزدیک: در این سطح، افراد معمولاً با گروه کوچکی از افراد روابط نزدیک و صمیمی دارند، اما برای گسترش این روابط با سایر افراد کمی مقاومت دارند.\nتوانایی در ابراز احساسات محدود: این افراد ممکن است قادر به ابراز احساسات و افکار خود باشند، اما این کار را محدود به افرادی خاص و در شرایط خاص می‌کنند.\nحساسیت به قضاوت اجتماعی: ممکن است این افراد در مواجهه با نظرات و قضاوت‌های دیگران در مورد خود، حساسیت بیشتری نشان دهند و به همین دلیل روابط صمیمی‌شان ممکن است تحت تأثیر قرار گیرد.","traits":"انعطاف‌پذیری در ارتباطات، توانایی برقراری تعادل","challenges":"افزایش احساس رقابت، محدودیت در برقراری ارتباطات عمیق"},{"name":"صمیمیت","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به شدت قادر به برقراری روابط عمیق و صمیمی با دیگران هستند. این افراد به راحتی احساسات خود را به اشتراک می‌گذارند و از آسیب‌پذیری در روابط اجتماعی و عاطفی خود نمی‌ترسند. آن‌ها می‌توانند در تعاملات اجتماعی خود نزدیک‌ترین و واقعی‌ترین روابط را ایجاد کنند.","traits_short":"آمادگی برای آسیب‌پذیری عاطفی: این افراد به راحتی قادرند احساسات، ترس‌ها و افکار خود را با دیگران به اشتراک بگذارند و هیچ ترسی از آسیب‌پذیری ندارند.\nارتباط عمیق با دیگران: روابط این افراد عمیق و صمیمی است و قادرند به راحتی اعتماد و محبت خود را با دیگران به اشتراک بگذارند.\nپذیرش تفاوت‌ها: این افراد نه‌تنها توانایی ایجاد روابط صمیمی دارند، بلکه قادرند به راحتی با افراد با باورها، فرهنگ‌ها و دیدگاه‌های مختلف ارتباط برقرار کنند.\nگشودگی کامل در روابط: این افراد توانایی دارند تا به طور کامل خود را در روابط نشان دهند و هیچ دغدغه‌ای از قضاوت یا انتقاد ندارند.","traits":"تمایل به ایجاد روابط نزدیک، همدلی، ارتباطات مؤثر","challenges":"احساس بی‌اعتمادی از سوی دیگران، سوءتفاهم در روابط حرفه‌ای"},{"name":"جمع گرایی","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً از فعالیت‌های اجتماعی و حضور در جمع‌های بزرگ پرهیز می‌کنند و به تنهایی یا جمع‌های کوچک و خودمانی‌تر علاقه‌مند هستند.","traits_short":"پرهیز از جمع‌های شلوغ: این افراد معمولاً احساس راحتی در جمع‌های بزرگ ندارند و ممکن است حضور در چنین محیط‌هایی برایشان خسته‌کننده باشد.\nتمرکز بر فعالیت‌های انفرادی: ترجیح می‌دهند به جای حضور در جمع‌ها، به فعالیت‌های انفرادی مانند مطالعه یا کارهای هنری بپردازند.\nمقاومت در برابر ایجاد روابط جدید: تمایل دارند که دایره روابط اجتماعی خود را محدود نگه دارند و در برقرار کردن روابط جدید محتاط‌اند.\nنیاز به زمان تنهایی برای بازیابی انرژی: اغلب این افراد برای شارژ دوباره انرژی خود به تنهایی نیاز دارند.","traits":"متمرکز بر کار فردی، توجه به جزئیات، ثبات رفتاری","challenges":"عدم تمایل به برقراری ارتباط، فقدان همدلی"},{"name":"جمع گرایی","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، گرایش‌هایی بینابین به معاشرت و تنهایی دارند و می‌توانند از هر دو لذت ببرند. آن‌ها در برخی موقعیت‌ها به راحتی معاشرت می‌کنند و در مواقع دیگر ممکن است به تنهایی نیاز داشته باشند.","traits_short":"تعادل بین تعاملات اجتماعی و تنهایی: این افراد به طور متوازن قادرند از هر دو جنبه زندگی اجتماعی و تنهایی لذت ببرند.\nانعطاف‌پذیری در روابط اجتماعی: در یک محیط اجتماعی به راحتی خو می‌گیرند اما به همان اندازه نیز می‌توانند به راحتی از آن کناره‌گیری کنند.\nپذیرش موقعیت‌های اجتماعی محدود: این افراد تمایل دارند که در موقعیت‌های اجتماعی که برایشان جذاب و جالب است شرکت کنند.\nنیاز به بازه‌های زمانی برای تنهایی و تفکر: معمولاً بعد از تعاملات اجتماعی نیاز به زمانی برای آرامش و تفکر دارند.","traits":"تعادل در تعاملات اجتماعی و کار، روحیه تیمی","challenges":"رفتار متناقض، مشکلات در موقعیت‌های اجتماعی"},{"name":"جمع گرایی","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به شدت اجتماعی هستند و به راحتی و با لذت فراوان با دیگران ارتباط برقرار می‌کنند. این افراد اغلب نقش فعال و پرانرژی در موقعیت‌های اجتماعی ایفا می‌کنند.","traits_short":"لذت از جمع‌های بزرگ و اجتماعی: این افراد معمولاً از حضور در جمع‌های پر جمعیت لذت می‌برند و از این تعاملات انرژی می‌گیرند.\nتمایل به ایجاد روابط جدید: به راحتی و با انرژی فعال روابط جدید برقرار می‌کنند و در تعاملات اجتماعی به خوبی عمل می‌کنند.\nآمادگی برای برقراری ارتباط با افراد جدید: معمولاً در هر محیط اجتماعی به راحتی با دیگران تعامل می‌کنند و به سرعت دوستان جدید پیدا می‌کنند.\nنیاز به حضور دائم در جمع‌ها برای بازیابی انرژی: برخلاف افراد انزواطلب، آن‌ها انرژی خود را از تعاملات اجتماعی به دست می‌آورند.","traits":"انرژی بالا، رهبری طبیعی، تماس اجتماعی گسترده","challenges":"تسلط بر گفتگو، نیاز به تأیید دیگران"},{"name":"قاطعیت","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً در بیان نظرات و احساسات خود دچار مشکل هستند و ممکن است از برخوردهای مستقیم اجتناب کنند.","traits_short":"تمایل به تسلیم شدن: در مواجهه با درخواست‌ها یا نظرات دیگران، تمایل دارند که خود را با آنها سازگار کنند و کمتر به بیان نظرات شخصی خود می‌پردازند.\nاجتناب از تعارض: از ترس ایجاد تنش یا ناراحتی، اغلب تمایل دارند که از گفت‌وگوهای قاطعانه یا مقابله‌جویانه پرهیز کنند.\nکاهش اعتماد به نفس در بیان نیازها: اغلب احساس می‌کنند که نیازها و خواسته‌هایشان کمتر از دیگران اهمیت دارد.\nمقاومت در برخورد مستقیم با مسائل: ممکن است در مواقع نیاز به برخورد مستقیم با مسائل، دچار تردید یا ناتوانی شوند.","traits":"","challenges":""},{"name":"قاطعیت","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، قادرند نیازها و نظرات خود را درحد متعادل بیان کنند اما ممکن است در برخی موقعیت‌ها دچار چالش شوند.","traits_short":"توانایی در بیان نظرات با کمی تردید: در اغلب موارد قادر به بیان نظرات خود هستند، اما ممکن است در مواجهه با افراد سلطه‌گر دچار مشکل شوند.\nرویکرد متعادل به تعارضات: معمولاً قادرند در تعارضات به طور سازنده شرکت کنند و اهداف هر دو طرف را در نظر بگیرند.\nنیاز به آمادگی بیشتر در موقعیت‌های استرس‌زا: ممکن است در شرایطی که نیاز به تصمیم‌گیری سریع دارند، دچار کمی دلهره شوند.\nتمایل به سازگاری در مواقع خاص: در شرایطی ممکن است به جای بیان مستقیم خواسته‌ها، بیشتر گرایش به سازگاری و مصالحه داشته باشند.","traits":"","challenges":""},{"name":"قاطعیت","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به خوبی قادرند نظرات و احساسات خود را بیان کنند و به شیوه‌ای محترمانه و موثر به دیگران نزدیک شوند.","traits_short":"قوت در بیان نظرات و نیازها: این افراد به راحتی قادرند نظرات، نیازها و احساسات خود را به طور واضح و با اعتماد به نفس بیان کنند.\nمهارت بالا در مدیریت تعارضات: توانایی برخورد قاطعانه و مثبت با مسائل و تعارضات را دارند بدون آن‌که به روابط آسیبی وارد کنند.\nپذیرش نظرات مخالف: با وجود ابراز وجود بالا، این افراد به نظرات و بازخوردهای دیگران نیز گوش می‌دهند و آماده پذیرش اختلاف نظر هستند.\nتوانایی ایجاد انگیزه در دیگران: قادرند با رویکرد قاطعانه و مثبت، در انگیزه‌بخشی و هدایت دیگران موفق عمل کنند.","traits":"","challenges":""},{"name":"فعالیت","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً علاقه زیادی به فعالیت‌های فیزیکی و تحرک ندارند و بیشتر وقت خود را به فعالیت‌های آرام یا استراحت اختصاص می‌دهند.","traits_short":"ترجیح به استراحت و آرامش: این افراد ممکن است بیشتر وقت خود را در خانه یا در محیط‌های آرام و راحت سپری کنند و تمایلی به مشارکت در فعالیت‌های جسمانی ندارند.\nکمتر درگیر شدن در فعالیت‌های گروهی: در موقعیت‌های اجتماعی یا گروهی، ممکن است به راحتی به مشارکت نپردازند و ترجیح دهند که از دور نظاره‌گر باشند.\nاحساس خستگی سریع‌تر: افراد با سطح فعالیت پایین ممکن است پس از مدت کوتاهی از انجام فعالیت‌های فیزیکی احساس خستگی کنند و ترجیح دهند که از آنها دوری کنند.\nترجیح به کارهای انفرادی یا ساکن: این افراد به فعالیت‌هایی مانند خواندن، تماشای تلویزیون یا کارهای هنری تمایل دارند و بیشتر از کارهای اجتماعی یا ورزشی لذت نمی‌برند.","traits":"تمرکز بالا، کاهش استرس, آرامش در فشار","challenges":"عدم مشارکت در فعالیت‌ها، احساس انزوا"},{"name":"فعالیت","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، توانایی دارند که بین فعالیت‌های فیزیکی و استراحت تعادل برقرار کنند. آنها ممکن است گاهی به فعالیت‌های فیزیکی علاقه‌مند شوند، اما به همان اندازه ممکن است نیاز به استراحت و آرامش نیز داشته باشند.","traits_short":"تعادل بین فعالیت و استراحت: این افراد معمولاً زمانی که نیاز به استراحت دارند، به خودشان زمان می‌دهند و در مواقع دیگر از تحرک فیزیکی لذت می‌برند.\nتمایل به مشارکت در فعالیت‌های اجتماعی متوسط: ممکن است در برخی فعالیت‌های اجتماعی و گروهی شرکت کنند، اما در برخی دیگر به دلیل نیاز به استراحت، از آنها دوری کنند.\nانجام فعالیت‌های متوسط در زندگی روزمره: افراد در این گروه ممکن است فعالیت‌هایی مانند پیاده‌روی روزانه، دوچرخه‌سواری یا تمرینات ورزشی سبک را در برنامه روزانه خود داشته باشند.\nاحساس راحتی در زمانی که فعالیت بیش از حد نداشته باشند: اگر فعالیت‌های فیزیکی بیش از حد برایشان پیش آید، ممکن است احساس خستگی کنند و نیاز به استراحت داشته باشند.","traits":"تعادل در انرژی، انعطاف‌پذیری، کنترل استرس","challenges":"عدم تحریک کافی، تفاوت در سرعت کار"},{"name":"فعالیت","level":"بالا","desc":"افرادی که در این سطح قرار دارند، بسیار پرانرژی هستند و همواره در حال حرکت و انجام فعالیت‌های فیزیکی هستند. این افراد تمایل دارند که به صورت مستمر درگیر فعالیت‌های مختلف فیزیکی و اجتماعی شوند.","traits_short":"انرژی بالا و تمایل به حرکت دائم: این افراد اغلب دارای سطح انرژی بسیار بالایی هستند و در تمام مدت روز در حال انجام فعالیت‌های مختلف هستند.\nمشارکت فعال در فعالیت‌های گروهی: این افراد تمایل دارند که در جمع‌ها، رویدادها و فعالیت‌های گروهی شرکت کنند و از این تعاملات انرژی بگیرند.\nانجام فعالیت‌های فیزیکی بیشتر از حد معمول: آنها ممکن است به طور روزانه ورزش‌های سنگین یا فعالیت‌های فیزیکی مانند دویدن، ورزش‌های تیمی، کوهنوردی و … انجام دهند.\nکمبود تمایل به استراحت: این افراد معمولاً از استراحت زیاد دوری می‌کنند و بیشتر به دنبال فعالیت و حرکت هستند.","traits":"انرژی بالا، پویایی، تلاش مداوم","challenges":"عدم توجه به نیازهای دیگران، فرصت‌طلبی"},{"name":"هیجان خواهی","level":"پایین","desc":"افرادی که در این سطح قرار دارند، تمایلی به جستجوی هیجان‌های جدید یا تجربیات پرخطر ندارند و به آرامش و ثبات بیشتر در زندگی خود اهمیت می‌دهند. این افراد به فعالیت‌های امن و قابل پیش‌بینی ترجیح می‌دهند و ممکن است از تغییرات و موقعیت‌های غیرمنتظره پرهیز کنند.","traits_short":"ترجیح به روتین و ثبات: این افراد از انجام کارهای روزمره و حفظ یک زندگی آرام و بی‌دغدغه لذت می‌برند.\nتمایل به اجتناب از خطرات: به طور کلی از فعالیت‌های پرخطر، هیجان‌انگیز یا ناشناخته خودداری می‌کنند و ترجیح می‌دهند در محیط‌های امن و قابل کنترل باقی بمانند.\nکمتر به دنبال تنوع: افراد با سطح کم هیجان‌خواهی معمولاً از تغییرات شدید یا تجربیات جدید اجتناب می‌کنند و بیشتر در محیط‌های ثابت و آرام احساس راحتی می‌کنند.\nتمرکز بر کارهای قابل پیش‌بینی: تمایل دارند که فعالیت‌ها و تصمیماتشان قابل پیش‌بینی و امن باشند.","traits":"پایداری بالا، اجتناب از ریسک","challenges":"مقاومت در برابر تغییرات، نبود انگیزه برای نوآوری"},{"name":"هیجان خواهی","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، تمایل به جستجوی هیجان‌ها و تجربیات جدید دارند، اما در عین حال از حد معقول و کنترل‌شده فراتر نمی‌روند. این افراد معمولاً به دنبال تنوع و چالش هستند، اما به شیوه‌ای محتاطانه و متعادل.","traits_short":"تعادل بین هیجان و آرامش: این افراد تمایل دارند که از تجربیات هیجان‌انگیز لذت ببرند، اما در عین حال می‌خواهند احساس امنیت و ثبات را نیز در زندگی خود حفظ کنند.\nگوشه‌ای از جستجوی تنوع: ممکن است در برخی شرایط و موقعیت‌ها به دنبال تغییرات و فعالیت‌های هیجان‌انگیز باشند، اما به طور معمول از فعالیت‌های پرخطر یا شدید دوری می‌کنند.\nتمایل به چالش‌های کنترل‌شده: افرادی که در این سطح قرار دارند، به چالش‌های فکری و جسمی علاقه دارند، اما به شیوه‌ای متعادل که ریسک زیادی به همراه نداشته باشد.\nآماده برای تجربه‌های جدید: این افراد در موقعیت‌های خاص ممکن است حاضر باشند که تجربیات جدیدی را امتحان کنند، اما همچنان به امنیت و راحتی خود اهمیت می‌دهند.","traits":"تعادل در پذیرش تغییرات، مدیریت ریسک","challenges":"نیاز به تشویق برای ریسک‌پذیری بیشتر، محدودیت در تغییرات شدید"},{"name":"هیجان خواهی","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به طور مداوم به دنبال هیجان، تنش و تجربیات پرخطر هستند. این افراد تمایل دارند که مرزهای معمول را شکسته و در فعالیت‌هایی شرکت کنند که تحریک‌کننده و هیجان‌انگیز باشند.","traits_short":"میل به خطر و چالش: این افراد عاشق تجربیات پرهیجان و پرخطر هستند و ممکن است در فعالیت‌هایی مانند ورزش‌های extreme (ورزش‌های افراطی)، سفرهای پرخطر یا دیگر چالش‌های فیزیکی و روانی شرکت کنند.\nجستجو برای تنوع شدید: این افراد به طور مداوم به دنبال تغییرات شدید و جدید در زندگی خود هستند و معمولاً از روتین و یکنواختی فرار می‌کنند.\nانجام فعالیت‌های پرخطر: تمایل دارند که در موقعیت‌هایی قرار گیرند که سطح بالایی از هیجان و خطر را شامل شود، مانند رانندگی با سرعت بالا، کوهنوردی در مناطق خطرناک یا انجام فعالیت‌های ورزشی شدید.\nتمایل به هیجان‌های فوری و بدون تأخیر: آنها معمولاً به دنبال هیجان فوری هستند و از انتظار برای دریافت این هیجان‌ها خوششان نمی‌آید.","traits":"پیشگام، تحمل ریسک بالا، انعطاف‌پذیری","challenges":"عدم تمایل به همکاری با دیگران، تعارض با روش‌های مرسوم"},{"name":"هیجان مثبت","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً کمتر به احساسات مثبت دست می‌یابند و بیشتر در شرایطی قرار دارند که احساسات منفی یا بی‌تفاوتی غالب هستند. این افراد ممکن است در مواجهه با مشکلات یا چالش‌ها به راحتی احساس یأس کنند و در نتیجه از هیجانات مثبت مانند شادی و رضایت دوری کنند.","traits_short":"عدم تجربه شادی‌های مکرر: این افراد معمولاً در مواجهه با اتفاقات روزمره یا شرایط زندگی، به سختی احساس شادی یا رضایت دارند.\nاحساس بی‌انگیزگی یا سردی: آنها ممکن است به طور کلی از تجربیات مثبت دوری کرده یا از رویدادهای زندگی کمتر لذت ببرند.\nکمتر مشارکت در فعالیت‌های اجتماعی یا لذت‌بخش: معمولاً تمایلی به شرکت در فعالیت‌های اجتماعی یا تفریحی ندارند و بیشتر به امور روزمره و وظایف پرداخته و ممکن است از موقعیت‌های لذت‌بخش فرار کنند.\nنگاه منفی به زندگی: این افراد ممکن است به صورت عمومی دیدگاه منفی‌تری نسبت به زندگی داشته باشند و بیشتر تمرکزشان روی مشکلات و چالش‌ها باشد.","traits":"واقع‌گرایی یا بدبینی، ثبات احساسی","challenges":"فضای غیرالهام‌بخش، کاهش تعامل اجتماعی"},{"name":"هیجان مثبت","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، به طور متوسط به هیجانات مثبت دست می‌یابند. این افراد می‌توانند در برخی شرایط احساس شادی، رضایت یا قدردانی داشته باشند، اما این هیجانات همیشه ثابت نیستند و ممکن است تحت تأثیر چالش‌ها و شرایط دشوار به سرعت کاهش یابند.","traits_short":"تجربه هیجانات مثبت در موقعیت‌های خاص: این افراد ممکن است در مواجهه با موفقیت‌ها، جشن‌ها یا موقعیت‌های خاص، احساس شادی و رضایت کنند، اما این احساسات ممکن است موقتی و وابسته به شرایط خاص باشند.\nنگاه متعادل به زندگی: این افراد معمولاً دیدگاه نسبتاً متعادل و میانه‌ای نسبت به زندگی دارند، به طوری که در شرایط مثبت احساس خوشبختی می‌کنند اما در شرایط منفی از افت انرژی و انگیزه رنج می‌برند.\nمشارکت در فعالیت‌های اجتماعی و تفریحی: به طور کلی تمایل به شرکت در فعالیت‌های اجتماعی و لذت‌بخش دارند، اما در مواقعی که شرایط دشوار می‌شود، ممکن است تمایل به گوشه‌گیری یا کاهش فعالیت‌ها پیدا کنند.\nقدردانی از زندگی: این افراد قادرند به چیزهای خوب و مثبت زندگی خود توجه کنند و از کوچک‌ترین شادی‌ها نیز لذت ببرند.","traits":"رفتار متعادل، تعامل مؤثر، تفکر استراتژیک","challenges":"تفاوت در سطح انرژی، کمبود اثرگذاری الهام‌بخش"},{"name":"هیجان مثبت","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به طور مداوم در حال تجربه هیجانات مثبت هستند. این افراد معمولاً از زندگی خود راضی و شاد هستند و احساسات مثبتی مانند خوشحالی، قدردانی، شجاعت، امید و عشق را در اکثر مواقع تجربه می‌کنند.","traits_short":"تجربه مداوم شادی و رضایت: این افراد معمولاً در بیشتر شرایط زندگی خود احساس خوشبختی، امید و شادابی دارند و قادرند به راحتی در مواجهه با چالش‌ها یا موفقیت‌ها احساس رضایت کنند.\nنگاه مثبت و خوش‌بینانه به زندگی: این افراد دیدگاه مثبت و خوش‌بینانه‌ای نسبت به زندگی دارند و به راحتی می‌توانند از مشکلات یا سختی‌ها عبور کرده و به جنبه‌های خوب زندگی توجه کنند.\nمشارکت فعال در فعالیت‌های اجتماعی: آنها به طور فعال در رویدادهای اجتماعی، تفریحی و فرهنگی شرکت می‌کنند و از این تعاملات لذت می‌برند.\nقدرت مقابله بالا: این افراد قادرند با مشکلات و چالش‌ها به شیوه‌ای سازنده و مثبت مواجه شوند و در مواقع دشوار نیز احساس امید و انرژی داشته باشند.","traits":"نگرش خوش‌بینانه، انرژی بالا، انعطاف‌پذیری","challenges":"عدم توجه کافی به مشکلات دیگران، فشار ناخواسته به تیم"},{"name":"اضطراب","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً در برابر موقعیت‌های استرس‌زا یا چالش‌ها، احساس نگرانی یا اضطراب کمی دارند. این افراد می‌توانند به راحتی با شرایط سخت یا غیرمنتظره روبه‌رو شوند و معمولاً نگرانی‌هایشان در زندگی روزمره به حداقل می‌رسد.","traits_short":"آرامش در شرایط بحرانی: این افراد به راحتی می‌توانند در موقعیت‌های استرس‌زا یا فشارهای روزمره احساس آرامش کنند و به راحتی با چالش‌ها مقابله کنند.\nکنترل احساسات: آنها معمولاً قادرند بر احساسات خود تسلط داشته باشند و از ایجاد اضطراب در خود جلوگیری کنند.\nاعتماد به نفس بالا: این افراد در بیشتر شرایط زندگی اعتماد به نفس بالایی دارند و کمتر دچار نگرانی در مورد آینده می‌شوند.\nانطباق سریع با تغییرات: توانایی بالا در تطبیق و سازگاری با شرایط جدید یا تغییرات محیطی.","traits":"اعتماد به نفس بالا، پایداری عاطفی، تمرکز بالا","challenges":"کم‌توجهی به حساسیت‌های دیگران، برداشت اشتباه از آرامش"},{"name":"اضطراب","level":"متوسط","desc":"فرادی که در این سطح قرار دارند، ممکن است گاهی اوقات اضطراب را تجربه کنند، اما معمولاً قادر به کنترل آن هستند و نمی‌گذارند که اضطراب به طور مداوم بر زندگی روزمره‌شان تأثیر بگذارد. این افراد ممکن است در موقعیت‌های خاص و چالش‌برانگیز مانند مصاحبه شغلی، امتحانات یا بحران‌های شخصی اضطراب را تجربه کنند، اما معمولاً این اضطراب موقت و قابل کنترل است.","traits_short":"نگرانی در موقعیت‌های خاص: این افراد ممکن است در برابر موقعیت‌های خاص مانند شروع یک پروژه مهم، امتحانات یا تغییرات در زندگی شخصی احساس اضطراب کنند.\nتوانایی مدیریت اضطراب: اگرچه اضطراب را تجربه می‌کنند، اما قادرند با روش‌های مختلفی مانند تنفس عمیق، ورزش یا گفتگو با دوستان اضطراب خود را کنترل کنند.\nتمرکز بر نگرانی‌های معقول: بیشتر نگرانی‌های این افراد معقول و مرتبط با واقعیت‌ها هستند، ولی ممکن است گاهی تحت تأثیر افکار منفی یا فرضیات غیرواقعی قرار گیرند.\nاحساس اضطراب در موقعیت‌های جدید: ممکن است در مواجهه با موقعیت‌های جدید یا ناشناخته دچار نگرانی شوند، اما این نگرانی‌ها معمولاً زودگذر هستند.","traits":"توانایی مدیریت استرس، پاسخ به انتقاد","challenges":"دریافت فشار از دیگران، تقویت استرس در تیم"},{"name":"اضطراب","level":"بالا","desc":"افرادی که در این سطح قرار دارند، به طور مداوم اضطراب را تجربه می‌کنند و این اضطراب می‌تواند بر کیفیت زندگی آن‌ها تأثیر منفی بگذارد. این افراد در اکثر موقعیت‌های زندگی، حتی در مواقعی که شرایط تهدیدآمیز نیست، احساس نگرانی، ترس یا استرس می‌کنند و ممکن است با مشکلات جسمی و روانی همراه باشد.","traits_short":"اضطراب مزمن: این افراد به طور مداوم احساس اضطراب دارند و ممکن است حتی در شرایطی که هیچ تهدید یا خطری وجود ندارد، احساس نگرانی کنند.\nعلائم فیزیکی اضطراب: اضطراب در این افراد می‌تواند با علائم فیزیکی شدید مانند تپش قلب، عرق سرد، لرزش، تهوع یا سردرد همراه باشد.\nاجتناب از موقعیت‌ها: این افراد ممکن است تمایل به اجتناب از موقعیت‌ها و شرایطی که باعث ایجاد اضطراب می‌شود داشته باشند، به ویژه زمانی که احساس می‌کنند قادر به کنترل اضطراب خود نیستند.\nتأثیر منفی بر زندگی روزمره: اضطراب بالا می‌تواند تأثیرات منفی بر عملکرد شغلی، روابط اجتماعی و حتی سلامتی جسمانی این افراد بگذارد.","traits":"افکار منفی مداوم، کاهش تمرکز، نیاز به تایید","challenges":"تعاملات پرتنش، انتقال احساسات منفی به دیگران"},{"name":"پرخاشگری","level":"پایین","desc":"افرادی که در این سطح از پرخاشگری قرار دارند، معمولاً رفتارهای آرام و کنترل‌شده‌ای دارند و کمتر از دیگران دچار واکنش‌های خشمگین یا پرخاشگرانه می‌شوند. این افراد در شرایط مختلف زندگی، از جمله موقعیت‌های استرس‌زا یا پر تنش، قادر به حفظ آرامش خود هستند و به ندرت به رفتارهای پرخاشگرانه روی می‌آورند.","traits_short":"کنترل بالا بر احساسات: این افراد معمولاً قادرند خشم و ناراحتی خود را کنترل کنند و از بروز رفتارهای پرخاشگرانه جلوگیری کنند.\nواکنش‌های ملایم به استرس: در مواجهه با موقعیت‌های استرس‌زا یا ناامیدکننده، این افراد معمولاً واکنش‌های ملایم‌تر و منطقی‌تر نشان می‌دهند.\nگفت‌وگو و حل مسئله: افرادی که پرخاشگری کمی دارند، معمولاً تمایل دارند مشکلات و اختلافات خود را از طریق گفت‌وگو و حل مسئله در پیش گیرند.\nخودآگاهی بالا: این افراد معمولاً خودآگاهی بالایی دارند و از نحوه رفتار خود و تأثیر آن بر دیگران آگاهند.","traits":"خونسردی و آرامش در شرایط بحرانی، تمایل به همکاری و حل مسئله به شیوه منطقی","challenges":"درک نادرست از نیازهای عاطفی دیگران، عدم واکنش به مسائل هیجانی"},{"name":"پرخاشگری","level":"متوسط","desc":"افرادی که در این سطح قرار دارند، گاهی اوقات تحت فشار یا در موقعیت‌های استرس‌زا ممکن است واکنش‌های پرخاشگرانه نشان دهند. این افراد ممکن است در مواجهه با مشکلات یا احساسات منفی مانند خشم و ناامیدی، به طور موقت دچار رفتارهای پرخاشگرانه شوند، اما معمولاً قادر به بازگشت به رفتارهای اجتماعی سالم هستند.","traits_short":"پرخاشگری گاه‌به‌گاه: این افراد ممکن است در برخی موقعیت‌ها، مانند بحث‌های شدید یا در برابر بی‌عدالتی، دچار پرخاشگری شوند.\nبی‌صبری در مواقع استرس: زمانی که این افراد تحت فشار یا استرس قرار می‌گیرند، ممکن است قدرت تحمل خود را از دست بدهند و به پرخاشگری روی آورند.\nاحساس ناتوانی: گاهی ممکن است این افراد احساس کنند که تنها راه حل مشکلات خود، بروز خشم یا پرخاشگری است.\nگفت‌وگو با دشواری: این افراد ممکن است در برخی موارد در مدیریت احساسات خود با دیگران به مشکل برخورد کنند و به جای گفت‌وگو، از راه‌های پرخاشگرانه استفاده کنند.","traits":"واکنش‌های معقول به استرس، نیاز به بازخورد و اصلاح، تمایل به انتقاد سازنده","challenges":"برخوردهای موقتی با دیگران، ایجاد سوءتفاهم‌ها در موقعیت‌های پرتنش"},{"name":"پرخاشگری","level":"بالا","desc":"افرادی که در این سطح از پرخاشگری قرار دارند، به طور مداوم و در موقعیت‌های مختلف زندگی، رفتارهای پرخاشگرانه و خشونت‌آمیز از خود نشان می‌دهند. این افراد ممکن است در برابر کوچک‌ترین تحریکات، احساس خشم و پرخاشگری شدید داشته باشند و قادر به کنترل این احساسات نباشند. رفتارهای آنها می‌تواند به دیگران آسیب بزند و تأثیرات منفی زیادی بر روابط شخصی و حرفه‌ای آنها بگذارد.","traits_short":"پرخاشگری مزمن: این افراد در بسیاری از موقعیت‌ها، از کوچک‌ترین تحریکات تا مسائل جدی، به شدت واکنش‌های خشمگین و پرخاشگرانه نشان می‌دهند.\nآسیب به دیگران: پرخاشگری این افراد ممکن است به دیگران آسیب جسمی یا روانی بزند، حتی اگر خودشان قصد آسیب رساندن نداشته باشند.\nعدم کنترل بر احساسات: افراد با پرخاشگری بالا معمولاً نمی‌توانند احساسات خود را کنترل کنند و در شرایط استرس‌زا، به شدت واکنش نشان می‌دهند.\nتأثیر منفی بر روابط: رفتارهای پرخاشگرانه به طور قابل توجهی بر روابط شخصی، شغلی و اجتماعی این افراد تأثیر منفی می‌گذارد و ممکن است به انزوای اجتماعی منجر شود.","traits":"واکنش‌های سریع و شدید، تمایل به پرخاشگری در برابر تهدیدات، خشم قابل مشاهده","challenges":"تعاملات پرتنش، تعارضات مکرر با همکاران، مشکل در ارتباط موثر"},{"name":"افسردگی","level":"پایین","desc":"افرادی که افسردگی در سطح کم دارند، ممکن است به طور موقت یا در اثر شرایط خاص زندگی مانند فشارهای کاری یا مشکلات شخصی، احساس غمگینی یا خستگی کنند. این احساسات اغلب گذرا هستند و به راحتی با تغییر شرایط زندگی یا با کمک‌های کوچک مانند حمایت اجتماعی یا استراحت، کاهش می‌یابند.","traits_short":"افسردگی موقت: این افراد معمولاً افسردگی را به عنوان یک دوره کوتاه‌مدت و موقتی تجربه می‌کنند که به دلیل مشکلات یا تغییرات محیطی به وجود آمده است.\nکاهش انرژی یا اشتیاق: ممکن است انرژی کمتری داشته باشند یا از برخی فعالیت‌ها لذت کمتری ببرند، اما قادر به انجام کارهای روزمره خود هستند.\nاحساس بی‌انگیزگی: احساس می‌کنند که برخی از کارها یا فعالیت‌ها برایشان جذابیت ندارند، ولی این احساس معمولاً به مدت طولانی ادامه نمی‌یابد.\nخواب و اشتهای نرمال: این افراد معمولاً از اختلالات جدی در خواب یا اشتها رنج نمی‌برند.","traits":"انرژی بالا و نگرش مثبت و تمرکز بالا","challenges":"کمبود حساسیت به به نیاز های دیگران"},{"name":"افسردگی","level":"متوسط","desc":"افرادی که در سطح متوسط افسردگی قرار دارند، ممکن است بیش از یک دوره زمانی کوتاه، احساس غمگینی، بی‌انگیزگی، یا ناتوانی در لذت بردن از فعالیت‌های روزانه خود داشته باشند. در این سطح، افسردگی می‌تواند بر عملکرد روزمره تأثیر بگذارد و مشکلاتی مانند اختلال در خواب یا اشتها، اضطراب و احساس گناه ایجاد شود.","traits_short":"علائم افسردگی مزمن‌تر: این افراد ممکن است بیش از دو هفته احساس افسردگی، بی‌انگیزگی، یا ناامیدی کنند.\nاختلال در خواب و اشتها: خواب آشفته و کاهش یا افزایش شدید اشتها از علائم بارز در این سطح است.\nکاهش علاقه به فعالیت‌های اجتماعی و شغلی: ممکن است افراد از انجام فعالیت‌هایی که قبلاً برایشان لذت‌بخش بودند، اجتناب کنند.\nافکار منفی و احساس بی‌ارزشی: احساسات منفی نسبت به خود و جهان اطرافشان به صورت مداوم همراه این افراد است.\nاختلالات فیزیکی: ممکن است این افراد از مشکلات جسمی مانند دردهای عضلانی، سردرد، و مشکلات گوارشی رنج ببرند.","traits":"انگیزه گاهی کم و نگرانی های دوره ای","challenges":"حساسیت به نقد و تعاملات عاطفی کم"},{"name":"افسردگی","level":"بالا","desc":"افرادی که افسردگی شدید دارند، علائم آن‌ها می‌تواند به طور قابل توجهی بر کیفیت زندگی فرد تأثیر بگذارد. این افراد معمولاً نمی‌توانند به راحتی به فعالیت‌های روزانه خود ادامه دهند و ممکن است از مشکلات جدی مانند تفکرات خودکشی یا ناتوانی در انجام کارهای ساده رنج ببرند.","traits_short":"افکار خودکشی یا آسیب به خود: این
