 <!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>آزمون NEO-PI-R</title>
<style>
:root {
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --text:#162033;
  --muted:#667085;
  --border:#d9e1ec;
  --primary:#2457c5;
  --primary2:#173f9e;
  --success:#19734a;
  --warning:#996515;
  --danger:#b42318;
  --shadow:0 10px 35px rgba(35,55,85,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:0 auto;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brandMark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2457c5,#5e7fe0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.brand h1{font-size:1.15rem;margin:0}
.brand p{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.topActions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 15px;min-height:44px;transition:transform .12s ease,box-shadow .12s ease;background:#eef3fb;color:var(--text)}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(36,87,197,.22)}
.btn-primary:hover{background:var(--primary2)}
.btn-danger{background:#fff0ef;color:var(--danger)}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;font-size:1.1rem}
.sectionTitle small{color:var(--muted);font-weight:400}
.lead{font-size:1.02rem;color:#344054}
.note{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:#475467}
.note.warning{background:#fff8eb;border-color:#f3d39a;color:#6d4c0f}
.note.danger{background:#fff2f0;border-color:#f1b8b2;color:#8e2017}
.note.success{background:#eefbf4;border-color:#b9e3ca;color:#17623f}
.kpiRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}
.kpi strong{display:block;font-size:1.35rem}
.kpi span{color:var(--muted);font-size:.82rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 13px;background:#fff;outline:none;min-height:46px}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(36,87,197,.10)}
.radioGroup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radioCard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;background:#fff}
.radioCard input{accent-color:var(--primary)}
.progressWrap{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.94);backdrop-filter:blur(10px);padding:8px 0 12px}
.progressMeta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);margin-bottom:7px}
.progressTrack{height:9px;background:#e9eef5;border-radius:99px;overflow:hidden}
.progressBar{height:100%;background:linear-gradient(90deg,#2457c5,#6b88df);width:0%}
.qCard{padding:24px}
.qTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.qNumber{font-weight:800}
.statusPill{border-radius:999px;padding:6px 10px;font-size:.78rem;background:#f1f5f9;color:#475467}
.statusPill.answered{background:#ecfdf3;color:#1c6e46}
.questionText{font-size:1.2rem;line-height:2.2;margin:14px 0 24px}
.options{display:grid;gap:10px}
.option{position:relative;border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;background:#fff;transition:border-color .12s ease,background .12s ease,box-shadow .12s ease}
.option:hover{border-color:#b8c6dd;background:#fbfdff}
.option input{position:absolute;opacity:0;pointer-events:none}
.option .dot{width:22px;height:22px;border:2px solid #a8b6ca;border-radius:50%;flex:none;margin-top:2px;position:relative}
.option.selected{border-color:var(--primary);background:#eaf1ff;box-shadow:0 0 0 3px rgba(36,87,197,.12);transform:translateY(-1px)}
.option.selected .dot{border-color:var(--primary)}
.option.selected .dot::after{content:"";position:absolute;inset:4px;background:var(--primary);border-radius:50%}
.option.justSelected{animation:answerPulse .24s ease-out}
.option.answerLocked{pointer-events:none}
@keyframes answerPulse{0%{transform:scale(1)}50%{transform:scale(1.01)}100%{transform:scale(1)}}
.option .labelText{flex:1}
.navRow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.navGroup{display:flex;gap:8px;flex-wrap:wrap}
.tableWrap{overflow:auto;border:1px solid var(--border);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:720px;background:#fff}
th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:right;vertical-align:top}
th{background:#f7f9fc;font-size:.84rem;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.chartGrid{display:grid;grid-template-columns:1fr;gap:16px}
.chartBox{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}
canvas{width:100%;height:auto;display:block}
.modeBar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.segment{display:inline-flex;border:1px solid var(--border);border-radius:12px;padding:4px;background:#fff}
.segment button{border:0;background:transparent;padding:8px 12px;border-radius:9px}
.segment button.active{background:#edf3ff;color:var(--primary);font-weight:700}
.resultTop{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.metaList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metaItem{background:var(--surface2);border-radius:12px;padding:10px 12px}
.metaItem b{display:block;font-size:.78rem;color:var(--muted)}
.metaItem span{display:block;margin-top:3px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3fb;color:#40516a;font-size:.78rem}
.scoreBadge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef3fb;color:#344054;font-size:.78rem;font-weight:700;white-space:nowrap}
.scoreBadge.very-low,.scoreBadge.very-high{font-weight:800}
.interp{border-top:1px solid #edf1f6;padding:14px 0}
.interp:first-child{border-top:0}
.interp h4{margin:0 0 6px}
.interp p{margin:0;color:#475467}
details{background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 14px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:700}
.footerNote{color:var(--muted);font-size:.8rem;margin-top:18px}
.hidden{display:none!important}
.center{text-align:center}
.bigIcon{font-size:2.2rem}
.empty{padding:35px;text-align:center;color:var(--muted)}
.small{font-size:.84rem;color:var(--muted)}
.sourceBox{font-size:.82rem;color:#475467}
.sourceBox code{background:#f1f5f9;border-radius:5px;padding:1px 4px}
@media (max-width:850px){
  .grid-2,.grid-3,.resultTop{grid-template-columns:1fr}
  .kpiRow{grid-template-columns:1fr}
  .metaList{grid-template-columns:1fr}
  .questionText{font-size:1.05rem}
  .app{padding:12px}
  .qCard{padding:18px}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#111}
  .app{max-width:none;padding:0}
  .header,.topActions,.progressWrap,.noPrint,.modeBar .segment,.btn,.qTop .statusPill{display:none!important}
  .card{box-shadow:none;border:1px solid #d0d5dd;break-inside:avoid}
  .chartBox{break-inside:avoid}
  .chartGrid{grid-template-columns:1fr}
  table{min-width:0;font-size:10.5px}
  th,td{padding:6px 8px}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  .resultTop{grid-template-columns:1fr 1fr}
  details{border:0;padding:0;margin:0 0 10px}
  details summary{display:none}
  .chartBox{overflow:visible}
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
"use strict";
const DATA = {"sourceVersion":"منابع بارگذاری‌شده توسط کاربر","questions":[{"id":1,"text":"من آدم نگرانی نیستم.","facet":"N1","scores":[4,3,2,1,0]},{"id":2,"text":"من بیشتر افرادی را که می‌شناسم واقعاً دوست دارم.","facet":"E1","scores":[0,1,2,3,4]},{"id":3,"text":"من قدرت تخیل و تصور خیلی زنده و فعالی دارم.","facet":"O1","scores":[0,1,2,3,4]},{"id":4,"text":"من معمولاً در مورد قصد و نیت دیگران بدبین و بدگمان هستم.","facet":"A1","scores":[4,3,2,1,0]},{"id":5,"text":"من به محتاط بودن و داشتن عقل سلیم مشهورم.","facet":"C1","scores":[0,1,2,3,4]},{"id":6,"text":"من اغلب از نحوه برخورد دیگران با خودم عصبانی می‌شوم.","facet":"N2","scores":[0,1,2,3,4]},{"id":7,"text":"من معمولاً از جمعیّت‌های بزرگ و شلوغ دوری و پرهیز می‌کنم.","facet":"E2","scores":[4,3,2,1,0]},{"id":8,"text":"مسایل و مطالب مربوط به هنر و زیبایی‌شناسی برای من چندان اهمیت ندارد.","facet":"O2","scores":[4,3,2,1,0]},{"id":9,"text":"من آدم حیله‌گر و مکاری نیستم.","facet":"A2","scores":[0,1,2,3,4]},{"id":10,"text":"من ترجیح می‌دهم که با ذهن باز به استقبال اتفاقات آینده بروم تا این که برای هر کاری طرح و نقشه قبلی داشته باشم.","facet":"C2","scores":[4,3,2,1,0]},{"id":11,"text":"من به ندرت احساس تنهایی و غمگینی می‌کنم.","facet":"N3","scores":[4,3,2,1,0]},{"id":12,"text":"من آدمی مسلط، قوی و قاطعی هستم.","facet":"E3","scores":[0,1,2,3,4]},{"id":13,"text":"بدون هیجانات قوی، زندگی برای من چیز جالبی نخواهد بود.","facet":"O3","scores":[0,1,2,3,4]},{"id":14,"text":"بعضی از مردم مرا آدمی خودخواه و خودمحور می‌دانند.","facet":"A3","scores":[4,3,2,1,0]},{"id":15,"text":"من سعی می‌کنم تا وظایف محوله را با صداقت و درستی انجام دهم.","facet":"C3","scores":[0,1,2,3,4]},{"id":16,"text":"من در معامله با مردم همیشه از این می‌ترسم که نکند مرتکب اشتباه بزرگی شوم.","facet":"N4","scores":[0,1,2,3,4]},{"id":17,"text":"من در موقع کار یا تفریح، عجله و شتاب به خرج نمی‌دهم.","facet":"E4","scores":[4,3,2,1,0]},{"id":18,"text":"من در کارهای خود از روش نسبتاً ثابت و جا افتاده‌ای پیروی می‌کنم.","facet":"O4","scores":[4,3,2,1,0]},{"id":19,"text":"من ترجیح می‌دهم با دیگران همکاری کنم تا با آن‌ها به رقابت بپردازم.","facet":"A4","scores":[0,1,2,3,4]},{"id":20,"text":"من آدم راحت طلب و تنبلی هستم.","facet":"C4","scores":[4,3,2,1,0]},{"id":21,"text":"من به ندرت در کاری زیاده روی می‌کنم.","facet":"N5","scores":[4,3,2,1,0]},{"id":22,"text":"من اغلب تشنه هیجان و تحریک هستم.","facet":"E5","scores":[0,1,2,3,4]},{"id":23,"text":"من اغلب از بازی کردن با نظریه‌ها و افکار انتزاعی لذت می‌برم.","facet":"O5","scores":[0,1,2,3,4]},{"id":24,"text":"من از لاف زدن درباره استعدادها و موفقیّت‌های خود، بد‌م نمی‌آید.","facet":"A5","scores":[4,3,2,1,0]},{"id":25,"text":"من به‌خوبی می‌توانم وقت و فعالیت خود را طوری تنظیم کنم که کارهای محوله، به موقع تمام شود.","facet":"C5","scores":[0,1,2,3,4]},{"id":26,"text":"من اغلب احساس درماندگی و ناتوانی می‌کنم و میل دارم شخص دیگری مسایلم را حل کند.","facet":"N6","scores":[0,1,2,3,4]},{"id":27,"text":"من هرگز آن‌قدر احساس خوشحالی نکرده‌ام که به اصطلاح از خوشی به هوا بپرم.","facet":"E6","scores":[4,3,2,1,0]},{"id":28,"text":"من معتقدم اگر به دانشجویان اجازه داده شود تا به سخنرانی بحث‌انگیز و متناقض، گوش دهند فقط باعث سردرگمی و انحراف بیشتر آن‌ها خواهد شد.","facet":"O6","scores":[4,3,2,1,0]},{"id":29,"text":"رهبران سیاسی باید درباره جنبه‌های انسانی برنامه‌های خود، آگاهی بیشتری داشته باشند.","facet":"A6","scores":[0,1,2,3,4]},{"id":30,"text":"در طی سال‌ها، من بعضی کارهای کاملاً بی‌ربط انجام داده‌ام.","facet":"C6","scores":[4,3,2,1,0]},{"id":31,"text":"من به آسانی دچار ترس می‌شوم.","facet":"N1","scores":[0,1,2,3,4]},{"id":32,"text":"من از صحبت کردن با دیگران چندان لذت نمی‌برم.","facet":"E1","scores":[4,3,2,1,0]},{"id":33,"text":"من سعی می‌کنم همه افکارم را در راستای واقعیت‌ها هدایت کرده و از پناه بردن به عالم رویا و تخیل خودداری نمایم.","facet":"O1","scores":[4,3,2,1,0]},{"id":34,"text":"من معتقدم که اکثر مردم اساساً دارای قصد و نیت خوب و دوستانه‌ای هستند.","facet":"A1","scores":[0,1,2,3,4]},{"id":35,"text":"من مسئولیت‌های اجتماعی از قبیل رای دادن را خیلی جدی نمی‌گیرم.","facet":"C1","scores":[4,3,2,1,0]},{"id":36,"text":"خلق و خوی من بیشتر وقت‌ها ثابت بوده و زیاد بالا و پایین نمی‌رود.","facet":"N2","scores":[4,3,2,1,0]},{"id":37,"text":"من دوست دارم همیشه افراد زیادی دور و برم باشند.","facet":"E2","scores":[0,1,2,3,4]},{"id":38,"text":"من بعضی مواقع کاملاً در موسیقی که گوش می‌دهم، غرق می‌شوم.","facet":"O2","scores":[0,1,2,3,4]},{"id":39,"text":"اگر نیاز باشد، من حاضرم از افراد دیگر برای رسیدن به مقاصد خود سوء استفاده کنم.","facet":"A2","scores":[4,3,2,1,0]},{"id":40,"text":"من اشیاء متعلق به خود را تمیز و پاکیزه نگه می‌دارم.","facet":"C2","scores":[0,1,2,3,4]},{"id":41,"text":"من بعضی وقت‌ها کاملاً احساس بی‌ارزشی می‌کنم.","facet":"N3","scores":[0,1,2,3,4]},{"id":42,"text":"من گاهی نمی‌توانم آن طور که باید از خود قاطعیت نشان دهم.","facet":"E3","scores":[4,3,2,1,0]},{"id":43,"text":"من به ندرت دچار احساسات و عواطف قوی می‌گردم.","facet":"O3","scores":[4,3,2,1,0]},{"id":44,"text":"من سعی می‌کنم با همه افرادی که ملاقات می‌کنم، رفتاری مؤدب و با نزاکت باشم.","facet":"A3","scores":[0,1,2,3,4]},{"id":45,"text":"گاه گاهی من آن طور که باید صادق و قابل اعتماد نیستم.","facet":"C3","scores":[4,3,2,1,0]},{"id":46,"text":"من وقتی با افراد دیگر هستم به ندرت احساس خجالت می‌کنم.","facet":"N4","scores":[4,3,2,1,0]},{"id":47,"text":"من وقتی کاری را انجام می‌دهم آن را با تمام علاقه و سرعت انجام می‌دهم.","facet":"E4","scores":[0,1,2,3,4]},{"id":48,"text":"من فکر می‌کنم یاد گرفتن و تمرین سرگرمی‌ها و کارهای ذوقی جدید، جالب است.","facet":"O4","scores":[0,1,2,3,4]},{"id":49,"text":"در مواردی که لازم باشد، من می‌توانم از دیگران ایراد گرفته و به آن‌ها کنایه بزنم.","facet":"A4","scores":[4,3,2,1,0]},{"id":50,"text":"من دارای اهداف روشن و مشخصی هستم و برای دستیابی به آن‌ها طبق برنامه منظمی عمل می‌کنم.","facet":"C4","scores":[0,1,2,3,4]},{"id":51,"text":"مقاومت در برابر خواست‌ها و هوس‌های آنی، برای من آسان نیست.","facet":"N5","scores":[0,1,2,3,4]},{"id":52,"text":"من از گذراندن تعطیلات خود در جاهای شلوغ و پرهیجان لذت نمی‌برم.","facet":"E5","scores":[4,3,2,1,0]},{"id":53,"text":"من بحث و استدلال درباره مطالب فلسفی را کاری بی‌فایده و کسل‌کننده می‌دانم.","facet":"O5","scores":[4,3,2,1,0]},{"id":54,"text":"من ترجیح می‌دهم که در مورد خودم و موفقیّت‌هایم حرفی نزنم.","facet":"A5","scores":[0,1,2,3,4]},{"id":55,"text":"من قبل از شروع به هر کاری مقدار زیادی وقت تلف می‌کنم.","facet":"C5","scores":[4,3,2,1,0]},{"id":56,"text":"احساس می‌کنم قادر هستم با بسیاری از مشکلات خود کنار بیایم.","facet":"N6","scores":[4,3,2,1,0]},{"id":57,"text":"من بعضی وقت‌ها حالت‌های شادی یا نشاط بسیار شدیدی را تجربه کرده‌ام.","facet":"E6","scores":[0,1,2,3,4]},{"id":58,"text":"من معتقدم که قوانین و سیاست‌های اجتماعی باید تغییر کنند تا نیازهای یک دنیای در حال تغییر و تحوّل را به خوبی منعکس سازند.","facet":"O6","scores":[0,1,2,3,4]},{"id":59,"text":"من از لحاظ نگرش‌های اجتماعی آدمی سخت‌گیر و بی‌گذشت هستم.","facet":"A6","scores":[4,3,2,1,0]},{"id":60,"text":"من قبل از این که تصمیمی بگیرم در مورد جوانب مختلف مسئله به دقت فکر می‌کنم.","facet":"C6","scores":[0,1,2,3,4]},{"id":61,"text":"من به ندرت احساس ترس و اضطراب می‌کنم.","facet":"N1","scores":[4,3,2,1,0]},{"id":62,"text":"من به آدمی خونگرم و خوشرو معروف هستم.","facet":"E1","scores":[0,1,2,3,4]},{"id":63,"text":"من زندگی تخیلی بسیار فعالی دارم.","facet":"O1","scores":[0,1,2,3,4]},{"id":64,"text":"من عقیده دارم که اکثر مردم، اگر به آن‌ها اجازه داده شود، از آدم سوء استفاده خواهند کرد.","facet":"A1","scores":[4,3,2,1,0]},{"id":65,"text":"من خود را در باره حوادث جاری مطلع نگه داشته و معمولاً تصمیمات عاقلانه‌ای اتخاذ می‌کنم.","facet":"C1","scores":[0,1,2,3,4]},{"id":66,"text":"من به آدمی جوشی و عصبی معروف هستم.","facet":"N2","scores":[0,1,2,3,4]},{"id":67,"text":"من معمولاً ترجیح می‌دهم کارها را به تنهایی انجام دهم.","facet":"E2","scores":[4,3,2,1,0]},{"id":68,"text":"تماشای صحنه‌های باله یا رقص‌های جدید مرا خسته و کسل می‌کند.","facet":"O2","scores":[4,3,2,1,0]},{"id":69,"text":"من حتی اگر بخواهم، نمی‌توانم کسی را گول بزنم.","facet":"A2","scores":[0,1,2,3,4]},{"id":70,"text":"من آدم بسیار منظم و با برنامه‌ای نیستم.","facet":"C2","scores":[4,3,2,1,0]},{"id":71,"text":"من به ندرت افسرده یا غمگین می‌شوم.","facet":"N3","scores":[4,3,2,1,0]},{"id":72,"text":"من غالباً در گروه‌هایی که عضو بوده‌ام، نقش رهبری را بر عهده داشته‌ام.","facet":"E3","scores":[0,1,2,3,4]},{"id":73,"text":"احساس و عاطفه‌ای که اشیاء مختلف در من ایجاد می‌کنند برای من مهم است.","facet":"O3","scores":[0,1,2,3,4]},{"id":74,"text":"بعضی افراد فکر می‌کنند من آدم فاقد احساسات و حسابگری هستم.","facet":"A3","scores":[4,3,2,1,0]},{"id":75,"text":"من بدهی‌های خود را به موقع و به طور کامل می‌پردازم.","facet":"C3","scores":[0,1,2,3,4]},{"id":76,"text":"بعضی وقت‌ها من طوری احساس خجالت کرده‌ام که دلم می‌خواست خود را از دیگران مخفی کنم.","facet":"N4","scores":[0,1,2,3,4]},{"id":77,"text":"کار من ممکن است کند باشد ولی با ثبات و یکنواخت است.","facet":"E4","scores":[4,3,2,1,0]},{"id":78,"text":"وقتی که روش صحیح انجام کاری را یافتم به همان روش می‌چسبم و ادامه می‌دهم.","facet":"O4","scores":[4,3,2,1,0]},{"id":79,"text":"من در نشان دادن خشم و عصبانیت درنگ و تأمل می‌کنم حتی اگر احساس کنم حق با من است.","facet":"A4","scores":[0,1,2,3,4]},{"id":80,"text":"هرگاه برنامه‌ای را برای اصلاح پاره‌ای از رفتارهای خود شروع می‌کنم، معمولاً بعد از چند روز آن را کنار می‌گذارم.","facet":"C4","scores":[4,3,2,1,0]},{"id":81,"text":"مقاومت در برابر وسوسه‌ها و خواهش‌های نفسانی برای من مشکل نیست.","facet":"N5","scores":[4,3,2,1,0]},{"id":82,"text":"من بعضی وقت‌ها کارهایی را انجام داده‌ام که هدف آن‌ها فقط هیجان و لذت بردن است.","facet":"E5","scores":[0,1,2,3,4]},{"id":83,"text":"من از حل مسئله‌های مشکل یا معما لذت می‌برم.","facet":"O5","scores":[0,1,2,3,4]},{"id":84,"text":"من از بیشتر مردم بهتر هستم و این را می‌دانم.","facet":"A5","scores":[4,3,2,1,0]},{"id":85,"text":"من آدم سازنده و مولدی هستم که همیشه مسئولیت‌های خود را به انجام می‌رساند.","facet":"C5","scores":[0,1,2,3,4]},{"id":86,"text":"وقتی که تحت فشار و استرس زیادی هستم بعضی مواقع احساس می‌کنم که دارم از هم می‌پاشم.","facet":"N6","scores":[0,1,2,3,4]},{"id":87,"text":"من آدم خوشحال و امیدواری نیستم.","facet":"E6","scores":[4,3,2,1,0]},{"id":88,"text":"من معتقدم که برای اخذ تصمیم درباره امور اخلاقی، ما باید از رهبران مذهبی خود کسب تکلیف و تقلید کنیم.","facet":"O6","scores":[4,3,2,1,0]},{"id":89,"text":"هر چه در مورد افراد فقیر و سالمند انجام دهیم، باز هم کم است.","facet":"A6","scores":[0,1,2,3,4]},{"id":90,"text":"گاه گاهی من اول عمل می‌کنم و بعد می‌اندیشم.","facet":"C6","scores":[4,3,2,1,0]},{"id":91,"text":"من اغلب دچار تنش بوده و عصبی هستم.","facet":"N1","scores":[0,1,2,3,4]},{"id":92,"text":"بیشتر مردم مرا فردی کم و بیش سرد و غیراجتماعی می‌دانند.","facet":"E1","scores":[4,3,2,1,0]},{"id":93,"text":"من دوست ندارم وقتم را با خیال‌بافی تلف کنم.","facet":"O1","scores":[4,3,2,1,0]},{"id":94,"text":"فکر می‌کنم بیشتر مردمی که با آن‌ها در تماس هستم افرادی درست‌کار و قابل اطمینان هستند.","facet":"A1","scores":[0,1,2,3,4]},{"id":95,"text":"من غالباً بدون آمادگی کافی در موقعیت‌های مختلف حاضر می‌شوم.","facet":"C1","scores":[4,3,2,1,0]},{"id":96,"text":"بیشتر مردم مرا آدمی زودرنج و بد اخلاق نمی‌دانند.","facet":"N2","scores":[4,3,2,1,0]},{"id":97,"text":"اگر برای مدت طولانی تنها باشم واقعاً احساس می‌کنم به افراد دیگر نیازمند هستم.","facet":"E2","scores":[0,1,2,3,4]},{"id":98,"text":"نظم و ترتیب خاصی که در هنر و طبیعت می‌بینم برای من بسیار جالب و شوق‌انگیز است.","facet":"O2","scores":[0,1,2,3,4]},{"id":99,"text":"کاملاً صادق و درست‌کار بودن برای تجارت و کسبی خوب نیست.","facet":"A2","scores":[4,3,2,1,0]},{"id":100,"text":"من دوست دارم هر چیزی را در جای مخصوص آن نگه دارم تا جای آن را به خوبی بدانم.","facet":"C2","scores":[0,1,2,3,4]},{"id":101,"text":"من گاهی دچار احساس پشیمانی و گناهکاری شدیدی شده‌ام.","facet":"N3","scores":[0,1,2,3,4]},{"id":102,"text":"در جلسات جمعی من می‌گذارم دیگران بیشتر حرف‌ها را بزنند.","facet":"E3","scores":[4,3,2,1,0]},{"id":103,"text":"به ندرت به احساسات آنی خود توجه می‌کنم.","facet":"O3","scores":[4,3,2,1,0]},{"id":104,"text":"من غالباً سعی می‌کنم نسبت به افکار و احساسات دیگران آگاهی و احترام نشان دهم.","facet":"A3","scores":[0,1,2,3,4]},{"id":105,"text":"من گاهی در بازی شطرنج یا ورزش تقلب می‌کنم.","facet":"C3","scores":[4,3,2,1,0]},{"id":106,"text":"اگر مردم مرا دست اندازند و مسخره کنند، من زیاد احساس ناراحتی و خجالت نمی‌کنم.","facet":"N4","scores":[4,3,2,1,0]},{"id":107,"text":"من اغلب احساس می‌کنم که سرشار از نیرو و انرژی هستم.","facet":"E4","scores":[0,1,2,3,4]},{"id":108,"text":"من اغلب غذاهای جدید و ناآشنا را امتحان می‌کنم.","facet":"O4","scores":[0,1,2,3,4]},{"id":109,"text":"من اگر اشخاصی را دوست نداشته باشم، آن را از آن‌ها مخفی نمی‌کنم.","facet":"A4","scores":[4,3,2,1,0]},{"id":110,"text":"من برای دستیابی به اهداف خود، سخت تلاش می‌کنم.","facet":"C4","scores":[0,1,2,3,4]},{"id":111,"text":"وقتی به غذای مورد علاقه‌ام دسترسی پیدا کنم غالباً بیشتر از حد می‌خورم.","facet":"N5","scores":[0,1,2,3,4]},{"id":112,"text":"من معمولاً از تماشای فیلم‌های منزجرکننده یا وحشتناک خودداری می‌کنم.","facet":"E5","scores":[4,3,2,1,0]},{"id":113,"text":"بعضی مواقع که مردم در مورد مسایل انتزاعی و نظری صحبت می‌کنند من علاقه‌ام را از دست می‌دهم.","facet":"O5","scores":[4,3,2,1,0]},{"id":114,"text":"من سعی می‌کنم آدم افتاده و فروتنی باشم.","facet":"A5","scores":[0,1,2,3,4]},{"id":115,"text":"من به زحمت می‌توانم خود را وادار به کاری کنم که باید انجام دهم.","facet":"C5","scores":[4,3,2,1,0]},{"id":116,"text":"من در مواقع اضطراری می‌توانم خونسردی خود را حفظ کنم.","facet":"N6","scores":[4,3,2,1,0]},{"id":117,"text":"من گاهی بیش از اندازه احساس خوشبختی می‌کنم.","facet":"E6","scores":[0,1,2,3,4]},{"id":118,"text":"من معتقدم که عقاید متفاوت افراد جوامع دیگر در مورد حق و ناحق از نظر خود آن‌ها معتبر است.","facet":"O6","scores":[0,1,2,3,4]},{"id":119,"text":"من در مورد آدم‌هایی که در خیابان‌ها گدایی می‌کنند، هیچ‌گونه احساس همدردی نمی‌کنم.","facet":"A6","scores":[4,3,2,1,0]},{"id":120,"text":"من همیشه قبل از این که دست به عملی بزنم، پیامدهای آن را مورد توجه قرار می‌دهم.","facet":"C6","scores":[0,1,2,3,4]},{"id":121,"text":"من به ندرت درباره آینده احساس ترس و نگرانی می‌کنم.","facet":"N1","scores":[4,3,2,1,0]},{"id":122,"text":"من واقعاً از صحبت کردن با دیگران لذت می‌برم.","facet":"E1","scores":[0,1,2,3,4]},{"id":123,"text":"من از تمرکز حواس روی یک موضوع خیالی یا رؤیا در بیداری و بررسی امکانات مختلف ناشی از آن لذت می‌برم، و به آن اجازه می‌دهم رشد کرده و شاخ و برگ پیدا کند.","facet":"O1","scores":[0,1,2,3,4]},{"id":124,"text":"هر وقت کسی در مورد من کار خوبی انجام دهد، من احساس بدگمانی و سوء ظن می‌کنم.","facet":"A1","scores":[4,3,2,1,0]},{"id":125,"text":"من به خاطر درستی قضاوتم به خود می‌بالم.","facet":"C1","scores":[0,1,2,3,4]},{"id":126,"text":"من اغلب نسبت به افرادی که با آن‌ها سر و کار دارم احساس تنفر و بیزاری می‌کنم.","facet":"N2","scores":[0,1,2,3,4]},{"id":127,"text":"من کارهایی را ترجیح می‌دهم که بتوانم به تنهایی و بدون تحمل مزاحمت دیگران، انجام دهم.","facet":"E2","scores":[4,3,2,1,0]},{"id":128,"text":"شعر تا ثیر چندانی روی من ندارد.","facet":"O2","scores":[4,3,2,1,0]},{"id":129,"text":"از این که به عنوان آدم ریاکاری شناخته شوم، متنفرم.","facet":"A2","scores":[0,1,2,3,4]},{"id":130,"text":"به نظر نمی‌رسد هرگز بتوانم کارهای خود را نظم و ترتیب دهم.","facet":"C2","scores":[4,3,2,1,0]},{"id":131,"text":"هرگاه اشتباهی رخ دهد (یا عیب و ایرادی پیش بیاید) من خود را سرزنش می‌کنم.","facet":"N3","scores":[0,1,2,3,4]},{"id":132,"text":"افراد دیگر اغلب در تصمیم‌گیری خود از من کسب تکلیف (یا به عنوان الگو) استفاده می‌کنند.","facet":"E3","scores":[0,1,2,3,4]},{"id":133,"text":"هیجانات و احساسات گوناگونی به من دست می‌دهند.","facet":"O3","scores":[0,1,2,3,4]},{"id":134,"text":"من به سخاوت و دست و دلبازی مشهور نیستم.","facet":"A3","scores":[4,3,2,1,0]},{"id":135,"text":"همیشه وقتی قول انجام کاری را بدهم، مردم می‌توانند به انجام آن کار اطمینان کنند.","facet":"C3","scores":[0,1,2,3,4]},{"id":136,"text":"من اغلب نسبت به دیگران احساس حقارت می‌کنم.","facet":"N4","scores":[0,1,2,3,4]},{"id":137,"text":"من به اندازه دیگران چابک و سرزنده نیستم.","facet":"E4","scores":[4,3,2,1,0]},{"id":138,"text":"ترجیح می‌دهم وقتم را در محیط‌های مأنوس و آشنا بگذرانم.","facet":"O4","scores":[4,3,2,1,0]},{"id":139,"text":"وقتی کسی به من توهین کند، من فقط سعی می‌کنم او را ببخشم و فراموش کنم.","facet":"A4","scores":[0,1,2,3,4]},{"id":140,"text":"من احساس نمی‌کنم که مجبورم با دیگران رقابت نموده و از آن‌ها بهتر عمل کنم.","facet":"C4","scores":[4,3,2,1,0]},{"id":141,"text":"من به ندرت در مقابل خواست‌های آنی خود، تسلیم می‌شوم.","facet":"N5","scores":[4,3,2,1,0]},{"id":142,"text":"من ترجیح می‌دهم در جاهایی باشم که کانون فعالیت و عمل است.","facet":"E5","scores":[0,1,2,3,4]},{"id":143,"text":"من از سر و کله زدن با مسایل یا معماهایی که ذهن آدم را به کوشش و چالش وادار می‌کند، لذت می‌برم.","facet":"O5","scores":[0,1,2,3,4]},{"id":144,"text":"در مورد خودم نظر بسیار مثبتی دارم.","facet":"A5","scores":[4,3,2,1,0]},{"id":145,"text":"من وقتی کاری را شروع می‌کنم، همیشه آن را به اتمام می‌رسانم.","facet":"C5","scores":[0,1,2,3,4]},{"id":146,"text":"تصمیم گرفتن و اتخاذ یک روش قطعی، غالباً برای من مشکل است.","facet":"N6","scores":[0,1,2,3,4]},{"id":147,"text":"من خودم را آدم خیلی شگول و سرزنده‌ای نمی‌دانم.","facet":"E6","scores":[4,3,2,1,0]},{"id":148,"text":"من معتقدم که وفاداری به ایده‌آل‌ها و اصول مورد قبول خود، بیش از آزادمنشی و خالی از تعصب بودن اهمیت دارد.","facet":"O6","scores":[4,3,2,1,0]},{"id":149,"text":"نیازهای انسانی افراد همیشه باید بر ملاحظات اقتصادی دولت، اولویت داده شوند.","facet":"A6","scores":[0,1,2,3,4]},{"id":150,"text":"من غالباً کارها را بدون تأمل قبلی و به خاطر یک انگیزه آنی انجام می‌دهم.","facet":"C6","scores":[4,3,2,1,0]},{"id":151,"text":"من اغلب نگران این هستم که مبادا کارها طبق نقشه و به درستی پیش نروند.","facet":"N1","scores":[0,1,2,3,4]},{"id":152,"text":"لبخند زدن به افراد غریبه و ایجاد ارتباط با آن‌ها برای من آسان است.","facet":"E1","scores":[0,1,2,3,4]},{"id":153,"text":"من هر وقت احساس می‌کنم ذهنم در جهت خیال‌پردازی می‌رود معمولاً خود را به کاری مشغول می‌کنم و به جای خیال‌پردازی، حواس خود را روی آن کار متمرکز می‌سازم.","facet":"O1","scores":[4,3,2,1,0]},{"id":154,"text":"واکنش اولیه من به مردم آن است که به آن‌ها اعتماد کنم.","facet":"A1","scores":[0,1,2,3,4]},{"id":155,"text":"من ظاهراً در هیچ کاری موفق نمی‌شوم.","facet":"C1","scores":[4,3,2,1,0]},{"id":156,"text":"من خیلی به ندرت واقعاً عصبانی می‌شوم.","facet":"N2","scores":[4,3,2,1,0]},{"id":157,"text":"ترجیح می‌دهم تعطیلات خود را در یک ساحل عمومی شلوغ بگذرانم تا در یک کلبه جنگلی دور افتاده.","facet":"E2","scores":[0,1,2,3,4]},{"id":158,"text":"انواع خاصی از موسیقی بیش از اندازه برای من شورانگیز هستند.","facet":"O2","scores":[0,1,2,3,4]},{"id":159,"text":"بعضی وقت‌ها من مردم را با چرب زبانی و تقلب به انجام کارهای مورد نظر خود، وادار می‌کنم.","facet":"A2","scores":[4,3,2,1,0]},{"id":160,"text":"من معمولاً آدمی کم و بیش سخت‌گیر و پرتوقع هستم.","facet":"C2","scores":[0,1,2,3,4]},{"id":161,"text":"من نسبت به خودم نظری منفی دارم.","facet":"N3","scores":[0,1,2,3,4]},{"id":162,"text":"من ترجیح می‌دهم دنبال کارهای خود را بگیرم، تا این که رهبر دیگران باشم.","facet":"E3","scores":[4,3,2,1,0]},{"id":163,"text":"من به ندرت متوجه خلق و عواطفی که محیط‌های مختلف به وجود می‌آورند، می‌شوم.","facet":"O3","scores":[4,3,2,1,0]},{"id":164,"text":"بیشتر مردمی که می‌شناسم مرا دوست دارند.","facet":"A3","scores":[0,1,2,3,4]},{"id":165,"text":"من دقیقاً از اصول اخلاقی پیروی می‌کنم.","facet":"C3","scores":[0,1,2,3,4]},{"id":166,"text":"من در حضور رؤسای خود و دیگر افراد مهم و صاحب قدرت، احساس آرامش و راحتی می‌کنم.","facet":"N4","scores":[4,3,2,1,0]},{"id":167,"text":"من معمولاً در حال عجله به نظر می‌رسم.","facet":"E4","scores":[0,1,2,3,4]},{"id":168,"text":"بعضی مواقع تنها برای این که کار تازه‌ای انجام داده باشم، محل اثاثیه خانه را تغییر می‌دهم.","facet":"O4","scores":[0,1,2,3,4]},{"id":169,"text":"اگر کسی با من شروع به دعوا و مرافعه کند، من هم آماده‌ام، جواب او را با دعوا بدهم.","facet":"A4","scores":[4,3,2,1,0]},{"id":170,"text":"من تلاش می‌کنم تمام چیزهایی را که می‌توانم، به دست آورم.","facet":"C4","scores":[0,1,2,3,4]},{"id":171,"text":"من گاهی آن‌قدر غذا می‌خورم که بالا می‌آورم.","facet":"N5","scores":[0,1,2,3,4]},{"id":172,"text":"من عاشق ترس و هیجانی هستم که معمولاً سوار شدن به چرخ فلک یا کارهای خطرناک دیگر ایجاد می‌کند.","facet":"E5","scores":[0,1,2,3,4]},{"id":173,"text":"من علاقه‌ای به تأمل و تفکر جدی درباره سرنوشت جهان یا انسان ندارم.","facet":"O5","scores":[4,3,2,1,0]},{"id":174,"text":"من احساس می‌کنم که مزیتی بر افراد دیگر ندارم (صرفنظر از موقعیت و وضع افراد).","facet":"A5","scores":[0,1,2,3,4]},{"id":175,"text":"وقتی که اجرای یک طرح یا نقشه با مشکل روبرو می‌شود، من تمایل پیدا می‌کنم طرح دیگری را شروع کنم.","facet":"C5","scores":[4,3,2,1,0]},{"id":176,"text":"من در یک موقعیت بحرانی به خوبی می‌توانم خود را کنترل و اداره کنم.","facet":"N6","scores":[4,3,2,1,0]},{"id":177,"text":"من آدم خوش‌مشرب، شاد و با روحیه‌ای هستم.","facet":"E6","scores":[0,1,2,3,4]},{"id":178,"text":"من خود را آدمی با سعه صدر می‌دانم که می‌تواند راه و رسم زندگی و طرز فکر دیگران را به‌به خوبی قبول و تحمل نماید.","facet":"O6","scores":[0,1,2,3,4]},{"id":179,"text":"من معتقدم که همه انسان‌ها با ارزش و قابل احترامند.","facet":"A6","scores":[0,1,2,3,4]},{"id":180,"text":"من به ندرت تصمیمی عجولانه می‌گیرم.","facet":"C6","scores":[0,1,2,3,4]},{"id":181,"text":"در مقایسه با بیشتر مردم، من از چیزهای کمتری می‌ترسم.","facet":"N1","scores":[4,3,2,1,0]},{"id":182,"text":"من به دوستان خود وابستگی عاطفی زیادی دارم.","facet":"E1","scores":[0,1,2,3,4]},{"id":183,"text":"بچه که بودم هرگز از بازی‌هایی که مستلزم تقلید نقش دیگران باشد، لذت نمی‌بردم.","facet":"O1","scores":[4,3,2,1,0]},{"id":184,"text":"من معمولاً در مورد افراد دیگر خوش‌بین و خوش‌باور هستم.","facet":"A1","scores":[0,1,2,3,4]},{"id":185,"text":"من فرد بسیار شایسته و کارآیی هستم.","facet":"C1","scores":[0,1,2,3,4]},{"id":186,"text":"بعضی وقت‌ها من نسبت به دیگران احساس خصومت و آزردگی کرده‌ام.","facet":"N2","scores":[0,1,2,3,4]},{"id":187,"text":"معاشرت و گردهمایی‌های اجتماعی معمولاً برای من ناخوشایند و کسل‌کننده هستند.","facet":"E2","scores":[4,3,2,1,0]},{"id":188,"text":"بعضی مواقع که شعری را می‌خوانم یا به یک اثر هنری نگاه می‌کنم، موجی از احساس افسردگی یا هیجان مرا در بر می‌گیرد.","facet":"O2","scores":[0,1,2,3,4]},{"id":189,"text":"من بعضی وقت‌ها با اعمال زور یا تملق و خوش‌آمدگویی مردم را به انجام کارهای مورد نظر خود وادار می‌کنم.","facet":"A2","scores":[4,3,2,1,0]},{"id":190,"text":"من در مورد تمیز کردن چیزها وسواس ندارم.","facet":"C2","scores":[4,3,2,1,0]},{"id":191,"text":"بعضی وقت‌ها زندگی به نظرم تیره و نومیدکننده می‌آید.","facet":"N3","scores":[0,1,2,3,4]},{"id":192,"text":"در موقع صحبت با دیگران، من غالباً بیشتر از دیگران حرف می‌زنم.","facet":"E3","scores":[0,1,2,3,4]},{"id":193,"text":"هم‌حس شدن با دیگران، یعنی داشتن همان احساس که دیگران دارند، برای من آسان است.","facet":"O3","scores":[0,1,2,3,4]},{"id":194,"text":"من خود را آدم خیّر و نیکوکاری می‌دانم.","facet":"A3","scores":[0,1,2,3,4]},{"id":195,"text":"من سعی می‌کنم کارهای خود را با دقت انجام دهم تا انجام مجدد آنها، لزوم پیدا نکند.","facet":"C3","scores":[0,1,2,3,4]},{"id":196,"text":"اگر در مورد کسی حرف بدی زده یا کار غلطی انجام داده باشم، به سختی می‌توانم بار دیگر به روی او نگاه کنم.","facet":"N4","scores":[0,1,2,3,4]},{"id":197,"text":"همه زندگی و کارهای من با سرعت انجام می‌گیرد.","facet":"E4","scores":[0,1,2,3,4]},{"id":198,"text":"در موقع استفاده از تعطیلات، من ترجیح می‌دهم به جاهایی بروم که قبلاً آنها را امتحان کرده و به درستی شناخته‌ام.","facet":"O4","scores":[4,3,2,1,0]},{"id":199,"text":"من آدم کله‌شق و سرسختی هستم.","facet":"A4","scores":[4,3,2,1,0]},{"id":200,"text":"من سعی می‌کنم همه کارهای خود را به بهترین نحو انجام دهم.","facet":"C4","scores":[0,1,2,3,4]},{"id":201,"text":"من بعضی مواقع کارهایی را بدون تأمل انجام می‌دهم که بعداً پشیمان می‌شوم.","facet":"N5","scores":[0,1,2,3,4]},{"id":202,"text":"من از رنگ‌های روشن و لباس‌های پرزرق و برق خوشم می‌آید.","facet":"E5","scores":[0,1,2,3,4]},{"id":203,"text":"من کنجکاوی فکری بسیار زیادی دارم.","facet":"O5","scores":[0,1,2,3,4]},{"id":204,"text":"من ترجیح می‌دهم از دیگران تمجید کنم تا این که خودم مورد تمجید قرار گیرم.","facet":"A5","scores":[0,1,2,3,4]},{"id":205,"text":"آن‌قدر خرده کاری برای انجام دادن وجود دارد که من گاهی همه آنها را نادیده می‌گیرم.","facet":"C5","scores":[4,3,2,1,0]},{"id":206,"text":"در شرایطی که به نظر می‌رسد همه چیز به طور غلط پیش می‌رود، من باز هم می‌توانم تصمیمات خوبی اتخاذ کنم.","facet":"N6","scores":[4,3,2,1,0]},{"id":207,"text":"من به ندرت برای توصیف تجارب خود از کلماتی چون فوق‌العاده یا جنجالی استفاده می‌کنم.","facet":"E6","scores":[4,3,2,1,0]},{"id":208,"text":"من فکر می‌کنم اگر کسی در سن ۲۵ سالگی هنوز نداند به چه چیزهایی اعتقاد دارد، باید در سلامت عقل او شک کرد.","facet":"O6","scores":[4,3,2,1,0]},{"id":209,"text":"من نسبت به افرادی که کمتر از من خوشبخت هستند، احساس همدردی می‌کنم.","facet":"A6","scores":[0,1,2,3,4]},{"id":210,"text":"من قبل از رفتن به یک مسافرت به دقت برنامه‌ریزی می‌کنم.","facet":"C6","scores":[0,1,2,3,4]},{"id":211,"text":"بعضی مواقع افکار ترسناکی به ذهن من می‌آیند.","facet":"N1","scores":[0,1,2,3,4]},{"id":212,"text":"من نسبت به همه همکاران خود نوعی علاقه و مسئولیت شخصی احساس می‌کنم.","facet":"E1","scores":[0,1,2,3,4]},{"id":213,"text":"من نمی‌توانم بگذارم افکارم در هر جهتی که می‌خواهند سیر کنند.","facet":"O1","scores":[4,3,2,1,0]},{"id":214,"text":"من به طبیعت و ذات انسان بسیار اعتماد دارم.","facet":"A1","scores":[0,1,2,3,4]},{"id":215,"text":"من در کار خود فردی مؤثر و کارآمد هستم.","facet":"C1","scores":[0,1,2,3,4]},{"id":216,"text":"حتی آزردگی‌ها و ناراحتی‌های خیلی کوچک می‌توانند در من احساس ناکامی و محرومیت کنند.","facet":"N2","scores":[0,1,2,3,4]},{"id":217,"text":"من از مهمانی‌های بزرگ و پرجمعیّت لذت می‌برم.","facet":"E2","scores":[0,1,2,3,4]},{"id":218,"text":"من از خواندن اشعاری که روی احساسات و تخیلات تأکید می‌کنند، بیشتر لذت می‌برم تا اشعاری که داستان خاصی را بیان می‌کنند.","facet":"O2","scores":[0,1,2,3,4]},{"id":219,"text":"من از زیرکی خود در کنترل و اداره مردم به خود می‌بالم.","facet":"A2","scores":[4,3,2,1,0]},{"id":220,"text":"من وقت زیادی را برای پیدا کردن چیزهایی که در جای اشتباه گذاشته‌ام می‌گذارم.","facet":"C2","scores":[4,3,2,1,0]},{"id":221,"text":"بیشتر وقت‌ها که کارها طبق نقشه پیش نمی‌رود یا اشتباه از آب در می‌آیند، احساس دلسردی می‌کنم و می‌خواهم آنها را ناتمام رها کنم.","facet":"N3","scores":[0,1,2,3,4]},{"id":222,"text":"قبول مسئولیت اداره یا رهبری یک موقعیت برای من آسان نیست.","facet":"E3","scores":[4,3,2,1,0]},{"id":223,"text":"اشیاء غیرعادی از قبیل بعضی عطرها یا اسامی مکان‌های دور می‌توانند احساسات و عواطف شدیدی در من ایجاد نمایند.","facet":"O3","scores":[0,1,2,3,4]},{"id":224,"text":"من اگر بتوانم به دیگران کمک کنم، به آسانی و بدون درخواست آنها آن کار را می‌کنم.","facet":"A3","scores":[0,1,2,3,4]},{"id":225,"text":"من واقعاً باید مریض باشم تا یک روز سر کار نروم.","facet":"C3","scores":[0,1,2,3,4]},{"id":226,"text":"وقتی افراد آشنای من کار احمقانه‌ای انجام می‌دهند به جای آنها احساس خجالت می‌کنم.","facet":"N4","scores":[0,1,2,3,4]},{"id":227,"text":"من شخص بسیار فعالی هستم.","facet":"E4","scores":[0,1,2,3,4]},{"id":228,"text":"من وقتی به جایی می‌روم، از همان مسیر همیشگی استفاده می‌کنم.","facet":"O4","scores":[4,3,2,1,0]},{"id":229,"text":"من اغلب با اعضای خانواده و همکارانم بگو مگو دارم.","facet":"A4","scores":[4,3,2,1,0]},{"id":230,"text":"من از جمله افرادی هستم که نمی‌توانند هرگز بیکار بنشینند.","facet":"C4","scores":[0,1,2,3,4]},{"id":231,"text":"من همیشه می‌توانم احساساتم را کنترل کنم.","facet":"N5","scores":[4,3,2,1,0]},{"id":232,"text":"در حوادث ورزشی، من دوست دارم جزیی از جمعیّت باشم و مثل بقیه رفتار کنم.","facet":"E5","scores":[0,1,2,3,4]},{"id":233,"text":"من علایق فکری وسیع و متنوعی دارم.","facet":"O5","scores":[0,1,2,3,4]},{"id":234,"text":"من آدم مهم و برتری هستم.","facet":"A5","scores":[4,3,2,1,0]},{"id":235,"text":"من آدم بسیار با انضباطی هستم و می‌توانم خود را خوب کنترل کنم.","facet":"C5","scores":[0,1,2,3,4]},{"id":236,"text":"من از لحاظ عاطفی آدم کاملاً با ثبات و متعادلی هستم.","facet":"N6","scores":[4,3,2,1,0]},{"id":237,"text":"من زود خنده‌ام می‌گیرد.","facet":"E6","scores":[0,1,2,3,4]},{"id":238,"text":"به عقیده من فلسفه جدید «آزادی فردی» فلسفه قابل قبولی نیست.","facet":"O6","scores":[4,3,2,1,0]},{"id":239,"text":"من ترجیح می‌دهم دیگران مرا فرد دل‌رحم و خطابخش بشناسند تا صرفاً طرفدار اجرای عدالت.","facet":"A6","scores":[0,1,2,3,4]},{"id":240,"text":"من قبل از پاسخ دادن به هر سؤال به دقت درباره آن فکر می‌کنم.","facet":"C6","scores":[0,1,2,3,4]}],"factors":[{"code":"N","name":"روان‌آزرده‌گرایی","facets":["N1","N2","N3","N4","N5","N6"]},{"code":"E","name":"برون‌گرایی","facets":["E1","E2","E3","E4","E5","E6"]},{"code":"O","name":"گشودگی","facets":["O1","O2","O3","O4","O5","O6"]},{"code":"A","name":"موافق بودن","facets":["A1","A2","A3","A4","A5","A6"]},{"code":"C","name":"باوجدان بودن","facets":["C1","C2","C3","C4","C5","C6"]}],"facets":[{"code":"N1","name":"اضطراب","factor":"N","interpretation":"اضطراب: افراد مضطرب معمولاً نگران، ترسیده، مستعد نگرانی، عصبی، پرتنش و وحشت‌زده هستند. این مقیاس ترس‌های اختصاصی را اندازه نمی‌گیرد، اما معمولاً افراد با نمره بالا ترس‌های اختصاصی و نیز اضطراب فراگیر دارند و افراد با نمره پایین افرادی آرام و راحت می‌باشند. این افراد معمولاً در مواردی که امور به خواست آنها پیش نمی‌رود، ستیزه‌جویی نمی‌کنند."},{"code":"N2","name":"خشم و کینه","factor":"N","interpretation":"خصومت: مقیاس خشم و کینه‌توزی گرایش فرد به تجربه‌های خشم و حالت‌های وابسته به آن هم‌چون احساس درماندگی¹ و ناکامی را اندازه‌گیری می‌کند. این مقیاس آمادگی فرد به احساس خشم، اعم از اینکه به‌صورت آشکار بروز کرده و یا به‌صورت نهفته در فرد باقی بماند را نشان می‌دهد. بروز کردن یا بروزنکردن خشم، به سطح نمره فرد در شاخص موافق بودن بستگی دارد. در افراد ناسازگار معمولاً نمره این مقیاس بالا می‌رود. افراد با نمره پایین در این مقیاس راحت طلب بوده و هنگام خشم، آرام هستند."},{"code":"N3","name":"افسردگی","factor":"N","interpretation":"افسردگی: افراد با نمرات بالا مستعد احساس گناه، غم، ناامیدی و تنهایی هستند و به راحتی ناامید و سرخورده می‌شوند. در نمرات پایین افراد به ندرت چنین هیجان‌هایی را تجربه می‌کنند اما آنها لزوماً افراد سرزنده و سرخوشی نیستند."},{"code":"N4","name":"احساس تقصیر/خودآگاهی","factor":"N","interpretation":"هشیاری نسبت به خود: حالت‌های هیجانی شرم، خجالت و دستپاچگی ناشی از این حالت‌ها، از ارکان اساسی این مقیاس‌اند. افراد هشیار نسبت به خود، افرادی هستند که در موقعیت‌های بین فردی راحت نیستند و مستعد احساس حقارت می‌باشند. این افراد معمولاً خجالت‌ی بوده و در جمع‌های بزرگ دارای اضطراب اجتماعی هستند. نمرات کمتر لزوماً مهارت‌های اجتماعی بهتر یا متعادل را نمی‌سنجند و این افراد در موقعیتهای اجتماعی برآشفته و مضطرب نیستند."},{"code":"N5","name":"تکانشوری","factor":"N","interpretation":"شتاب‌زدگی یا تکانشوری²: این مقیاس یعنی ناتوانی در کشش‌ها و هوس‌ها. افراد در نمرات پایین مقاومت در مقابل وسوسه‌هایی مثل هوس‌ها، میل‌ها و آرزوها را آسان‌تر می‌دانند و تحمل بالاتری در مقابل ناکامی دارند."},{"code":"N6","name":"آسیب‌پذیری از استرس","factor":"N","interpretation":"آسیب‌پذیری³: آخرین مقیاس N مقیاس آسیب‌پذیری به استرس است. افراد با نمره بالا احساس ناتوانی در سازش با استرس‌های روزمره می‌کنند. پس در موقعیت‌های فوق‌العاده و استرس‌زا به طور اجباری به دیگران متوسل شده و یا ناامید و پریشان می‌شوند. افراد با نمره پایین قادر به کنترل خود در موقعیت‌های استرس‌زا می‌باشند."},{"code":"E1","name":"صمیمیت","factor":"E","interpretation":"گرم بودن¹: افراد صمیمی و با محبت که ارتباط دوستانه‌تری با دیگران دارند، در این مقیاس نمره بالاتری به دست می‌آورند. این افراد صادقانه دیگران را دوست دارند و به آسانی با دیگران مراوده و رفاقت برقرار می‌سازند. نمرات پایین در این مقیاس ضرورتاً به مفهوم روابط خصمانه و یا کینه‌توزی نیست اما این افراد در روابط خود خیلی رسمی و محافظه‌کار هستند و مایلند با دیگران در فاصله‌ای نسبی قرار داشته باشند."},{"code":"E2","name":"جمع‌گرایی","factor":"E","interpretation":"معاشرتی بودن²: افراد جمع‌گرا از بودن با دیگران لذت می‌برند و در هنگام بودن در جمع، احساس شادمانی می‌کنند. نمره پایین نشانه تمایل آنان به تنهایی و اجتناب از همکاری اجتماعی فعالانه می‌باشد."},{"code":"E3","name":"قاطعیت","factor":"E","interpretation":"ابراز وجود³: نمرات بالا نشانه جرات و قدرت افراد است. آنها در گروه، پیشرو و پیشگامند و نقش رهبر را به عهده دارند. افراد با نمرات پایین ترجیح می‌دهند که به جای قرار گرفتن در متن، در زمینه قرار گیرند."},{"code":"E4","name":"فعالیت","factor":"E","interpretation":"فعال بودن⁴: افراد با نمرات بالا فعالیت سریعی دارند. آنان معمولاً پرانرژی بوده و همیشه مشغول فعالیت‌اند. این افراد زندگی پرتحرکی دارند. افراد با نمرات پایین گرچه لزوماً کم تحرک یا تنبل نیستند اما در فعالیت‌های خود راحت بوده و فراغت بیشتری برای خود فراهم می‌سازند و دارای آهنگ حرکتی کندتر و آرام‌تری هستند."},{"code":"E5","name":"هیجان‌خواهی","factor":"E","interpretation":"هیجان خواهی⁵: افراد با نمرات بالا در آرزوی تحریک و هیجان هستند. رنگ‌های روشن و محیط‌های شلوغ را دوست دارند. نمرات پایین نشان‌دهنده نیاز کمتر به تحریک است."},{"code":"E6","name":"عواطف مثبت","factor":"E","interpretation":"هیجان مثبت: تمایل به تجربه هیجان‌های مثبت مانند شادی، لذت، عشق و هیجان را می‌سنجد. افراد با نمرات بالا به راحتی و فراوانی می‌خندند و اغلب خنده‌رو و بشاش هستند و روحیه‌ای شاد و خوش‌بین دارند. نمرات پایین لزوماً نشانه ناشادی نیست بلکه صرفاً شادی را کمتر"},{"code":"O1","name":"تخیل","factor":"O","interpretation":"تخیل¹: این افراد تصورات روشن و زندگی تخیلی فعالی دارند، این افراد به دنبال خیال، نه به عنوان یک سازوکار فرار، بلکه برای ایجاد یک دنیای درونی زیبا و جالب علاقه‌مندند. افراد با نمره کم، بی‌روح هستند، دارای افکار عادی‌ترند و ترجیح می‌دهند که ذهنیت خود را تحت کنترل داشته باشند و روی وظایف و کارهای خود تمرکز کنند."},{"code":"O2","name":"زیبایی‌شناسی","factor":"O","interpretation":"زیبایی‌پسندی یا زیبایی‌شناسی²: افراد دارای نمره بالا درک عمیق‌تری از هنر و زیبایی دارند. این افراد با شعر تهییج می‌شوند، جذب موسیقی و عاشق هنر می‌شوند ولی ضرورتاً هنرمند نیستند. افراد دارای نمرات پایین تقریباً به هنر و زیبایی بی‌علاقه‌اند."},{"code":"O3","name":"احساسات","factor":"O","interpretation":"احساسات یا عواطف³: گشودگی به عواطف و احساسات یعنی اینکه فرد دارای قدرت خوبی برای درک عواطف و هیجان‌های شخصی بوده و دیدگاه مثبتی به هیجان‌ها به عنوان یکی از ابعاد مهم زندگی دارد. افراد با نمرات بالا، موقعیت‌های هیجانی را خیلی بیشتر و عمیق‌تر تجربه می‌کنند و شدت شادی و غم آنها بیشتر و برجسته‌تر از دیگران است. افراد با نمره پایین، عواطفی یکنواخت یا سطحی داشته بر این باورند که موقعیت‌های هیجانی و حالت‌های احساسی در زندگی اهمیت چندانی ندارند."},{"code":"O4","name":"اعمال/کنش‌ها","factor":"O","interpretation":"اعمال یا کنش‌ها¹: گشودگی در رفتار به شکل علاقه‌مندی به داشتن فعالیت‌های مختلف، رفتن به محل‌های جدید و یا حتی خوردن غذاهای غیر معمول نمایان می‌شود. افراد دارای نمره بالا، تازگی و تنوع را به امور آشنا و معمول ترجیح می‌دهند و در خلال زمان ممکن است دارای مسئولیت‌های متنوعی باشند، در حالی که افراد با نمره پایین، در برابر تغییرات مقاوم هستند."},{"code":"O5","name":"نظرات","factor":"O","interpretation":"عقاید یا دیدگاه‌ها²: کنجکاوی‌های روشنفکرانه یکی از جنبه‌های گشودگی است که از دیرباز مورد توجه قرار گرفته است (فیسک، ۱۹۴۹). این ویژگی نه تنها علاقه‌های روشنفکرانه فعال را فقط برای جنبه‌های قضیه پیگیری می‌کند، بلکه مشتاق و علاقه‌مند به داشتن ذهنیت باز و درک جنبه‌های نوین و احتمالاً نظرات غیرمعمول است. افراد با نمره بالا از دیدگاه‌های فلسفی، چالش با معماها و محرک‌های ذهنی لذت می‌برند و افراد با نمره پایین کنجکاوی محدودی دارند."},{"code":"O6","name":"ارزش‌ها","factor":"O","interpretation":"ارزش‌ها³: گشودگی به ارزش‌ها یعنی آمادگی برای بازبینی ارزش‌های مذهبی، سیاسی و اجتماعی. افراد بسته به این موضوع‌ها معمولاً در برابر منابع قدرت و آداب و رسوم اجتماعی، گذشته از گرایش حزبی و سیاسی، محافظه‌کار هستند. باید توجه داشت که گشودگی به ارزش‌ها بیشتر در نقطه مقابل دگماتیسم قرار دارد."},{"code":"A1","name":"اعتماد","factor":"A","interpretation":"اعتماد¹: افراد با نمره بالا بر این باورند که دیگران درست‌کار و خوش‌بین هستند، قابل اعتمادند و حسن نیت دارند. افراد دارای نمره پایین در این مقیاس، به دیگران بدبین و بدگمان هستند و آنها را ناصادق و خطرناک می‌شمارند."},{"code":"A2","name":"سادگی/رک‌گویی","factor":"A","interpretation":"رک‌گویی یا سادگی²: افراد با نمره بالا رک، بی‌ریا و صاف و ساده و از نظر اجتماعی ناپخته هستند و افراد با نمره پایین زیرک‌اند و مایلند که دیگران را در دست داشته باشند یا آنها را دست بیندازند. البته نباید این مقیاس را به تنهایی عامل دروغ‌سنجی، مقیاس اعتبار آزمون و یا مقیاسی برای سنجش راست‌گویی فرد در نظر گرفت."},{"code":"A3","name":"همدردی/نوع‌دوستی","factor":"A","interpretation":"نوع دوستی³: افراد دارای نمره بالا توجه فعالی به دیگران دارند، به منافع دیگران اهمیت می‌دهند و مشتاق کمک به افراد نیازمند هستند. افراد با نمره پایین تا اندازه‌ای خودمحور بوده و به شرکت در مسایل دیگران بی‌علاقه‌اند."},{"code":"A4","name":"تبعیت/همراهی","factor":"A","interpretation":"همراهی⁴: این مقیاس با واکنش فرد به تعارض‌های بین فردی در ارتباط است. افراد با نمره بالا می‌توانند پرخاشگری خود را به خوبی کنترل نمایند و برای بخشیدن و فراموش کردن خطاها آمادگی دارند. آنان افرادی مطیع، فروتن و متعادل هستند. افراد دارای نمره پایین پرخاشگر و رقابت‌جو هستند و در مواقع ضروری ناراحتی خود را ابراز می‌کنند."},{"code":"A5","name":"تواضع","factor":"A","interpretation":"تواضع⁵: افراد دارای نمره بالا، افرادی فروتن و دارای توانایی در نادیده گرفتن منافع خود هستند. البته این افراد ضرورتاً کمبود اعتماد به نفس ندارند. افراد با نمره پایین متکبر هستند و فکر می‌کنند که افرادی استثنایی می‌باشند. جنبه‌های بیمارگونه این ویژگی در شخصیت‌های خودشیفته دیده می‌شود."},{"code":"A6","name":"درک دیگران","factor":"A","interpretation":"دل‌رحم بودن یا نرمش در برابر دیگران⁶: این مقیاس وجوه همدلی و توجه به دیگران را اندازه می‌گیرد. افراد دارای نمره بالا به سوی دیگران گرایش دارند و در سیاست‌های اجتماعی طرفدار افراد و نیازهای آنها هستند. افراد دارای نمرات پایین سرسخت‌تر از دیگرانند و کمتر تحت تأثیر رحم و شفقت دست به بخشندگی می‌زنند."},{"code":"C1","name":"شایستگی","factor":"C","interpretation":"کفایت یا شایستگی¹: شایستگی به احساس فرد نسبت به توانایی، عقل، تدبیر و تأثیر بر محیط باز می‌گردد. نمره بالا نشان‌دهنده آمادگی و قابلیت فرد در ارزیابی زندگی است و نمره پایین نشان‌دهنده بی‌عقیده بودن به توانایی‌ها و احساس شایستگی است. از بین همه مقیاس‌های باوجدان بودن، شایستگی ارتباط بیشتری با عزت نفس و اتکا به خود دارد (کاستا، مک‌کرا و دی، ۱۹۹۱)."},{"code":"C2","name":"نظم","factor":"C","interpretation":"نظم و ترتیب²: افراد دارای نمره بالا در این مقیاس تمیز، آراسته و مرتب هستند و دارای سازماندهی مناسب رفتاری می‌باشند. نمره پایین نشانگر افرادی است که قادر به سازمان دادن نیستند و خود را افرادی فاقد برنامه مشخص کوتاه مدت یا طولانی مدت می‌دانند. در انتهای بالای طیف این مقیاس، افرادی با اختلال وسواس قرار می‌گیرند."},{"code":"C3","name":"وظیفه‌شناسی","factor":"C","interpretation":"وظیفه‌شناسی³: به یک معنا باوجدان بودن، یعنی «نظارت وجدان بر کنش‌های فردی» و این جنبه C با مقیاس وظیفه‌شناسی مورد ارزیابی قرار می‌گیرد. افراد با نمرات بالا به اصول اخلاقی خود پایبند بوده و تعهدات اخلاقی‌شان را به طور دقیق انجام می‌دهند و افراد با نمرات پایین با مسایل اخلاقی آسان‌تر از دیگران برخورد می‌کنند و ممکن است تا حدی غیر مسئول و بی‌ثبات باشند."},{"code":"C4","name":"تلاش برای موفقیت","factor":"C","interpretation":"تلاش برای موفقیت⁴: افراد با نمره بالا سطح توقع بالایی دارند و تلاش زیادی برای تحقق این سطح از خود نشان می‌دهند. اینها افراد سالم و پرتلاشی هستند که اهداف مشخصی در زندگی دارند. این افراد اصطلاحاً معتاد به کار⁵ نامیده می‌شوند. افراد دارای نمره پایین بی‌حال و تنها هستند و برای موفقیت تلاش نمی‌کنند."},{"code":"C5","name":"نظم باطنی/خویشتن‌داری","factor":"C","interpretation":"خویشتن‌داری، نظم درونی: این واژه یعنی اینکه فرد بتواند یک کار را آغاز کند و با وجود سختی‌ها و مشکلات آن را به پایان برساند. نمره بالا نشان‌دهنده توانایی افراد برای تحریک خود در انجام کارها است. افراد با نمره پایین در شروع کارها تعلل کرده و به آسانی ناامید می‌شوند و کار را متوقف می‌کنند. افراد دارای نظم درونی کم، به آسانی با تکانشی‌شدن گیج و سر در گم می‌شوند. شتاب‌زدگی زیاد و نظم درونی کم، هر دو نشانگر ضعف در کنترل خویش است."},{"code":"C6","name":"انعطاف‌ناپذیری در تصمیم‌گیری","factor":"C","interpretation":"محتاط در تصمیم‌گیری¹: محتاط در تصمیم‌گیری یعنی گرایش به تفکر دقیق پیش از عمل و نبود انعطاف‌پذیری در برنامه‌ها. افراد دارای نمرات بالا با تأمل زیاد و احتیاط کار می‌کنند. افراد دارای نمره پایین بی‌تأمل بوده و اصطلاحاً عجول و دستپاچه هستند و اغلب بدون توجه به نتیجه، فکر و یا صحبت کرده و عمل می‌کنند. با دید خوش‌بینانه می‌توان گفت که افراد با نمره پایین، افراد خودجوشی بوده و می‌توانند در مواقع ضروری به سرعت تصمیم‌گیری کنند."}],"factorInterpretation":{"N":"از جمله ابعاد گسترده شخصیت، مقایسه سازگاری، ثبات عاطفی فرد، ناسازگاری و عصبی‌ت یا روان‌آزردگی است. داشتن احساسات منفی مانند ترس، غم، برانگیختگی، خشم، احساس گناه، احساس کلافگی دایمی و فراگیر، مبنای این شاخص را تشکیل می‌دهند. از آنجا که هیجان مخرب در سازگاری فرد و محیط تأثیر دارد، در زن و مردی که دارای نمره‌های بالا در این شاخص باشند، احتمال بیشتری وجود دارد که دارای باورهای غیر منطقی باشند، قدرت کمتری در کنترل تکانه‌ها¹ داشته باشند و میزان سازش ضعیف‌تری با دیگران و شرایط استرس‌زایی را نشان دهند. بیمارانی که معمولاً گرفتار حالات نوروتیک یا عصبی می‌شوند، در شاخص N نمره بیشتری می‌گیرند (آیسنگ و آیسنگ، ۱۹۷۵). با این حال شاخص N در آزمون NEO-PI-R همانند دیگر شاخص‌های این آزمون، جنبه‌های شخصیت بهنجار را می‌سنجد. افراد دارای نمره بالا در این شاخص ممکن است در خطر ابتلا به برخی از اختلالات روان‌پزشکی باشند. باید توجه داشت که نمرات N نشان‌دهنده آسیب‌شناسی روانی نیستند و از طرف دیگر باید در نظر داشت که همه مواردی که دارای تشخیص روان‌پزشکی هستند، ضرورتاً نمره بالایی در شاخص N ندارند. برای نمونه ممکن است فرد دارای شخصیت ضداجتماعی باشد ولی نمره او در N در حد بالایی نباشد. به طور کلی افرادی که نمرات پایینی در این شاخص دارند، از نظر عاطفی افراد با ثباتی به‌شمار می‌روند. این افراد معمولاً آرام، دارای خلق یکنواخت و راحت بوده و به آسانی می‌توانند بدون برآشفتگی و مشکل رفتاری با موقعیت‌های بغرنج و استرس‌زا روبه‌رو شوند.","E":"همان طور که می‌دانیم برون‌گراها افرادی اجتماعی هستند. علاوه بر آن، این گونه افراد دوستدار دیگران بوده و تمایل به شرکت در اجتماعات و مهمانی‌ها دارند. در عمل قاطع، فعال و حرف‌اف یا اهل گفتگو هستند. هیجان و تحرک را دوست دارند و به موفقیت در آینده امیدوارند. در مقابل برون‌گرایان که به روشنی قابل توصیف هستند، درون‌گرایان را نمی‌توان به آسانی تعریف کرد. در برخی جوانب درون‌گرایی را می‌توان با نبود ویژگی‌های برون‌گرایی توصیف نمود. درون‌گرایان افرادی محافظه‌کار، مستقل و تکرو هستند ولی به هیچ وجه تنبل یا کند یا دوست‌نداشتنی نیستند. درون‌گرایان معمولاً خجالت‌ی و تنها هستند. البته این مطلب به معنای آن نیست که اضطراب اجتماعی دارند. درون‌گرایان کنجکاو هستند و علاقه زیادی نیز به پژوهش دارند.","O":"مقیاس‌های گشودگی به جنبه‌ها یا محدوده‌های تجربی که فرد در برابر آنها باز است، اختصاص داده شده‌اند. افراد تجربه‌پذیر انسان‌هایی هستند که در باروری تجارب درونی و دنیای پیرامون کنجکاو بوده و زندگی آنها سرشار از تجربه است. این افراد طالب لذت بردن از نظریه‌های جدید و ارزش‌های غیر متعارف هستند و در مقایسه با افراد بسته احساسات مثبت و منفی فراوانی دارند. معمولاً این شاخص ارتباط مثبتی با هوش دارد و افراد دارای تحصیلات بالاتر در آن نمره بیشتری کسب می‌کنند. مردان و زنان دارای نمرات پایین در این شاخص کسانی هستند که در رفتار متعارف و در ظاهر محافظه‌کار به نظر می‌رسند. آنها موضوع‌های رایج را بهتر از موارد نادر می‌پسندند و پاسخ‌های هیجانی آنها نسبتاً آرام و نهفته است. افراد با نمره بالا تجربه‌پذیر، افرادی غیر متعارف، تمایل به زیر سؤال بردن منبع قدرت، علاقه‌مند به آزادی در امور اخلاقی و اجتماعی و دیدگاه‌های سیاسی هستند.","A":"شاخص موافق بودن نیز همانند برون‌گرایی بر گرایش‌های فردی تأکید دارد. فرد موافق اساساً نوع دوست است، با دیگران احساس همدردی می‌کند و مشتاق کمک به آنان است و اعتقاد دارد که دیگران نیز با او همین رابطه را دارند. در مقایسه، شخص ناموافق⁴ یا مخالف⁵ خودمحور بوده و به قصد و نیت دیگران مظنون است و بیشتر اهل رقابت است تا همکاری. به نظر می‌رسد که این شاخص، به سمت جنبه‌های مثبت اجتماعی و سلامت روانی بیشتر سوق دارد. افراد موافق محبوب‌تر از افراد مخالف هستند. در هر صورت، آمادگی برای دفاع از حق فردی اولویت دارد و داشتن ویژگی موافق بودن در صحنه نبرد و یا دادگاه، برتری و فضیلت نیست، همان طور که داشتن دیدگاه انتقادی و داشتن شک علمی می‌تواند برای یک دانشمند حسن و فضیلت باشد. هیچ‌یک از دو قطب این شاخص دارای منزلت اجتماعی برتر نیستند. همچنین، نمی‌توانیم بگوییم کدام گروه از کسانی که در قطب‌های این شاخص قرار می‌گیرند، سلامت روانی بهتری دارند. نمره پایین در این شاخص معمولاً با ویژگی‌های اختلال شخصیت خودشیفته، ضداجتماعی و پارانویید همراه است؛ در حالی که نمره بالا با اختلال شخصیت وابسته همراهی دارد (کاستا و مک‌کرا، ۱۹۹۰).","C":"یکی از موضوع‌های مهم یک نظریه شخصیت و به ویژه در نظریه روان پویایی، موضوع کنترل تکانه‌ها است. در روند تکوین و تحول فردی، بیشتر افراد می‌آموزند که چگونه کشش‌ها و نیازهای خود را اداره کنند. فرد باوجدان دارای هدف و خواست‌های قوی و از پیش تعیین شده است. برخی این شاخص را تمایل به موفقیت نامیده‌اند. در جنبه‌های مثبت این شاخص، افراد دارای نمره‌های بالا در function faNum(value, decimals=1){
  if(value===null || value===undefined || Number.isNaN(value)) return "—";
  let s = Number(value).toFixed(decimals);
  if(decimals===0) s=String(Math.round(Number(value)));
  return s.replace(/-/g,"−").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[Number(d)]).replace(/\./g,"٫");
}
function enNum(value, decimals=1){
  if(value===null || value===undefined || Number.isNaN(value)) return "—";
  return Number(value).toFixed(decimals);
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function todayISO(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function isValidAnswerValue(v){
  return v===null || (Number.isInteger(v) && v>=0 && v<=4);
}
function isValidDateString(value){
  if(value==="") return true;
  if(typeof value!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [y,m,d]=value.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}
function isValidAnswersArray(arr){

const MEMORY_STORAGE=Object.create(null);
function storageGet(key){
  try { return localStorage.getItem(key); } catch(e) { return Object.prototype.hasOwnProperty.call(MEMORY_STORAGE,key)?MEMORY_STORAGE[key]:null; }
}
function storageSet(key,value){
  try { localStorage.setItem(key,value); return true; } catch(e) { MEMORY_STORAGE[key]=String(value); return false; }
}
function storageRemove(key){
  try { localStorage.removeItem(key); } catch(e) {}
  delete MEMORY_STORAGE[key];
}
function saveState(){

    const payload={

      results:state.results,

    };
    const persisted=storageSet(STORAGE_KEY,JSON.stringify(payload));
    state.storageWarning=persisted?"":"ذخیره‌سازی دائمی مرورگر در دسترس نیست؛ اطلاعات فقط تا زمان باز بودن این صفحه در حافظه نگه‌داری می‌شود.";

    return false;
  }
}
function validateStoredPayload(x){
  if(!x || typeof x!=="object" || Array.isArray(x)) return false;
  const modern=x.version===1 && x.schemaVersion===2
    && x.datasetId===DATASET_ID
    && x.sourceFingerprint===EXPECTED_CORE_FINGERPRINT;
  if(!modern) return false;
  if(!isValidAnswersArray(x.answers)) return false;
  if(!isValidPhase(x.phase)) return false;
  if(x.current!==undefined && (!Number.isInteger(Number(x.current)) || Number(x.current)<1 || Number(x.current)>240)) return false;
  if(!isValidExaminee(x.examinee)) return false;
  if(x.chartMode!==undefined && x.chartMode!=="t" && x.chartMode!=="raw") return false;
  return true;
}

function loadState(){
  try {
    const raw=storageGet(STORAGE_KEY);

    }
    state.phase=isValidPhase(x.phase)?x.phase:"questions";
    state.current=sanitizeCurrent(x.current);
    state.answers=x.answers.slice();
    state.examinee={...x.examinee};

    return true;

function scoreItem(itemNo, optionIndex){
  if(!Number.isInteger(itemNo) || itemNo<1 || itemNo>240) return null;
  if(!Number.isInteger(optionIndex) || optionIndex<0 || optionIndex>4) return null;
  return DATA.questions[itemNo-1].scores[optionIndex];
}
function computeScores(answers){
  const facets={};
  FACET_ORDER.forEach(code=>facets[code]=0);
  if(!isValidAnswersArray(answers)) return {facets:null,factors:null};
  for(let i=1;i<=240;i++){
    const a=answers[i-1];
    if(a===null) continue;
    const q=DATA.questions[i-1];
    const score=q.scores[a];
    if(!Number.isInteger(score) || score<0 || score>4) throw new Error("Invalid scoring data at item "+i);
    if(!Object.prototype.hasOwnProperty.call(facets,q.facet)) throw new Error("Invalid facet mapping at item "+i);
    facets[q.facet]+=score;
  }
  const factors={};
  FACTOR_ORDER.forEach(f=>{
    const factor=DATA.factors.find(x=>x.code===f);
    if(!factor) throw new Error("Invalid factor mapping: "+f);
    factors[f]=factor.facets.reduce((sum,c)=>sum+facets[c],0);
  });
  return {facets,factors};
}
function normFor(code,gender){
  const source=(code.length===1?DATA.norms.factors:DATA.norms.facets)[code];
  if(!source || (gender!=="male" && gender!=="female")) return null;
  return gender==="male" ? {mean:source.men_mean,sd:source.men_sd} : {mean:source.women_mean,sd:source.women_sd};
}
function tScore(raw,code,gender){
  const n=normFor(code,gender);
  if(!n || !Number.isFinite(raw) || !Number.isFinite(n.mean) || !Number.isFinite(n.sd) || n.sd===0) return null;
  return 50 + 10*((raw-n.mean)/n.sd);
}
function tCategory(t){
  if(!Number.isFinite(t)) return {key:"none",label:"—"};
  if(t<35) return {key:"very-low",label:"بسیار پایین"};
  if(t<45) return {key:"low",label:"پایین"};
  if(t<56) return {key:"average",label:"متوسط"};
  if(t<66) return {key:"high",label:"بالا"};
  return {key:"very-high",label:"بسیار بالا"};
}
function categoryBadge(t){
  const c=tCategory(t);
  return `<span class="scoreBadge ${c.key}">${esc(c.label)}</span>`;
}
function validateResponses(answers){
  const structurallyValid=isValidAnswersArray(answers);
  const arr=structurallyValid?answers:[];
  const answered=arr.filter(v=>v!==null).length;
  const unanswered=arr.length-answered;
  const neutralCount=arr.filter(v=>v===2).length;
  const warnings=[];
  if(!structurallyValid){
    return {answeredCount:answered,unansweredCount:unanswered,neutralCount,warnings,hardInvalid:true,valid:false};
  }
  if(neutralCount>=97){
    warnings.push(`تعداد پاسخ‌های «نظری ندارم» ${faNum(neutralCount,0)} مورد است؛ چون بیش از ۴۰ درصد کل آزمون است، اعتبار و قابلیت تفسیر نتایج ممکن است با ابهام همراه باشد و بهتر است نتایج با احتیاط تفسیر شوند.`);
  }
  return {answeredCount:answered,unansweredCount:unanswered,neutralCount,warnings,hardInvalid:false,valid:unanswered===0};
}

function calculateResults(){
  const validity=validateResponses(state.answers);
  const result={computedAt:new Date().toISOString(),validity,gender:state.examinee.gender,examinee:{...state.examinee},scores:null,factorRows:[],facetRows:[]};
  if(answeredCount()!==240 || !state.examinee.gender) return result;
  const scores=computeScores(state.answers);
  result.scores=scores;
  result.factorRows=FACTOR_ORDER.map(code=>{
    const raw=scores.factors[code],n=normFor(code,state.examinee.gender),t=tScore(raw,code,state.examinee.gender);
    return {code,name:factor_names[code]||DATA.factors.find(x=>x.code===code).name,raw,n,t,category:tCategory(t)};
  });
  result.facetRows=FACET_ORDER.map(code=>{
    const raw=scores.facets[code],n=normFor(code,state.examinee.gender),t=tScore(raw,code,state.examinee.gender);
    return {code,name:facet_names[code]||DATA.facets.find(x=>x.code===code).name,raw,n,t,category:tCategory(t)};
  });
  return result;
}

function selectAnswer(idx){

  state.answers[questionNo-1]=idx;
  document.querySelectorAll('.option').forEach(el=>el.classList.add('answerLocked'));
  document.querySelectorAll('.option').forEach(el=>el.classList.remove('justSelected'));
  clicked.classList.add('selected','justSelected');
  saveState();
  clearTimeout(answerTransitionTimer);
  answerTransitionTimer=setTimeout(()=>{
    if(state.current!==questionNo) return;
    if(questionNo<240){
      state.current=questionNo+1;
      saveState();
      renderQuestion();

      renderQuestion();
      window.scrollTo({top:0,behavior:"smooth"});
      requestAnimationFrame(()=>document.querySelector('[data-action="finish"]')?.focus());
    }
  },260);
}

}

  });

    opt.addEventListener("keydown",e=>{

        e.preventDefault();

        if(input && !input.disabled) input.click();

function bindGlobal(){
  document.querySelectorAll("[data-action]").forEach(btn=>{
    if(btn.dataset.bound==="1") return;

    const a=btn.dataset.action;
    if(a==="home") btn.addEventListener("click",()=>{state.phase="start";saveState();render()});
    if(a==="clear") btn.addEventListener("click",clearStorageConfirmed);
    if(a==="resume") btn.addEventListener("click",resume);
    if(a==="print"||a==="pdf") btn.addEventListener("click",()=>window.print());
    if(a==="export") btn.addEventListener("click",exportJSON);
    if(a==="newAgain") btn.addEventListener("click",clearStorageConfirmed);

  document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{state.chartMode=btn.dataset.mode;saveState();render()}));
  document.getElementById("startForm")?.addEventListener("submit",e=>{e.preventDefault();startNew()});

async function importJSON(ev){
  const file=ev.target.files?.[0];
  if(!file) return;
  try {
    const txt=await file.text();
    const x=JSON.parse(txt);
    if(!validateStoredPayload(x)) throw new Error("bad");
    if(!confirm("این پشتیبان جایگزین اطلاعات آزمون فعلی شود؟")) return;
    state.phase=isValidPhase(x.phase)?x.phase:"questions";
    state.current=sanitizeCurrent(x.current);
    state.answers=x.answers.slice();
    state.examinee={...x.examinee};
    state.chartMode=x.chartMode==="raw"?"raw":"t";
    state.results=null;
    if(state.phase==="results" && answeredCount()===240) state.results=calculateResults();
    saveState();
    render();
    showToast("پشتیبان با موفقیت بازیابی شد.","success");
  } catch(e) {
    showToast("فایل پشتیبان معتبر نیست.","danger");
  } finally {
    ev.target.value="";
  }
}

function drawBarChart(canvas,rows,mode){
  if(!canvas||!Array.isArray(rows)||rows.length===0)return;
  const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  const pad={top:35,right:35,bottom:85,left:65},innerW=w-pad.left-pad.right,innerH=h-pad.top-pad.bottom;
  const values=rows.map(row=>mode==="t"?row.t:row.raw).filter(v=>Number.isFinite(v)); if(!values.length)return;
  let axisMin,axisMax;
  if(mode==="t"){
    const obsMin=Math.min(...values),obsMax=Math.max(...values);
    axisMin=obsMin<0?Math.floor(obsMin/10)*10:0;
    axisMax=Math.ceil((obsMax+Math.max(5,Math.abs(obsMax-axisMin)*0.12))/10)*10;
    if(axisMax<=axisMin)axisMax=axisMin+10;
  }else{axisMin=0;axisMax=rows.length===5?192:32;}
  const span=axisMax-axisMin,yFor=v=>pad.top+innerH-((v-axisMin)/span)*innerH,zeroY=axisMin<=0&&axisMax>=0?yFor(0):null,tickCount=5,tickStep=span/tickCount;
  ctx.strokeStyle="#dce3ee";ctx.lineWidth=1;ctx.fillStyle="#667085";ctx.font="20px Tahoma";ctx.textAlign="right";
  for(let i=0;i<=tickCount;i++){const v=axisMin+tickStep*i,y=yFor(v);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+innerW,y);ctx.stroke();ctx.fillText(faNum(v,0),pad.left-10,y+6);}
  if(zeroY!==null){ctx.strokeStyle="#aeb9c8";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pad.left,zeroY);ctx.lineTo(pad.left+innerW,zeroY);ctx.stroke();}
  const gap=rows.length===5?60:28,barW=Math.max(20,(innerW-gap*(rows.length+1))/rows.length);
  rows.forEach((row,i)=>{const val=mode==="t"?row.t:row.raw;if(!Number.isFinite(val))return;const x=pad.left+gap+i*(barW+gap),valY=yFor(val),baseY=zeroY!==null?zeroY:yFor(axisMin),top=Math.min(valY,baseY),height=Math.max(2,Math.abs(valY-baseY));ctx.fillStyle="#2457c5";ctx.fillRect(x,top,barW,height);ctx.fillStyle="#162033";ctx.font="bold 21px Tahoma";ctx.textAlign="center";const labelY=val>=0?Math.max(23,top-7):Math.min(h-45,top+height+22);ctx.fillText(mode==="t"?faNum(val,1):faNum(val,0),x+barW/2,labelY);ctx.fillStyle="#475467";ctx.font="18px Tahoma";wrapCanvasText(ctx,row.name,x+barW/2,h-pad.bottom+22,barW+20,25);});
  ctx.fillStyle="#667085";ctx.font="18px Tahoma";ctx.textAlign="left";ctx.fillText(mode==="t"?"نمره T":"نمره خام",w-pad.right,h-20);
}

function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
  const words=String(text).split(/\s+/); let line="", lines=[];
  for(const word of words) {
    const test=line?line+" "+word:word;
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=word} else line=test;
  }
  if(line) lines.push(line);
  lines.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
}
function stableStringify(value){
  if(value===null||typeof value!=="object")return JSON.stringify(value);
  if(Array.isArray(value))return "["+value.map(stableStringify).join(",")+"]";
  return "{"+Object.keys(value).sort().map(k=>JSON.stringify(k)+":"+stableStringify(value[k])).join(",")+"}";
}
function fnv1a64(value){
  let h=0xcbf29ce484222325n;
  for(const b of new TextEncoder().encode(String(value))){h^=BigInt(b);h=BigInt.asUintN(64,h*0x100000001b3n);}
  return h.toString(16).padStart(16,"0");
}
function runSelfTests(){
  const results=[];
  function assert(name,cond,detail=""){
    const ok=!!cond;
    results.push({name,ok,detail:ok?"":String(detail||"")});
    if(!ok) console.error("SELF TEST FAIL:",name,detail||"");
  }
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  function keyMismatches(){
    const out=[];
    for(let i=0;i<240;i++) if(!eq(DATA.questions[i].scores,EXPECTED_KEY_REFERENCE[i])){
      out.push({item:i+1,expected:EXPECTED_KEY_REFERENCE[i],actual:DATA.questions[i].scores});
    }
    return out;
  }

  assert("۲۴۰ سؤال دقیقاً",DATA.questions.length===240&&new Set(DATA.questions.map(q=>q.id)).size===240&&DATA.questions.every((q,i)=>q.id===i+1));
  assert("۳۰ خرده‌مقیاس",DATA.facets.length===30);
  assert("هر خرده‌مقیاس دقیقاً ۸ سؤال و نگاشت مستقل",EXPECTED_FACET_REFERENCE.every((ids,i)=>ids.length===8&&eq(DATA.questions.filter(q=>q.facet===FACET_ORDER[i]).map(q=>q.id),ids)));
  assert("۵ عامل و ۶ خرده‌مقیاس مستقل",DATA.factors.length===5&&DATA.factors.every(f=>Array.isArray(f.facets)&&f.facets.length===6&&eq(f.facets,EXPECTED_FACTOR_REFERENCE[f.code])));
  assert("مقیاس پاسخ‌دهی مستقل",eq(DATA.meta.responseScale,EXPECTED_RESPONSE_SCALE));
  assert("همه کلیدها از نوع معتبر هستند",DATA.questions.every(q=>Array.isArray(q.scores)&&q.scores.length===5&&q.scores.every(v=>Number.isInteger(v)&&v>=0&&v<=4)&&q.scores[0]+q.scores[4]===4));

  const km=keyMismatches();
  assert("کلید هر ۲۴۰ سؤال مطابق مرجع مستقل",km.length===0,km.length?JSON.stringify(km.slice(0,20)):"");
  const scoreMismatches=[];
  for(let i=1;i<=240;i++) for(let a=0;a<5;a++){
    const expected=EXPECTED_KEY_REFERENCE[i-1][a],actual=scoreItem(i,a);
    if(actual!==expected) scoreMismatches.push({item:i,response:a,expected,actual});
  }
  assert("امتیازدهی تک‌تک ۱۲۰۰ حالت پاسخ",scoreMismatches.length===0,scoreMismatches.length?JSON.stringify(scoreMismatches.slice(0,20)):"");

  assert("اثر انگشت کلید مستقل",fnv1a64(DATA.questions.map(q=>`${q.id}:${q.scores.join(",")}`).join("|"))===EXPECTED_KEY_FINGERPRINT);
  assert("اثر انگشت نگاشت facet مستقل",fnv1a64(FACET_ORDER.map(c=>`${c}:${DATA.questions.filter(q=>q.facet===c).map(q=>q.id).join(",")}`).join("|"))===EXPECTED_FACET_FINGERPRINT);
  assert("اثر انگشت هنجارها مستقل",fnv1a64(stableStringify({factors:DATA.norms.factors,facets:DATA.norms.facets}))===EXPECTED_NORM_FINGERPRINT);
  assert("اثر انگشت هسته داده مستقل",fnv1a64(stableStringify({questions:DATA.questions,factors:DATA.factors,facets:DATA.facets}))===EXPECTED_CORE_FINGERPRINT);

  const normFactorsOk=Object.keys(DATA.norms.factors).length===5&&FACTOR_ORDER.every(f=>{
    const n=DATA.norms.factors[f];
    return n&&["men_mean","men_sd","women_mean","women_sd"].every(k=>Number.isFinite(n[k])&&n[k]>0);
  });
  const normFacetsOk=Object.keys(DATA.norms.facets).length===30&&FACET_ORDER.every(c=>{
    const n=DATA.norms.facets[c];
    return n&&["men_mean","men_sd","women_mean","women_sd"].every(k=>Number.isFinite(n[k])&&n[k]>0);
  });
  assert("۳۵ مجموعه هنجاری و مقادیر عددی معتبر",normFactorsOk&&normFacetsOk);

  for(const response of [0,1,2,3,4]){
    const got=computeScores(Array(240).fill(response));
    assert(`محاسبه مستقل همه پاسخ‌ها=${response}`,eq(got.factors,EXPECTED_UNIFORM_FACTOR_SCORES[response]),JSON.stringify(got.factors));
  }
  for(const [code,revCount] of Object.entries(EXPECTED_FACET_REVERSE_COUNTS)){
    const raw0=computeScores(Array(240).fill(0)).facets[code];
    const raw2=computeScores(Array(240).fill(2)).facets[code];
    const raw4=computeScores(Array(240).fill(4)).facets[code];
    assert(`خرده‌مقیاس ${code} برای پاسخ‌های حدی و خنثی`,raw0===revCount*4&&raw2===16&&raw4===(8-revCount)*4,
      `expected=(${revCount*4},16,${(8-revCount)*4}), actual=(${raw0},${raw2},${raw4})`);
  }

  assert("T=N مردان در میانگین=۵۰",Math.abs(tScore(96.5,"N","male")-50)<1e-12);
  assert("T=N1 مردان در میانگین=۵۰",Math.abs(tScore(15.8,"N1","male")-50)<1e-12);
  assert("T=N مردان X=۱۲۰",Math.abs(tScore(120,"N","male")-61.24401913875598)<1e-9);
  assert("T=N زنان در میانگین=۵۰",Math.abs(tScore(99.9,"N","female")-50)<1e-12);
  assert("T=N1 زنان در میانگین=۵۰",Math.abs(tScore(17.4,"N1","female")-50)<1e-12);
  assert("T=N1 زنان X=۲۲",Math.abs(tScore(22,"N1","female")-58.84615384615385)<1e-12);
  assert("داده یا جنسیت نامعتبر T تولید نمی‌کند",tScore(10,"N","unknown")===null);

  assert("مرز ۳۵ در پایین",tCategory(35).label==="پایین");
  assert("مرز ۴۵ در متوسط",tCategory(45).label==="متوسط");
  assert("مرز ۵۶ در بالا",tCategory(56).label==="بالا");
  assert("مرز ۶۶ در بسیار بالا",tCategory(66).label==="بسیار بالا");
  assert("۳۴٫۹۹ بسیار پایین",tCategory(34.99).label==="بسیار پایین");
  assert("۴۴٫۹۹۹ پایین",tCategory(44.999).label==="پایین");
  assert("۵۵٫۹۹۹ متوسط",tCategory(55.999).label==="متوسط");
  assert("۶۵٫۹۹۹ بالا",tCategory(65.999).label==="بالا");

  const complete=Array(240).fill(2),partial=complete.slice(),invalid=complete.slice();
  partial[239]=null; invalid[0]=5;
  const vr=validateResponses(complete),vp=validateResponses(partial),vi=validateResponses(invalid);
  assert("اعتبارسنجی پاسخ کامل",vr.valid===true&&vr.hardInvalid===false&&vr.answeredCount===240&&vr.unansweredCount===0);
  assert("اعتبارسنجی پاسخ ناقص",vp.valid===false&&vp.unansweredCount===1);
  assert("اعتبارسنجی مقدار نامعتبر",vi.valid===false&&vi.hardInvalid===true);

  state.answers=partial; state.examinee={name:"",gender:"male",date:todayISO()};
  const partialResult=calculateResults();
  assert("نتیجه ناقص هرگز محاسبه نمی‌شود",partialResult.scores===null&&partialResult.factorRows.length===0&&partialResult.facetRows.length===0);

  state.answers=complete; state.examinee={name:"",gender:"male",date:todayISO()};
  const rrMale=calculateResults();
  state.examinee={name:"",gender:"female",date:todayISO()};
  const rrFemale=calculateResults();
  assert("محاسبه نتیجه مردان",rrMale.scores?.factors?.N===96&&rrMale.factorRows.length===5&&rrMale.facetRows.length===30&&rrMale.factorRows.every(x=>Number.isFinite(x.t)));
  assert("محاسبه نتیجه زنان",rrFemale.scores?.factors?.N===96&&rrFemale.factorRows.length===5&&rrFemale.facetRows.length===30&&rrFemale.factorRows.every(x=>Number.isFinite(x.t)));

  const validPayload={version:1,schemaVersion:2,datasetId:DATASET_ID,sourceFingerprint:EXPECTED_CORE_FINGERPRINT,phase:"start",current:1,answers:Array(240).fill(null),examinee:{name:"",gender:"",date:todayISO()},chartMode:"t"};
  const badLegacy={...validPayload}; delete badLegacy.schemaVersion;
  const badFingerprint={...validPayload,sourceFingerprint:"0000000000000000"};
  const badPhase={...validPayload,phase:"broken"};
  assert("JSON معتبر با fingerprint صحیح پذیرفته می‌شود",validateStoredPayload(validPayload));
  assert("JSON قدیمی بدون schemaVersion رد می‌شود",!validateStoredPayload(badLegacy));
  assert("JSON با fingerprint اشتباه رد می‌شود",!validateStoredPayload(badFingerprint));
  assert("JSON با phase نامعتبر رد می‌شود",!validateStoredPayload(badPhase));

  const original192=DATA.questions[191].scores.slice();
  DATA.questions[191].scores=[0,0,0,0,0];
  const mutationDetected=keyMismatches().some(x=>x.item===192);
  DATA.questions[191].scores=original192;
  assert("mutation تغییر کلید سؤال ۱۹۲ را تشخیص می‌دهد",mutationDetected);
  assert("کلید ۱۹۲ پس از mutation صحیح باقی می‌ماند",eq(DATA.questions[191].scores,EXPECTED_KEY_REFERENCE[191]));

  state.answers=Array(240).fill(null);
  state.examinee={name:"",gender:"",date:todayISO()};
  window.__NEO_SELF_TESTS__=results;
  return results.every(x=>x.ok);
}
document.addEventListener("DOMContentLoaded",()=>{
  const ok=runSelfTests();
  loadState();
  if(!state.examinee.date) state.examinee.date=todayISO();
  if(!ok) state.startupNotice=state.startupNotice||"خطای کنترل داخلی داده یا نمره‌گذاری شناسایی شد. برای جلوگیری از ارائه نتیجه نادرست، قبل از اجرای آزمون فایل را بررسی کنید.";
  render();
});
</script>
