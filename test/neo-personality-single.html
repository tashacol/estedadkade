افراد ممکن است به طور مداوم به خودکشی یا آسیب رساندن به خود فکر کنند و ممکن است در برخی مواقع اقداماتی در این زمینه انجام دهند.\nناتوانی در انجام فعالیت‌های روزمره: این افراد به سختی می‌توانند از خانه بیرون بروند یا وظایف روزانه خود را انجام دهند.\nاحساس بی‌ارزشی و گناه: احساس گناه و بی‌ارزشی شدیدی که ممکن است به سطحی برسد که فرد خود را به طور کامل از نظر اخلاقی یا اجتماعی ناتوان بداند.\nاختلالات فیزیکی شدید: افراد با افسردگی شدید ممکن است از اختلالات شدید در خواب، اشتها و انرژی رنج ببرند. ممکن است دچار کاهش وزن یا افزایش وزن شدید شوند.\nاختلالات شناختی: تمرکز ضعیف، کاهش حافظه، و تصمیم‌گیری دشوار از علائم رایج افسردگی شدید است.","traits":"کاهش انگیزه و احساس نا امیدی و تمرکز پایین","challenges":"خود محوری، گوشه گیری و احساس بی ارزشی"},{"name":"حساسیت به خویشتن","level":"پایین","desc":"افرادی که در سطح کم کمرویی قرار دارند، ممکن است در برخی شرایط اجتماعی احساس ناراحتی یا اضطراب داشته باشند، اما این احساسات به طور قابل توجهی بر زندگی روزمره آنها تأثیر نمی‌گذارند. این افراد معمولاً قادرند در موقعیت‌های اجتماعی حضور داشته باشند و تعامل کنند، اما ممکن است در شرایط خاص مانند ملاقات با افراد جدید یا در جمع‌های بزرگ احساس کمی ناراحتی کنند.","traits_short":"احساس کمی از اضطراب اجتماعی: این افراد ممکن است در موقعیت‌های خاص احساس نگرانی کنند، اما این نگرانی‌ها معمولاً موقتی و قابل مدیریت هستند.\nتوانایی برقراری ارتباط: این افراد قادر به برقراری ارتباط و مشارکت در فعالیت‌های اجتماعی هستند، هرچند که ممکن است احساس آرامش نکنند.\nعدم تأثیرگذاری بر عملکرد روزمره: کمرویی در این سطح تأثیر قابل توجهی بر زندگی اجتماعی یا حرفه‌ای فرد ندارد.","traits":"اعتماد به نفس اجتماعی، بهره‌وری گروهی، سازگاری","challenges":"نادیده‌گیری ساختارها، برخورد سطحی با روابط"},{"name":"حساسیت به خویشتن","level":"متوسط","desc":"افرادی که در سطح متوسط کمرویی قرار دارند، معمولاً در موقعیت‌های اجتماعی احساس اضطراب و نگرانی زیادی می‌کنند. این افراد ممکن است از موقعیت‌های اجتماعی اجتناب کنند یا در آنها دچار احساساتی مانند شرمندگی، خجالت یا ترس از قضاوت‌های منفی شوند. این احساسات ممکن است در برخی مواقع عملکرد آنها را تحت تأثیر قرار دهد.","traits_short":"اضطراب اجتماعی بیشتر: این افراد در موقعیت‌های اجتماعی معمولاً اضطراب و نگرانی بیشتری دارند و ممکن است از آشنا شدن با افراد جدید یا صحبت در جمع‌های بزرگ اجتناب کنند.\nخودآگاهی بیش از حد: ممکن است این افراد به شدت خود را زیر نظر دیگران ببینند و هر حرکتی که می‌کنند را تحلیل کنند.\nتأثیر منفی بر روابط اجتماعی: کمرویی در این سطح ممکن است منجر به کاهش روابط اجتماعی یا ایجاد مشکلات در روابط دوستانه و حرفه‌ای شود.\nاجتناب از موقعیت‌های اجتماعی: این افراد به دلیل ترس از ارزیابی منفی، ممکن است از موقعیت‌های اجتماعی خاص یا چالش‌های اجتماعی اجتناب کنند.","traits":"تعاملات محدود، پذیرش تدریجی، احتیاط در روابط","challenges":"تردید در مشارکت، حداقل‌سازی تماس‌ها"},{"name":"حساسیت به خویشتن","level":"بالا","desc":"افرادی که کمرویی شدید دارند، معمولاً در بیشتر موقعیت‌های اجتماعی دچار اضطراب و ناراحتی می‌شوند. این افراد ممکن است از شرکت در بسیاری از فعالیت‌های اجتماعی یا حتی از انجام فعالیت‌های روزمره مانند خرید یا تماس تلفنی اجتناب کنند. کمرویی در این سطح می‌تواند تأثیرات منفی زیادی بر کیفیت زندگی فرد داشته باشد.","traits_short":"اضطراب شدید در موقعیت‌های اجتماعی: این افراد اغلب احساس می‌کنند که در معرض ارزیابی منفی از سوی دیگران قرار دارند و از تعاملات اجتماعی به شدت اجتناب می‌کنند.\nشرمندگی و ترس از قضاوت: احساس شرمندگی و ترس از قضاوت‌های منفی دیگران می‌تواند بر تصمیم‌گیری‌ها و رفتارهای این افراد تأثیر بگذارد.\nدوری از موقعیت‌های جدید: افراد با کمرویی شدید ممکن است از مواجهه با شرایط جدید یا تعامل با افراد جدید خودداری کنند.\nتأثیر بر روابط و حرفه: کمرویی در این سطح می‌تواند باعث انزوای اجتماعی و مشکلات در حفظ روابط دوستانه و حرفه‌ای شود. در برخی موارد، این افراد ممکن است از پیشرفت شغلی یا اجتماعی خود جلوگیری کنند.","traits":"اجتناب از تعامل مستقیم، اضطراب اجتماعی، خودآگاهی","challenges":"کاهش کیفیت تعاملات، گوشه‌گیری اجتماعی"},{"name":"تکانش وری","level":"پایین","desc":"افرادی که در سطح کم تکانشوری قرار دارند، ممکن است در برخی موقعیت‌ها از رفتارهای تکانشی نشان دهند، اما این رفتارها به ندرت رخ می‌دهند و معمولاً تأثیر منفی بر زندگی فرد ندارند. این افراد معمولاً قادرند که هیجان‌ها و تمایلات خود را کنترل کنند و قبل از اقدام، کمی تأمل کنند.","traits_short":"توانایی کنترل تمایلات: افراد در این سطح قادرند که بیشتر مواقع تمایلات و هیجان‌های خود را تحت کنترل داشته باشند.\nدقت در تصمیم‌گیری: قبل از انجام کارها، آن‌ها معمولاً به پیامدهای آن‌ها فکر می‌کنند و تصمیمات خود را با دقت بیشتری اتخاذ می‌کنند.\nکمتر به تحریکات فوری واکنش نشان می‌دهند: این افراد به طور کلی کمتر تحت تأثیر شرایط و محرک‌های فوری قرار می‌گیرند.","traits":"تصمیم‌گیری متفکرانه و دقیق، پرهیز از ریسک","challenges":"تعاملات کندتر در موقعیت‌های جدید"},{"name":"تکانش وری","level":"متوسط","desc":"افرادی که در سطح متوسط تکانشوری قرار دارند، تمایلات و رفتارهای تکانشی بیشتری از خود نشان می‌دهند و این رفتارها ممکن است گاهی بر زندگی روزمره آن‌ها تأثیر بگذارد. این افراد ممکن است در موقعیت‌های استرس‌زا یا هیجانی بیشتر دست به انتخاب‌های عجولانه بزنند و پیامدهای آن‌ها را به درستی در نظر نگیرند.","traits_short":"تکانشوری در شرایط هیجانی: افراد در این سطح معمولاً زمانی که احساساتی مانند اضطراب، خشم، یا شادی شدید دارند، ممکن است تصمیمات عجولانه بگیرند.\nبی‌صبری: این افراد معمولاً از انجام کارها به صورت تدریجی و با تأمل صبر ندارند و تمایل دارند به سرعت به نتایج برسند.\nعدم بررسی کامل پیامدها: پیش از اقدام، آن‌ها معمولاً به پیامدهای بلندمدت تصمیمات خود فکر نمی‌کنند و بیشتر بر انگیزه‌های لحظه‌ای تکیه می‌کنند.\nاحساس فوریت برای دریافت پاداش: افراد تکانشی در این سطح به دنبال پاداش فوری هستند و ممکن است برای به دست آوردن آن اقداماتی عجولانه انجام دهند.","traits":"تصمیم‌گیری‌های ترکیبی، تنظیم اولویت‌ها","challenges":"مقاومت در برابر بازخورد، واکنش سریع"},{"name":"تکانش وری","level":"بالا","desc":"افرادی که در سطح زیاد تکانشوری قرار دارند، رفتارهای تکانشی آن‌ها به شدت برجسته است و این ویژگی می‌تواند به طور جدی بر زندگی فرد تأثیر بگذارد. این افراد معمولاً بدون فکر کردن به پیامدهای طولانی‌مدت، تصمیمات عجولانه می‌گیرند و این رفتارها ممکن است مشکلات جدی در روابط، حرفه و سلامت روانی آن‌ها ایجاد کند.","traits_short":"تصمیمات سریع و بی‌دقت: این افراد معمولاً بدون بررسی جوانب مختلف تصمیمات خود، به سرعت اقدام می‌کنند و اغلب پیامدهای آن‌ها را در نظر نمی‌گیرند.\nافزایش رفتارهای پرخطر: تکانشوری زیاد ممکن است با رفتارهای پرخطر مانند خرید‌های غیرضروری، مصرف مواد مخدر، رانندگی پرخطر، یا روابط ناامن همراه باشد.\nکمبود تأمل: این افراد تمایلی به توقف و تفکر در مورد انتخاب‌های خود ندارند و به طور مداوم در معرض مشکلات ناشی از این رفتارها هستند.\nاختلال در روابط اجتماعی و حرفه‌ای: تکانشوری شدید می‌تواند موجب مشکلات در روابط اجتماعی و شغلی شود. این افراد ممکن است به راحتی روابط خود را به خطر بیندازند یا فرصت‌های شغلی را از دست بدهند.","traits":"تصمیم‌گیری سریع و بی‌پروا، کمبود دقت","challenges":"اختلافات تیمی، واکنش‌های هیجانی"},{"name":"آسیب پذیری","level":"پایین","desc":"افرادی که در این سطح قرار دارند، به ندرت در موقعیت‌های استرس‌زا از خود واکنش‌های شدید روانی یا جسمانی نشان می‌دهند. این افراد معمولاً مهارت‌های مقابله‌ای خوبی دارند و می‌توانند با تجزیه‌وتحلیل موقعیت‌ها به روش منطقی، اضطراب خود را مدیریت کنند.","traits_short":"مقابله خوب با استرس: این افراد در مواجهه با موقعیت‌های استرس‌زا آرامش خود را حفظ می‌کنند و به جای واکنش‌های هیجانی، از روش‌های منطقی استفاده می‌کنند.\nکنترل هیجانات: توانایی بالایی در مدیریت اضطراب، خشم یا نگرانی خود دارند.\nحفظ عملکرد: حتی در مواجهه با استرس، این افراد عموماً عملکرد خود را حفظ می‌کنند و تحت تأثیر منفی قرار نمی‌گیرند.\nحمایت اجتماعی مناسب: معمولاً از حمایت‌های اجتماعی برخوردارند که به کاهش استرس کمک می‌کند.","traits":"پایداری تحت فشار، ثبات خلقی","challenges":"واکنش کند به تغییرات، کمک به همکاران"},{"name":"آسیب پذیری","level":"متوسط","desc":"افرادی در این سطح اغلب واکنش‌های متوسطی نسبت به عوامل استرس‌زا دارند. این افراد ممکن است در موقعیت‌های چالش‌زا کمی سختی بکشند و در صورت وجود استرس طولانی‌مدت، تحت فشار روانی بیشتری قرار گیرند. اگرچه ممکن است دارای برخی مهارت‌های مقابله‌ای باشند، اما این مهارت‌ها همیشه کافی نیستند.","traits_short":"اضطراب در موقعیت‌های چالش‌زا: این افراد ممکن است در مواجهه با چالش‌ها احساس اضطراب یا نگرانی مختصری داشته باشند.\nنیاز به زمان برای تطبیق: ممکن است زمان بیشتری نیاز داشته باشند تا خود را با موقعیت‌های دشوار وفق دهند.\nافت کیفیت عملکرد در اوج استرس: وقتی تحت فشار زیاد قرار می‌گیرند، ممکن است عملکرد آن‌ها متأثر شود، اما معمولاً می‌توانند به حالت عادی بازگردند.\nترکیبی از تاب‌آوری و حساسیت: در برخی موقعیت‌ها حساس هستند و در برخی دیگر مهارت‌های مقابله‌ای مناسبی از خود نشان می‌دهند.","traits":"توانایی مدیریت نسبی، واکنش‌های کنترل‌شده","challenges":"نیاز به حمایت متناوب، تغییرات اجتماعی"},{"name":"آسیب پذیری","level":"بالا","desc":"افرادی که در سطح بالایی از آسیب‌پذیری از استرس قرار دارند، بسیار حساس به محرک‌های استرس‌زا هستند و معمولاً در مواجهه با چالش‌ها دچار اختلال در عملکردهای خود می‌شوند. این افراد ممکن است از فشار روانی مزمن رنج ببرند و گاهی حتی در موقعیت‌هایی که استرس خفیف است، واکنش‌های شدید نشان دهند.","traits_short":"واکنش‌های شدید هیجانی: این افراد ممکن است با کوچک‌ترین چالش‌ها احساس اضطراب، افسردگی یا خشم کنند.\nافت شدید عملکرد: در شرایط استرس طولانی‌مدت، عملکرد آن‌ها به شدت آسیب می‌بیند و انگیزه یا تمرکز خود را از دست می‌دهند.\nتمایل به اجتناب از چالش‌ها: به دلیل ترس از افزایش استرس، این افراد ممکن است از موقعیت‌های چالش‌برانگیز دوری کنند.\nاختلالات جسمانی مرتبط با استرس: احتمال دارد این افراد دچار مشکلات جسمی مانند سردردهای تنشی، مشکلات گوارشی یا دردهای عضلانی شوند.\nعزت نفس پایین: اغلب احساس می‌کنند قادر به مقابله با مشکلات نیستند، که این باور می‌تواند چرخه‌ای از استرس و شکست را ایجاد کند.","traits":"پاسخ سریع به استرس، احساسات ناپایدار","challenges":"اختلافات ارتباطی، وابستگی عاطفی"},{"name":"اعتماد","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً به دیگران یا سیستم‌ها اعتماد کمی دارند. این افراد ممکن است به دلیل تجربیات منفی گذشته یا عدم اطمینان به توانایی‌های دیگران، در برقراری روابط یا تعاملات اجتماعی دچار مشکل شوند.","traits_short":"شک و تردید: این افراد معمولاً به دیگران با شک و تردید نگاه می‌کنند و به سختی به کسی اعتماد می‌کنند.\nخودمحوری: تمایل دارند بیشتر به خود و توانایی‌های خود تکیه کنند تا به دیگران.\nمشکلات در روابط: ممکن است در برقراری و حفظ روابط نزدیک دچار مشکل شوند.\nترس از خیانت: این افراد معمولاً نگران خیانت یا سوءاستفاده از اعتمادشان هستند.","traits":"عدم اعتماد به دیگران، نگرانی از خیانت","challenges":"اختلافات مداوم، عدم همکاری تیمی"},{"name":"اعتماد","level":"متوسط","desc":"افرادی در این سطح معمولاً به دیگران اعتماد دارند، اما این اعتماد مشروط به شرایط و تجربیات خاص است. این افراد ممکن است در برخی موقعیت‌ها به راحتی اعتماد کنند، اما در موقعیت‌های دیگر محتاط‌تر باشند.","traits_short":"اعتماد مشروط: اعتماد آن‌ها به دیگران بستگی به شرایط و تجربیات قبلی دارد.\nتعاملات متعادل: معمولاً در تعاملات اجتماعی خود تعادل برقرار می‌کنند و به دیگران فرصت می‌دهند.\nآگاهی از خطرات: این افراد به خطرات احتمالی آگاه هستند و سعی می‌کنند با احتیاط عمل کنند.\nانعطاف‌پذیری: در صورت بروز مشکلات، قادر به بازسازی اعتماد هستند.","traits":"اعتماد مبتنی بر شواهد، رویکرد محتاطانه در واگذاری مسئولیت","challenges":"تردید در تصمیم‌گیری، کاهش ارتباطات مؤثر"},{"name":"اعتماد","level":"بالا","desc":"افرادی که در سطح بالایی از اعتماد قرار دارند، به راحتی به دیگران و سیستم‌ها اعتماد می‌کنند. این افراد معمولاً روابط اجتماعی قوی و پایداری دارند و به راحتی با دیگران همکاری می‌کنند.","traits_short":"اعتماد بالا: به راحتی به دیگران اعتماد می‌کنند و معمولاً نگرانی کمتری از خیانت دارند.\nروابط قوی: این افراد معمولاً روابط اجتماعی قوی و پایداری دارند.\nهمکاری و تعامل: به راحتی با دیگران همکاری می‌کنند و تعاملات مثبتی دارند.\nخوش‌بینی: معمولاً دیدگاه مثبتی نسبت به دیگران و جهان دارند.","traits":"اعتماد به دیگران، حس همبستگی، واگذاری مسئولیت","challenges":"آسیب‌پذیری نسبت به خیانت، ناراحتی از عدم پاسخگویی"},{"name":"سادگی","level":"پایین","desc":"افراد دارای رک‌گویی کم، در بیان احساسات و افکار خود دچار مشکل هستند یا از ابراز نظرات صریح اجتناب می‌ورزند. این افراد اغلب در تلاش‌اند تا از تعارضات یا قضاوت دیگران پرهیز کنند.","traits_short":"گرایش به پنهان‌کاری: به دلایل مختلف، نظرات واقعی خود را پنهان می‌کنند و با احتیاط صحبت می‌کنند.\nتعارض‌گریزی: از بیان چیزی که ممکن است منجر به اختلاف شود اجتناب می‌کنند.\nمبهم و محتاط صحبت کردن: اغلب در کلام خود از اصطلاحات کلی و نامشخص استفاده می‌کنند.\nکاهش شفافیت در روابط: ممکن است دیگران در روابط خود با این افراد احساس عدم صداقت یا سردرگمی کنند.","traits":"احتیاط در بیان نظرات، ترس از واکنش‌های منفی","challenges":"کاهش شفافیت ارتباطات، مشکل در ایجاد اعتماد"},{"name":"سادگی","level":"متوسط","desc":"این افراد توانایی ابراز نظرات شفاف را دارند، اما این کار اغلب مشروط به شرایط است. آن‌ها معمولاً موقعیت‌ها را ارزیابی می‌کنند و سپس تصمیم می‌گیرند که رک‌گویی مناسب است یا نه.","traits_short":"رک‌گویی مشروط: در برخی موقعیت‌ها رک و صادق هستند و در برخی دیگر محتاط‌تر عمل می‌کنند.\nتوازن نسبی: بین بیان شفافیت و ملاحظه احساسات دیگران تعادلی نسبی برقرار می‌کنند.\nمدیریت روابط: تلاش می‌کنند صداقت خود را به شکلی نشان دهند که روابط شخصی و حرفه‌ای آن‌ها آسیب نبیند.\nانعطاف‌پذیری: می‌توانند بسته به مخاطب و موقعیت، انعطاف در بیان خود داشته باشند.","traits":"بیان متعادل نظرات، حساسیت به واکنش دیگران","challenges":"تردید در بیان نظرات، کاهش شفافیت"},{"name":"سادگی","level":"بالا","desc":"افرادی که رک‌گویی بالایی دارند، بدون پیچیدگی و به صراحت افکار خود را بیان می‌کنند. اگرچه این ویژگی می‌تواند روابط شفاف و صادقانه‌ای ایجاد کند، اما در صورت افراط ممکن است منجر به ناراحتی دیگران شود.","traits_short":"شفافیت بالا: افکار و احساسات خود را بدون هرگونه پنهان‌کاری یا ابهام بیان می‌کنند.\nبی‌تعارفی: معمولاً بدون نگرانی از برداشت دیگران مستقیماً صحبت می‌کنند.\nتأکید بر صداقت: صداقت و شفافیت برای آن‌ها اولویت بالایی دارد، حتی اگر این موضوع باعث تعارض شود.\nبی‌پروایی احتمالی: گاهی اوقات عدم توجه به لطافت کلام ممکن است به روابط آسیب بزند.","traits":"بیان مستقیم نظرات، شفافیت در ارتباطات","challenges":"احتمال ایجاد سوءتفاهم، مشکل در مدیریت تعارضات"},{"name":"نوع دوستی","level":"پایین","desc":"افرادی که در این سطح قرار دارند، معمولاً تمایل کمتری به کمک به دیگران دارند و بیشتر به منافع شخصی خود توجه می‌کنند. این افراد ممکن است به دلایل مختلفی از جمله تجربیات منفی گذشته یا عدم اعتماد به دیگران، از نوع‌دوستی دوری کنند.","traits_short":"تمرکز بر خود: بیشتر به نیازها و منافع شخصی خود توجه دارند.\nعدم تمایل به کمک: تمایل کمتری به کمک به دیگران یا شرکت در فعالیت‌های داوطلبانه دارند.\nنگرانی از سوءاستفاده: ممکن است نگران سوءاستفاده دیگران از نوع‌دوستی خود باشند.\nتجربیات منفی: ممکن است تجربیات منفی گذشته باعث کاهش تمایل به نوع‌دوستی شده باشد.","traits":"تمرکز بر اهداف فردی، خودگرایی مثبت","challenges":"تعاملات سردتر، تلاش کمتر برای همکاری"},{"name":"نوع دوستی","level":"متوسط","desc":"افرادی در این سطح معمولاً تمایل به کمک به دیگران دارند، اما این تمایل مشروط به شرایط و موقعیت‌ها است. آن‌ها ممکن است در برخی موقعیت‌ها به راحتی کمک کنند، اما در موقعیت‌های دیگر محتاط‌تر باشند.","traits_short":"نوع‌دوستی مشروط: تمایل به کمک به دیگران بستگی به شرایط و موقعیت‌ها دارد.\nتعاملات متعادل: معمولاً در تعاملات اجتماعی خود تعادل برقرار می‌کنند و به دیگران کمک می‌کنند.\nآگاهی از نیازها: به نیازهای دیگران آگاه هستند و سعی می‌کنند در صورت امکان کمک کنند.\nانعطاف‌پذیری: در صورت بروز مشکلات، قادر به بازسازی روابط و ادامه نوع‌دوستی هستند.","traits":"کمک‌های متعادل، همدلی معقول","challenges":"احتمال تعارض در اولویت‌ها، تلاش برای تعادل"},{"name":"نوع دوستی","level":"بالا","desc":"افرادی که در سطح بالایی از نوع‌دوستی قرار دارند، به راحتی و بدون انتظار پاداش به دیگران کمک می‌کنند. این افراد معمولاً روابط اجتماعی قوی و پایداری دارند و به راحتی با دیگران همکاری می‌کنند.","traits_short":"نوع‌دوستی بالا: به راحتی و بدون انتظار پاداش به دیگران کمک می‌کنند.\nروابط قوی: این افراد معمولاً روابط اجتماعی قوی و پایداری دارند.\nهمکاری و تعامل: به راحتی با دیگران همکاری می‌کنند و تعاملات مثبتی دارند.\nخوش‌بینی: معمولاً دیدگاه مثبتی نسبت به دیگران و جهان دارند.","traits":"تمایل به کمک، همدلی جویی، روحیه تیمی قوی","challenges":"استفاده و سوء استفاده، فراموشی نیازهای شخصی"},{"name":"تبعیت","level":"پایین","desc":"افرادی که تبعیت کمی دارند، تمایل به پیروی از هنجارها و نظرهای گروهی کم‌تری نشان می‌دهند و بیشتر بر ایده‌ها و تصمیمات فردی خود تکیه می‌کنند.","traits_short":"استقلال‌طلبی: اغلب تصمیمات و نظرات خود را دنبال می‌کنند و کمتر تحت تأثیر فشار گروهی قرار می‌گیرند.\nنوآور بودن: به‌دلیل عدم پیروی کورکورانه از قواعد، توانایی بالایی برای خلق ایده‌های جدید دارند.\nمقاومت در برابر فشار اجتماعی: در مقابل فشارها و انتظارات اجتماعی مقاوم هستند.\nعدم تمایل به سازگاری: ممکن است در گروه‌هایی که تبعیت و هماهنگی بالا انتظار می‌رود، مشکلاتی داشته باشند.","traits":"استقلال فکری، روحیه انتقادی، پویایی فکری","challenges":"تعارضات مکرر، کاهش انسجام تیمی"},{"name":"تبعیت","level":"متوسط","desc":"افراد با سطح تبعیت متوسط معمولاً به تعدیل بین نظرات خود و انتظارات گروهی قادرند و به راحتی می‌توانند با محیط اطراف خود سازگار شوند.","traits_short":"موازنه‌گر: توانایی تنظیم بین نیاز به پیروی از گروه و حفظ نظرات شخصی.\nانعطاف‌پذیر: می‌توانند در موقعیت‌های مختلف با تغییرات سریع سازگار شوند.\nآگاهی از هنجارها: درک خوبی از هنجارها و انتظارات اجتماعی دارند.\nهمکاری مؤثر: به راحتی در گروه‌ها و تیم‌ها همکاری می‌کنند.","traits":"تعادل بین پذیرش قوانین و ابراز نظرات مستقل","challenges":"مواجهه با مقاومت دیگران، تعارض در تصمیم‌گیری"},{"name":"تبعیت","level":"بالا","desc":"افراد با تبعیت بالا معمولاً به راحتی با نظرات و تصمیمات گروهی سازگار می‌شوند، حتی اگر با عقاید شخصی‌شان هم‌خوانی نداشته باشد. این ممکن است به سادگی به ثبات و هماهنگی کمک کند، اما خطر از دست دادن هویت فردی نیز وجود دارد.","traits_short":"شخصیت هماهنگ: به راحتی با خواسته‌ها و انتظارات گروه سازگار می‌شوند.\nریسک اجتناب از تعارض: برای جلوگیری از تعارضات و حفظ هماهنگی، ترجیح می‌دهند با گروه همراهی کنند.\nکاهش ابتکار شخصی: ممکن است به دلیل اتکای بیش از حد به نظرات دیگران، ابتکار عمل و خلاقیت شخصی کاهش یابد.\nسازگاری فوری: توانایی بالایی در پیروی سریع از قواعد و مقررات جدید دارند.","traits":"پذیرش قوانین سریع، تمرکز بر هماهنگی گروهی","challenges":"فقدان ابراز نظر شخصی، سوءاستفاده از رفتار منفعل"},{"name":"تواضع","level":"پایین","desc":"افرادی که سطح تواضع کمی دارند، به‌طور معمول خود را بالاتر از دیگران می‌بینند و در روابط اجتماعی و حرفه‌ای خود از ویژگی‌هایی مانند تکبر، خودبزرگ‌بینی یا جاه‌طلبی بیش از حد استفاده می‌کنند.","traits_short":"تمرکز بر خود: فرد معمولاً به دستاوردهای شخصی خود توجه زیادی دارد و دیگران را کم‌ارزش‌تر از خود می‌داند.\nتمایل به برتری جویی: این افراد ممکن است سعی کنند در هر موقعیتی برتری خود را نشان دهند.\nعدم پذیرش اشتباهات: افراد با تواضع کم ممکن است از پذیرش اشتباهات خود اجتناب کنند و به جای آن‌که مسئولیت خود را بپذیرند، تقصیر را به گردن دیگران بیندازند.\nدفاع از خود: تمایل به دفاع بی‌مورد از خود و دستاوردهایشان دارند و ممکن است در برابر نقد یا بازخورد منفی واکنش‌های تند نشان دهند.","traits":"اعتماد به نفس بالا، مقاومت در برابر نقد","challenges":"ایجاد تعارضات، کاهش اعتماد و همکاری تیمی"},{"name":"تواضع","level":"متوسط","desc":"افراد با تواضع متوسط معمولاً به ارزش خود آگاه هستند و در عین حال، در روابط اجتماعی و حرفه‌ای به دیگران احترام می‌گذارند. آن‌ها در شرایط مختلف می‌توانند تعادل خوبی بین حفظ عزت نفس و احترام به دیگران برقرار کنند.","traits_short":"احترام به دیگران: این افراد معمولاً به‌طور طبیعی به نظرات و احساسات دیگران احترام می‌گذارند و در موقعیت‌های اجتماعی از خودخواهی پرهیز می‌کنند.\nآگاهی از محدودیت‌ها: افراد با تواضع متوسط معمولاً می‌دانند که هیچ‌کس کامل نیست و از اشتباهات خود می‌آموزند.\nتوانایی در پذیرش بازخورد: این افراد به راحتی می‌توانند بازخورد دیگران را بپذیرند و در صورت لزوم آن را بهبود دهند.\nتوازن در رفتار: در روابط اجتماعی معمولاً تواضع خود را به شکلی متعادل به نمایش می‌گذارند و به دنبال درک و همکاری با دیگران هستند.","traits":"تمرکز بر یادگیری متقابل، انعطاف در پذیرش انتقاد","challenges":"تعارض با افراد مغرور، حفظ تعادل فروتنی و اعتماد به نفس"},{"name":"تواضع","level":"بالا","desc":"افرادی که تواضع بالایی دارند، به‌طور معمول خود را برابر با دیگران می‌بینند و در رفتارهایشان از احساسات قوی احترام و فروتنی نسبت به دیگران برخوردار هستند. این افراد معمولاً توانایی بالایی در شنیدن، درک و احترام به دیگران دارند و به اشتباهات خود نیز آگاه هستند.","traits_short":"فروتنی واقعی: این افراد معمولاً به خودشان به‌طور طبیعی افتخار می‌کنند اما هرگز احساس برتری یا تفاوت زیادی نسبت به دیگران ندارند.\nپذیرش کامل اشتباهات: به راحتی اشتباهات خود را می‌پذیرند و از آن‌ها یاد می‌گیرند.\nتلاش برای خدمت به دیگران: این افراد اغلب در تلاش هستند تا در خدمت دیگران باشند و خواسته‌های آن‌ها را در اولویت قرار دهند.\nنداشتن تمایل به خودستایی: آن‌ها از نمایش دستاوردهای خود پرهیز می‌کنند و معمولاً در تلاشند تا دیگران را به‌جای خودشان برجسته کنند.\nتوانایی در راهنمایی دیگران: این افراد می‌توانند دیگران را با مهربانی و به‌طور مؤثر راهنمایی کنند، بدون آنکه احساس برتری داشته باشند.","traits":"پذیرش و تمایل به یادگیری، همکاری و تعامل سازنده","challenges":"عدم برجستگی شخصی، سوءاستفاده دیگران"},{"name":"درک دیگران","level":"پایین","desc":"افرادی که درک کمی از دیگران دارند، معمولاً قادر به شناسایی احساسات یا نیازهای دیگران نیستند. این افراد ممکن است در موقعیت‌های اجتماعی دچار مشکلاتی شوند، چرا که به‌طور کامل نمی‌توانند ارتباط عاطفی و شناختی با دیگران برقرار کنند.","traits_short":"کمبود آگاهی عاطفی: افراد در این سطح ممکن است نتوانند احساسات دیگران را تشخیص دهند و از واکنش‌های عاطفی دیگران بی‌خبر باشند.\nتمرکز زیاد بر خود: این افراد اغلب درگیر افکار و احساسات خود هستند و به مشکلات یا نیازهای دیگران توجه کمی دارند.\nعدم همدلی: به دلیل عدم توانایی در درک احساسات دیگران، روابط این افراد ممکن است سطحی و ناکارآمد باشد.\nمقاومت در برابر تغییر: درک کم از دیگران می‌تواند منجر به مقاومتی در برابر تغییرات اجتماعی یا عدم توانایی در انطباق با نیازهای گروه شود.","traits":"تمرکز بر واقعیت‌ها و منطق، بی‌تفاوتی به عواطف","challenges":"ایجاد سردی در روابط، افزایش تعارضات"},{"name":"درک دیگران","level":"متوسط","desc":"افرادی با درک متوسط از دیگران معمولاً می‌توانند احساسات و نیازهای دیگران را تا حدی شناسایی کنند، اما این درک ممکن است به‌طور کامل و عمیق نباشد. این افراد در موقعیت‌های اجتماعی بهتر عمل می‌کنند، اما ممکن است در برخی موارد قادر به درک کامل احساسات یا مسائل پیچیده دیگران نباشند.","traits_short":"آگاهی متوسط از احساسات: این افراد قادرند بیشتر اوقات احساسات دیگران را شناسایی کنند، اما ممکن است در موارد پیچیده یا زمانی که افراد احساسات خود را به‌طور مستقیم بیان نمی‌کنند، با مشکل مواجه شوند.\nتوانایی در شنیدن: افراد با درک متوسط معمولاً می‌توانند به‌طور فعال به دیگران گوش دهند و پاسخ‌های معقول بدهند، ولی ممکن است نتوانند به‌طور کامل درک کنند که چرا فرد احساس خاصی دارد.\nتوانایی تطبیق با نیازهای دیگران: آن‌ها معمولاً قادرند با نیازهای مختلف افراد سازگار شوند، اما این تطبیق ممکن است به‌طور سطحی یا بدون درک کامل از وضعیت فرد انجام شود.\nرعایت فاصله: ممکن است این افراد در ایجاد ارتباطات عاطفی نزدیک و صمیمانه با دیگران محدودیت داشته باشند.","traits":"توانایی تشخیص احساسات، حفظ فاصله عاطفی","challenges":"کمبود عمق همدلی در شرایط پیچیده، ایجاد سوءتفاهم"},{"name":"درک دیگران","level":"بالا","desc":"افرادی که درک بالایی از دیگران دارند، قادرند به‌طور عمیق احساسات، نیازها و وضعیت‌های عاطفی دیگران را شناسایی کنند. این افراد می‌توانند درک عاطفی پیچیده‌تری داشته باشند و در موقعیت‌های اجتماعی روابطی عمیق‌تر و مؤثرتر برقرار کنند.","traits_short":"توانایی درک احساسات پیچیده: افراد با درک زیاد از دیگران می‌توانند احساسات پیچیده‌ای مانند اضطراب، ترس، یا سرخوردگی را تشخیص دهند و واکنش‌های مناسب به آن‌ها نشان دهند.\nهمدلی عمیق: این افراد نه تنها می‌توانند احساسات دیگران را شناسایی کنند، بلکه توانایی دارند که خود را به‌طور واقعی در موقعیت دیگران قرار دهند و احساسات آنان را تجربه کنند.\nتوانایی پیش‌بینی نیازهای دیگران: به دلیل درک عمیق از احساسات و نیازهای دیگران، این افراد می‌توانند پیش‌بینی کنند که دیگران چه چیزی نیاز دارند یا چگونه می‌توانند کمک کنند.\nرابطه نزدیک و حمایت‌گر: در روابط اجتماعی، این افراد تمایل دارند روابط نزدیک‌تر و حمایت‌گرانه‌ای برقرار کنند و به‌طور فعال به دیگران در رفع نیازهایشان کمک می‌کنند.","traits":"حساسیت به احساسات، تمایل به کمک و حمایت","challenges":"خستگی احساسی، ضعف در تعیین مرزها"}],"work_sub":[{"name":"کفایت","level":"پایین","desc":"افراد با شایستگی پایین، اغلب اعتماد کمی به توانایی‌های خود دارند و بیشتر به حمایت یا هدایت دیگران وابسته هستند. این ویژگی ممکن است موجب شود که در محیط‌های کاری دشوار یا رقابتی عملکرد ضعیف‌تری داشته باشند.","traits":"اعتماد به نفس پایین: این افراد ممکن است توانایی‌های خود را کمتر از حد واقعی ارزیابی کنند.\nوابستگی به دیگران: تمایل به پذیرش کمک یا هدایت از مدیران یا همکاران.\nاجتناب از موقعیت‌های چالش‌برانگیز: ممکن است از پذیرش وظایف جدید یا پیچیده خودداری کنند.","challenges":"ترس از شکست، عملکرد ضعیف در شرایط پراسترس","performance":"مناسب برای مشاغل ساده یا با نظارت نزدیک"},{"name":"کفایت","level":"متوسط","desc":"افراد با شایستگی متوسط، هم اعتماد به توانایی‌های خود دارند و هم از محدودیت‌های خود آگاه هستند. این افراد در میان دیگر کارکنان، عملکرد مناسبی دارند و توانایی مدیریت وظایف خود را در محیط‌های کاری مختلف دارند.","traits":"تعادل در اعتماد به نفس: این افراد به توانایی‌های خود اعتماد دارند، اما ممکن است در شرایط خاص نیاز به تأیید دیگران داشته باشند.\nپذیرش یادگیری: آمادگی برای یادگیری مهارت‌های جدید و تلاش برای بهبود عملکرد.\nسازگاری: توانایی تطبیق با محیط‌های کاری مختلف.","challenges":"عدم قاطعیت گاه‌به‌گاه، چالش در ثبات عملکرد","performance":"عملکرد مناسب؛ ویژه مشاغل تیمی و اجرایی"},{"name":"کفایت","level":"بالا","desc":"افراد با شایستگی بالا معمولاً قاطعانه به توانایی‌های خود اعتماد دارند و به انجام وظایف به بهترین شکل ممکن پایبند هستند. این ویژگی باعث می‌شود که در موقعیت‌های چالش‌برانگیز کاری، عملکرد مؤثری داشته باشند.","traits":"اعتماد به نفس بالا: باور به توانایی‌های شخصی برای رسیدن به موفقیت.\nعملکرد متعهد: این افراد در انجام وظایف خود بسیار جدی و متعهد هستند.\nرهبری و مدیریت مؤثر: توانایی حل مسائل پیچیده با رویکرد سیستماتیک و پیش‌بینی نتایج.","challenges":"وسواس در کیفیت، دشواری در پذیرش شکست","performance":"عملکرد عالی در مشاغل مدیریتی و تحلیلی"},{"name":"نظم و قدرت","level":"پایین","desc":"افراد با نظم و ترتیب پایین معمولاً در محیط‌های پراکنده و غیرمنظم راحت‌تر هستند. این ویژگی می‌تواند منجر به مشکلاتی در رعایت برنامه‌ریزی‌ها، مدیریت زمان و انجام وظایف حساس شود.","traits":"انعطاف بالا: این افراد معمولاً در محیط‌های غیرساختاریافته عملکرد بهتری دارند.\nبی‌علاقگی به جزئیات: تمایل دارند که مسائل جزئی را نادیده بگیرند و بیشتر بر تصویر کلی تمرکز کنند.\nرویکرد غیررسمی: معمولاً ترجیح می‌دهند در محیط‌های کاری کمتر سیستماتیک فعالیت کنند.","challenges":"مشکلات در رعایت برنامه‌ها، سردرگمی در محیط‌های سختگیرانه","performance":"مناسب برای مشاغل با خلاقیت و انعطاف بالا"},{"name":"نظم و قدرت","level":"متوسط","desc":"افراد با نظم و ترتیب متوسط معمولاً تعادل خوبی بین دقت و انعطاف‌پذیری دارند. این افراد می‌توانند در محیط‌ها با سطح متفاوتی از سازمان‌دهی عملکرد مؤثری داشته باشند.","traits":"تعادل در دقت و سرعت: این افراد به اندازه کافی به جزئیات توجه دارند، اما کمال‌گرا نیستند.\nانعطاف‌پذیری نسبی: قادر به کار در شرایط غیرمنظم و محیط‌های پویا هستند.\nبرنامه‌ریزی عملی: توانایی مدیریت وظایف روزمره و برنامه‌ریزی برای اهداف کوتاه‌مدت و میان‌مدت.","challenges":"چالش در مدیریت استرس، افت دقت گاه‌به‌گاه","performance":"خوب در مشاغل تیمی و مدیریت وظایف متوسط"},{"name":"نظم و قدرت","level":"بالا","desc":"افراد با نظم و ترتیب زیاد معمولاً در محیط‌های منظم و ساختارمند بسیار خوب عمل می‌کنند. آن‌ها به رعایت جزئیات، دقت در برنامه‌ریزی و پایبندی به قوانین اهمیت زیادی می‌دهند.","traits":"دقت و جزئی‌نگری: این افراد تمایل دارند تمام جزئیات را بررسی کنند و از اشتباهات کوچک جلوگیری کنند.\nبرنامه‌ریزی دقیق: توانایی بالایی برای تنظیم وظایف و برنامه‌ریزی کوتاه‌مدت و بلندمدت دارند.\nتعهد به حفظ نظم: اصرار بر رعایت استانداردها و حفظ محیط کاری مرتب و سیستماتیک.","challenges":"زمان ‌بر بودن تصمیمات، کمال‌گرایی","performance":"عالی در مشاغل مدیریتی، حسابداری یا فنی"},{"name":"وظیفه شناسی","level":"پایین","desc":"افراد با وظیفه‌شناسی پایین معمولاً نسبت به نقش‌ها و مسئولیت‌های رسمی بی‌تفاوت‌تر هستند و ممکن است رعایت قوانین و مقررات برای آن‌ها اهمیت چندانی نداشته باشد.","traits":"بی‌اعتنایی به قوانین و مقررات: ممکن است قوانین و هنجارهای کاری را نادیده بگیرند.\nانعطاف بیش‌ازحد: تمایل دارند وظایف خود را بر اساس موقعیت‌های غیررسمی یا نیاز شخصی انجام دهند.\nتمرکز بر آزادی عمل: تمایل دارند که از دخالت مستقیم قوانین و استانداردها دوری کنند.","challenges":"عدم پیگیری وظایف، عملکرد ضعیف در محیط‌های رسمی","performance":"مناسب برای مشاغل خلاقانه و محیط‌های آزاد"},{"name":"وظیفه شناسی","level":"متوسط","desc":"افراد با وظیفه‌شناسی متوسط معمولاً تعادل خوبی بین تعهد به وظایف و انعطاف‌پذیری در کار دارند. این افراد قادرند مسئولیت‌های خود را به‌خوبی انجام دهند، اما بیش‌ازحد سختگیر نیستند.","traits":"تعهد مطلوب: معمولاً وظایف خود را با جدیت و در حد قابل‌قبولی انجام می‌دهند.\nرعایت قوانین با دیدگاه منعطف: به قوانین احترام می‌گذارند، اما در صورت لزوم قادر به سازگاری با شرایط هستند.\nتمرکز بر نتایج: این افراد بیشتر بر دستیابی به نتایج مطلوب متمرکز هستند تا رعایت جزئیات بیش‌ازحد.","challenges":"افت گاه‌به‌گاه در تعهد، نیاز به نظارت","performance":"خوب در مشاغل تیمی یا محیط‌های متعادل"},{"name":"وظیفه شناسی","level":"بالا","desc":"افراد با وظیفه‌شناسی زیاد معمولاً بسیار متعهد به ارزش‌های اخلاقی، قوانین و مقررات هستند و برای انجام مسئولیت‌های خود ارزش زیادی قائل هستند.","traits":"تعهد بالا به مسئولیت‌ها: این افراد همیشه وظایف خود را با دقت کامل انجام می‌دهند.\nپایبندی به قوانین: رعایت دقیق قوانین، مقررات و انتظارات کاری.\nوجدان اخلاقی قوی: تأکید بر اهمیت اخلاق در تصمیم‌گیری و رفتارهای کاری.","challenges":"عدم انعطاف در شرایط خاص، بار کاری سنگین","performance":"عالی در مشاغل رسمی، قانون‌محور یا حساس"},{"name":"تلاش برای موفقیت","level":"پایین","desc":"افراد با تلاش برای موفقیت پایین معمولاً انگیزه کمتری برای دستیابی به اهداف بلندپروازانه دارند و ممکن است به‌راحتی از چالش‌ها و موانع کناره‌گیری کنند.","traits":"انگیزه پایین: تمایل به انجام وظایف به‌صورت حداقلی و بدون تلاش برای بهبود.\nعدم هدف‌گذاری: ممکن است اهداف مشخصی نداشته باشند یا به‌راحتی از آن‌ها دست بکشند.\nتمرکز بر راحتی: تمایل به حفظ وضعیت موجود و اجتناب از تغییرات.","challenges":"عملکرد ضعیف در محیط‌های رقابتی، عدم پیشرفت شغلی","performance":"مناسب برای نقش‌های پایدار و بدون نیاز به انگیزه بالا"},{"name":"تلاش برای موفقیت","level":"متوسط","desc":"افراد با تلاش برای موفقیت متوسط معمولاً تعادل خوبی بین انگیزه برای موفقیت و حفظ تعادل در زندگی شخصی و حرفه‌ای دارند.","traits":"انگیزه متعادل: این افراد به‌طور کلی به دنبال پیشرفت هستند، اما به تعادل بین کار و زندگی نیز اهمیت می‌دهند.\nهدف‌گذاری واقع‌بینانه: توانایی تعیین اهداف قابل‌دستیابی و پیگیری آن‌ها.\nانعطاف‌پذیری: قادر به سازگاری با تغییرات و شرایط جدید.","challenges":"افت انگیزه در شرایط سخت، نیاز به راهنمایی","performance":"خوب در مشاغل تیمی و محیط‌های متعادل"},{"name":"تلاش برای موفقیت","level":"بالا","desc":"افراد با تلاش برای موفقیت زیاد معمولاً بسیار هدف‌گرا و انگیزه‌مند هستند و به‌طور مداوم به دنبال دستیابی به اهداف بلندپروازانه و موفقیت‌های بزرگ هستند.","traits":"انگیزه بالا: این افراد به‌طور مداوم به دنبال بهبود و پیشرفت در کار خود هستند.\nهدف‌گرایی: توانایی تعیین و پیگیری اهداف بلندمدت و کوتاه‌مدت.\nپشتکار و استقامت: تمایل به ادامه دادن حتی در مواجهه با موانع و چالش‌ها.","challenges":"خطر فرسودگی شغلی، تمرکز بر اهداف شخصی","performance":"عالی در مشاغل رقابتی و هدف‌محور"},{"name":"خویشتن داری","level":"پایین","desc":"افراد با خویشتنداری پایین معمولاً در تکمیل وظایف مشکل دارند و به‌راحتی دچار اهمال‌کاری می‌شوند. این ویژگی ممکن است منجر به عملکرد ضعیف شغلی، به‌ویژه در محیط‌هایی با انتظارات بالا، شود.","traits":"اهمال‌کاری و تأخیر: این افراد به‌راحتی وظایف خود را عقب می‌اندازند یا به طور کامل از انجام آن‌ها اجتناب می‌کنند.\nمشکل در تمرکز: به‌سرعت حواسشان پرت می‌شود و نمی‌توانند به‌طور مداوم روی کارها تمرکز کنند.\nتمایل به کارهای آسان‌تر: معمولاً کارهای چالش‌برانگیز را کنار گذاشته و روی فعالیت‌های ساده‌تر و کم‌اهمیت تمرکز می‌کنند.","challenges":"افت شدید عملکرد، مشکل در برخورد با مهلت‌ها","performance":"مناسب برای نقش‌های دارای نظارت شدید و ساختاریافته"},{"name":"خویشتن داری","level":"متوسط","desc":"افراد با خویشتنداری متوسط معمولاً بین انجام صحیح تعهدات کاری و بهره‌گیری از انعطاف در مدیریت زمان و استرس تعادل برقرار می‌کنند.","traits":"تعهد متعادل به وظایف: این افراد وظایف خود را انجام می‌دهند، اما معمولاً به اندازه کافی انعطاف نشان می‌دهند.\nتمرکز نسبی: توانایی پایبند ماندن به وظایف اصلی، اما با احتمال بیشتر تحت تأثیر قرار گرفتن حواس‌پرتی‌های غیرضروری.\nانعطاف‌پذیری منطقی: در مدیریت وظایف خود تا حدی انعطاف نشان داده و می‌توانند اولویت‌ها را تغییر دهند.","challenges":"اهمال‌کاری گاه‌به‌گاه، مشکل در اتمام وظایف","performance":"خوب در محیط‌های منعطف و متعادل"},{"name":"خویشتن داری","level":"بالا","desc":"افراد با خویشتنداری بالا معمولاً بسیار متعهد به انجام کارها هستند و می‌توانند خود را برای اتمام وظایف حتی در شرایط سخت به بهترین شکل مدیریت کنند.","traits":"تمرکز بالا: توانایی تمرکز بر انجام وظایف حتی در وجود عوامل حواس‌پرتی.\nپایبندی به تعهدات: افراد با خویشتنداری زیاد وظایف کاری خود را با دقت و به‌موقع انجام می‌دهند.\nپایداری و پشتکار: این افراد به ندرت کارها را نیمه تمام رها می‌کنند و موانع را مانعی جدی برای اتمام کار نمی‌دانند.","challenges":"استرس ناشی از انتظارات بالا، ناتوانی در توقف کار","performance":"عالی در پروژه‌های بلندمدت و مشاغل دقیق و ساختارمند"},{"name":"محتاط در تصمیم گیری","level":"پایین","desc":"افراد با محتاط‌بودن پایین معمولاً تصمیم‌گیری سریع و ریسک‌پذیرتری دارند و در بسیاری از موارد، کمتر به بررسی دقیق جزئیات و پیامدها می‌پردازند.","traits":"ریسک‌پذیری بالا: تمایل به انتخاب گزینه‌های تازه و مخاطره‌آمیز.\nاقدام سریع: بدون صرف زمان زیاد برای تحلیل، آماده انجام اقدامات فوری هستند.\nتمرکز بر نوآوری: معمولاً ترجیح می‌دهند ایده‌ها و روش‌های جدید را آزمایش کنند.","challenges":"افزایش احتمال خطا، مشکلات در محیط‌های دقیق و حساس","performance":"خوب در مشاغل نوآورانه و مرتبط با اقدامات سریع (مانند کارآفرینی)"},{"name":"محتاط در تصمیم گیری","level":"متوسط","desc":"افراد با محتاط‌بودن متوسط معمولاً تعادل خوبی بین احتیاط و سرعت عمل در تصمیم‌گیری دارند و می‌توانند به‌جا و به‌موقع عمل کنند.","traits":"انعطاف‌پذیری: در مواجهه با شرایط متغیر، می‌توانند به راحتی بین تحلیل دقیق و اقدام سریع تعادل برقرار کنند.\nریسک‌پذیری معقول: آماده‌اند که در شرایط خاص، میزان مشخصی از ریسک را بپذیرند.\nکارآیی در تصمیم‌گیری: معمولاً می‌توانند تصمیمات منطقی و قابل اجرا در بازه زمانی مناسب بگیرند.","challenges":"افت عملکرد در فشار بالا، توجه محدود به اهداف بلندمدت","performance":"مناسب برای مشاغل ترکیبی (مانند مدیریت اجرایی یا طراحی محصول)"},{"name":"محتاط در تصمیم گیری","level":"بالا","desc":"افراد با سطح بالای احتیاط در تصمیم‌گیری، معمولا پیش از هر اقدامی، جوانب مختلف را به‌دقت می‌سنجند و سعی می‌کنند با اجتناب از خطرات احتمالی، تصمیم‌های قابل اطمینانی بگیرند.","traits":"دقت بالا: پیش از انتخاب یا اقدام خاص، تمامی احتمالات و پیامدها را بررسی می‌کنند.\nپرهیز از ریسک: ترجیح به انتخاب گزینه‌های ایمن‌تر و حفظ ثبات.\nتمرکز بر برنامه‌ریزی: اغلب پیش از شروع هر پروژه یا مسئولیت، برنامه‌ریزی دقیقی انجام می‌دهند.","challenges":"فرصت‌سوزی، تمرکز بیش از حد بر جزئیات","performance":"عالی در مشاغل حساس و ایمن‌محور (مانند حسابداری یا تحلیل داده)"},{"name":"تخیل","level":"پایین","desc":"افراد با تخیل پایین معمولاً به واقعیت‌های موجود پایبند هستند و کمتر به دنبال ایده‌های نو و خلاقانه می‌روند. این ویژگی می‌تواند در محیط‌های کاری با ساختارهای ثابت و نیاز به دقت بالا مفید باشد.","traits":"پایبندی به واقعیت: تمرکز بر واقعیت‌های موجود و راه‌حل‌های عملی.\nثبات در عملکرد: تمایل به پیروی از روش‌های اثبات‌شده و قابل اعتماد.\nتمرکز بر جزئیات: دقت بالا در جزئیات و اجرای دقیق وظایف.","challenges":"کمبود نوآوری، مشکلات در محیط‌های پویا","performance":"خوب در مشاغل دقیق و ثابت (مانند حسابداری)"},{"name":"تخیل","level":"متوسط","desc":"افراد با تخیل متوسط معمولاً تعادل خوبی بین خلاقیت و واقع‌گرایی دارند و می‌توانند به‌طور مؤثر ایده‌های نو را با نیازهای عملی ترکیب کنند.","traits":"خلاقیت متعادل: توانایی تولید ایده‌های نو در عین حفظ واقع‌گرایی.\nتوانایی حل مسئله: می‌توانند به‌طور خلاقانه به مسائل نگاه کرده و راه‌حل‌های عملی ارائه دهند.\nانعطاف‌پذیری معقول: قادر به تطبیق با شرایط جدید و تغییرات محیطی هستند.","challenges":"تردید در تصمیم‌گیری، نیاز به راهنمایی","performance":"مناسب برای مشاغل ترکیبی (مانند مدیریت پروژه یا توسعه محصول)"},{"name":"تخیل","level":"بالا","desc":"افراد با سطح بالای تخیل، معمولاً توانایی بالایی در خلق ایده‌های نو و دیدن فرصت‌های جدید دارند و می‌توانند به‌طور خلاقانه به مسائل نگاه کنند.","traits":"خلاقیت بالا: توانایی تولید ایده‌های نو و راه‌حل‌های خلاقانه برای مسائل پیچیده.\nدیدگاه‌های نوآورانه: تمایل به دیدن فراتر از محدودیت‌های موجود و جستجوی فرصت‌های جدید.\nانعطاف‌پذیری ذهنی: توانایی تغییر دیدگاه و تطبیق با شرایط جدید.","challenges":"تمرکز بر ایده‌ها به جای اجرا، پراکندگی توجه","performance":"عالی در مشاغل خلاقانه و نوآورانه (مانند طراحی یا تبلیغات)"},{"name":"زیبایی پسندی","level":"پایین","desc":"افراد با زیباشناسی پایین معمولاً به کارآمدی و عملکرد عملی بیشتر اهمیت می‌دهند و توجه کمی به جنبه‌های زیباشناختی دارند.","traits":"عملگرا: تمرکز بر جنبه‌های عملی کار به‌جای جنبه‌های زیباشناختی.\nساده‌نگری: تمایل به استفاده از روش‌های ساده و مستقیم برای اتمام پروژه‌ها.\nپایبندی به استانداردها: ترجیح کار با رویه‌های مشخص و از پیش تعریف‌شده در محیط‌هایی که هنر و خلاقیت اولویت کمتری دارد.","challenges":"ضعف در مشاغل خلاق، مشکلات در جلب نظر مشتری خلاق","performance":"خوب در مشاغل فنی و استانداردمحور (مانند حسابداری، مهندسی)"},{"name":"زیبایی پسندی","level":"متوسط","desc":"افراد با زیباشناسی متوسط می‌توانند تعادل خوبی بین خلاقیت و توجه به زیبایی از یک سو و واقع‌گرایی از سوی دیگر برقرار کنند.","traits":"حساسیت متعادل: توجه مناسب به جنبه‌های زیباشناختی بدون غفلت از واقعیت‌های کاری.\nتمرکز روی بهره‌وری: می‌توانند جنبه‌های هنری و عملی را به‌خوبی ترکیب کنند.\nانعطاف‌پذیری: توانایی کار در محیط‌های متنوع، از خلاقانه تا رسمی.","challenges":"کمبود توسعه خلاقیت، نیاز به هدایت","performance":"مناسب برای مشاغل بینابین خلاقیت و کاربردی بودن (مانند بازاریابی)"},{"name":"زیبایی پسندی","level":"بالا","desc":"افراد با سطح بالای زیباشناسی، حساسیت خاصی نسبت به زیبایی، هنر و هماهنگی در محیط‌های کاری و زندگی روزمره دارند.","traits":"درک زیبایی: توانایی برجسته در تحلیل و ارزیابی ابعاد ظاهری و هنری یک محصول یا پروژه.\nخلق محیط جذاب: تمایل به ایجاد محیط کاری دلنشین و زیبا که الهام‌بخش دیگران باشد.\nتوجه به جزئیات بصری: تمرکز زیاد روی جزئیات و هماهنگی در طراحی‌ها و خروجی‌های هنری.","challenges":"تمرکز زیاد بر زیبایی، نیاز به محیط الهام‌بخش","performance":"عالی در مشاغل خلاقانه و هنری (مانند طراحی، معماری)"},{"name":"احساسات","level":"پایین","desc":"افرادی با عواطف پایین، کمتر به جنبه‌های احساسی محیط اهمیت می‌دهند یا کمتر دچار نوسانات عاطفی می‌شوند. این ویژگی می‌تواند در محیط‌های کاری با ساختارهای بسیار منطقی و فنی مزیت باشد.","traits":"ثبات عاطفی: توانایی حفظ آرامش در شرایط پرتنش و هیجانی.\nتمرکز بر هدف: کمتر تحت‌تأثیر احساسات قرار گرفته و بیشتر هدف‌محور عمل می‌کنند.\nرابطه منطقی با دیگران: ترجیح ارتباط‌های رسمی و کاربردی بر روابط عاطفی عمیق.","challenges":"ضعف در مشاغل انسان‌محور، مشکلات با تیم‌های احساسی","performance":"مناسب برای مشاغل فنی و منطقی (حسابداری، تحلیل داده‌ها)"},{"name":"احساسات","level":"متوسط","desc":"افراد با سطح متوسط عواطف، معمولاً تعادلی بین ابراز احساسات و کنترل عاطفی دارند و می‌توانند همدلی را با دیدگاه منطقی ترکیب کنند.","traits":"همدلی متعادل: توانایی درک احساسات دیگران در کنار حفظ منطق و هدف‌گرایی.\nمدیریت مؤثر احساسات: می‌توانند هیجان‌های خود را در موقعیت‌های کاری به‌خوبی مدیریت کنند.\nارتباط متعادل: روابط دوستانه و عاطفی با همکاران بدون وابستگی یا حساسیت بیش‌ازحد.","challenges":"کاهش تأثیرگذاری در موقعیت احساسی بالا، نیاز به یادگیری","performance":"مناسب برای ترکیبی از مشاغل انسانی و منطقی (مدیریت پروژه)"},{"name":"احساسات","level":"بالا","desc":"افرادی با سطح بالای عواطف معمولاً احساسات عمیق‌تری را تجربه می‌کنند و نسبت به هیجان‌های خود و دیگران حساس‌تر هستند.","traits":"همدلی بالا: توانایی درک و همراهی عاطفی با همکاران در موقعیت‌های مختلف.\nارتباط مؤثر: مهارت بالا در برقراری روابط عاطفی گرم و دلپذیر.\nآگاهی بالا نسبت به هیجان‌ها: آگاهی نسبت به تغییرات عاطفی خود و دیگران و مدیریت مناسب آن‌ها.","challenges":"اولویت‌دهی به روابط، مدیریت استرس","performance":"عالی در مشاغل تعامل‌محوری مانند مشاوره و خدمات اجتماعی"},{"name":"اعمال","level":"پایین","desc":"افراد با سطح پایین کشش به اعمال، بیشتر به ثبات، پیش‌بینی‌پذیری، و ساختارهای تعریف‌شده علاقه دارند. این افراد معمولاً در موقعیت‌هایی که نیازمند تمرکز و تحلیل دقیق باشند، به شدت مؤثر هستند.","traits":"ثبات‌محوری: تمایل به کار در محیط‌هایی که قوانین مشخص و پیش‌بینی‌پذیری دارند.\nاحتیاط بالا: اغلب تصمیم‌گیری‌های دقیق و سنجیده می‌گیرند و از ریسک‌های غیرضروری اجتناب می‌کنند.\nفشار پایین به تیم یا فرآیندها: تمایل به انجام وظایف بدون به هم زدن روال عادی.","challenges":"کاهش تطبیق‌پذیری، ضعف در مشاغل پویا","performance":"مناسب برای مشاغل تحلیلی و با قوانین ثابت (مثل مالی و داده‌ها)"},{"name":"اعمال","level":"متوسط","desc":"افراد با سطح متوسط کشش به اعمال هیجان‌انگیز تعادل بسیار خوبی بین ثبات و پویایی برقرار می‌کنند. این افراد علاقه‌مند به تغییرات محدود و برنامه‌ریزی شده هستند.","traits":"ریسک‌پذیری منطقی: آمادگی برای امتحان کردن ایده‌های جدید با بررسی قبلی.\nانعطاف در روش‌ها: توانایی سازگاری با محیط درصورت نیاز به تغییر، در عین حفظ چارچوب‌ها.\nرغبت به پیشرفت: علاقه دارند کمی از منطقه امن خود خارج شوند، اما نه به حدی که به وظایف اصلی آسیب بزند.","challenges":"کاهش انگیزه در موقعیت‌های ثابت","performance":"مناسب برای محیط‌های متعادل مانند مدیریت پروژه و توسعه سازمانی"},{"name":"اعمال","level":"بالا","desc":"افراد با سطح بالای کشش به اعمال هیجان‌انگیز معمولاً ماجراجو هستند و تمایل زیادی به امتحان کردن شرایط یا تجربیات جدید دارند.","traits":"ریسک‌پذیری بالا: آمادگی برای پذیرش چالش‌ها و خطرات، اغلب بدون ترس از شکست.\nنوآوری: ایده‌های تازه ارائه می‌دهند و به دنبال آزمودن راه‌حل‌های غیرمتعارف هستند.\nانرژی و انگیزش بالا: به‌طور طبیعی مایل به انجام پروژه‌هایی هستند که هیجان یا چالش بالایی دارند.\nپویا بودن: علاقه به تغییر، جابه‌جایی، و خروج از محیط‌های یکنواخت.","challenges":"تمرکز پراکنده، نیاز به تغییر مداوم","performance":"مناسب برای مشاغل پویا و نوآورانه مانند کارآفرینی و بازاریابی"},{"name":"عقاید","level":"پایین","desc":"افراد با سطح پایین نظرات و عقاید اغلب گرایشی به باورهای محکم یا اصولی خاص ندارند. این افراد بیشتر عملگرا هستند و از بحث‌های فلسفی یا مسائل پیچیده مربوط به عقاید پرهیز می‌کنند.","traits":"تمرکز بر عملگرایی: این افراد به‌جای تکیه بر نظرات و عقاید ثابت، به دنبال راه‌حل‌های عملی و فوری هستند.\nانعطاف بیش از حد: به‌راحتی می‌توانند با شرایط مختلف و افراد با عقاید گوناگون سازگار شوند.\nبی‌نیازی به تئوری‌های پیچیده: این افراد ترجیح می‌دهند به‌جای مسائل پیچیده فلسفی یا نظری، بر وظایف روزمره تمرکز کنند.","challenges":"ضعف در تحلیل مسائل پیچیده و ضعف در اثربخشی استراتژیک","performance":"مناسب برای مشاغل فنی، اجرایی و کمتر مناسب برای تحلیل‌های پیچیده"},{"name":"عقاید","level":"متوسط","desc":"افراد با سطح متوسط نظرات، دیدگاه‌های متعادلی نسبت به موضوعات مختلف دارند و انعطاف‌پذیری بیشتری در مواجهه با دیدگاه‌های متنوع نشان می‌دهند. این افراد توانایی درک و پذیرش تفاوت‌ها را دارند و معمولاً تمایل دارند تعادل میان باورهای شخصی و نیازهای محیط کاری برقرار کنند.","traits":"انعطاف‌پذیری: این افراد می‌توانند با عقاید و نظرات مختلف برخورد باز و محترمانه داشته باشند.\nتوانایی سازگاری: با تغییرات محیط کاری به‌خوبی کنار آمده و می‌توانند بین دیدگاه‌های شخصی و مسائل محیط کار تعادل برقرار کنند.\nرویکرد متعادل: در بحث‌ها و تعاملات به‌دنبال یافتن نقاط مشترک بین دو طرف هستند.\nمیل به یادگیری: تمایل دارند با شنیدن و تحلیل دیدگاه‌های دیگران، نظرات و باورهای خود را بهبود ببخشند.","challenges":"مشکلات در محیط‌های پویا و کمبود خلاقیت در نقش‌های استراتژیک","performance":"مناسب برای مدیریت پروژه، منابع انسانی و کمتر مناسب برای تصمیمات قاطع"},{"name":"عقاید","level":"بالا","desc":"افراد با سطح بالایی از نظرات و عقاید، معمولاً نگرش‌هایی قوی، مشخص و اصولی نسبت به مسائل مختلف دارند. این نظرات ممکن است ریشه در باورهای عمیق شخصی، فرهنگی، اجتماعی یا حتی تجربیات فردی داشته باشد.","traits":"ثبات در باورها: این افراد اغلب عقاید شخصی خود را با جدیت دنبال کرده و به آن‌ها متعهد هستند.\nایستادگی در برابر تغییرات متضاد با عقایدشان: تمایل به مقاومت در برابر ایده‌ها یا تصمیماتی که با باورهایشان در تضاد است.\nتمرکز بر اصول و ارزش‌ها: تصمیم‌گیری‌ها و اقدامات آن‌ها اغلب به‌طور مستقیم بر مبنای عقایدشان انجام می‌شود.\nتلاش برای تأثیرگذاری: ممکن است تمایل داشته باشند که عقاید خود را در محیط کار به دیگران منتقل یا اعمال کنند.","challenges":"مشکل در پذیرش تغییرات سازمانی و  تأثیر منفی در تیم‌های متنوع و  ریسک انزوا شغلی","performance":"مناسب برای سیاست‌گذاری، مشاوره حقوقی و کمتر مناسب برای محیط‌های متنوع"},{"name":"ارزشها","level":"پایین","desc":"افراد با ارزش‌های کم معمولاً به اصول اخلاقی کمتر اهمیت می‌دهند و بیشتر بر کارایی، سودآوری و نتایج فوری تمرکز دارند. این افراد ممکن است در محیط‌هایی که اصول اخلاقی کمتری دارند یا نیاز به تصمیمات سریع و بدون توجه زیاد به جزئیات اخلاقی است، موفق‌تر باشند.","traits":"تمرکز بر نتایج: برای این افراد، دستیابی به نتایج سریع و کارایی بیشتر از رعایت اصول اخلاقی است.\nانعطاف‌پذیری در اصول: این افراد ممکن است اصول اخلاقی را در مواقع ضروری فدای بهبود نتایج کنند.\nتمایل به پذیرفتن ریسک‌های بیشتر: ممکن است این افراد در محیط‌های پر ریسک که نیاز به تصمیمات سریع دارند، عملکرد بهتری داشته باشند.","challenges":"کاهش اعتبار در محیط‌های اخلاقی، تمرکز زیاد بر سودآوری و کارایی","performance":"مناسب برای مشاغلی که نیاز به نتایج فوری و کارایی دارند مانند فروش، تبلیغات، رهبری در محیط‌های رقابتی و کم‌تنش اخلاقی"},{"name":"ارزشها","level":"متوسط","desc":"افراد با ارزش‌های متوسط به اصول اخلاقی و اصول شخصی خود اهمیت می‌دهند، اما قادرند با شرایط مختلف محیط کاری تطبیق یابند. این افراد معمولاً در تلاشند تا بین ارزش‌های خود و نیازهای سازمانی توازن برقرار کنند.","traits":"انعطاف‌پذیری در تصمیم‌گیری: توانایی سازگاری با شرایط مختلف و اتخاذ تصمیمات منطقی بر اساس موقعیت.\nاحترام به اصول اخلاقی، اما با سازش: این افراد ممکن است برخی از اصول اخلاقی خود را در مواقع خاص تطبیق دهند تا بتوانند در محیط‌های پیچیده به کار خود ادامه دهند.\nتوانایی کار گروهی: از آنجا که این افراد معمولاً بین اصول شخصی و نیازهای تیمی توازن برقرار می‌کنند، در کار گروهی موفق‌ترند.","challenges":"برقراری تعادل در اولویت‌ها، اهش انگیزه در محیط‌های بی‌ثبات","performance":"مناسب برای مشاغل متعادل مانند مدیریت منابع انسانی، مشاوره"},{"name":"ارزشها","level":"بالا","desc":"افرادی که دارای ارزش‌های بالا هستند، به شدت به اصول اخلاقی، عدالت، صداقت و مسئولیت‌پذیری اهمیت می‌دهند. این افراد معمولاً به‌دنبال شغل‌هایی هستند که بتوانند در آن‌ها به اصول شخصی خود پایبند باشند و تأثیر مثبتی بر جامعه یا سازمان بگذارند.","traits":"تعهد به اصول اخلاقی: این افراد به‌طور طبیعی به شفافیت، انصاف و عدالت در محیط کار اهمیت می‌دهند.\nمسئولیت‌پذیری بالا: علاقه به انجام کارهای صحیح و کامل، حتی در شرایط دشوار.\nاولویت دادن به دیگران: این افراد تمایل دارند که نیازهای تیم و سازمان را در نظر بگیرند و به ارتقاء محیط کار کمک کنند.\nصداقت و شفافیت: در تصمیم‌گیری‌ها و ارتباطات به صداقت و شفافیت توجه ویژه‌ای دارند.","challenges":"مقاومت در برابر فشار های غیر اخلاقی، تناقص با فرهنگ سازمانی","performance":"مناسب برای مشاغل با اصول اخلاقی قوی مانند مشاوره، وکالت، امور اجتماعی"},{"name":"صمیمیت","level":"پایین","desc":"افرادی که دارای صمیمیت کم هستند، بیشتر بر روی وظایف فردی و نیازهای شغلی خود تمرکز دارند و تمایل زیادی به برقراری روابط اجتماعی در محیط کار ندارند. این افراد معمولاً ترجیح می‌دهند که به‌طور مستقل و با کمترین دخالت از دیگران وظایف خود را انجام دهند.","traits":"افرادی که دارای صمیمیت کم هستند، بیشتر بر روی وظایف فردی و نیازهای شغلی خود تمرکز دارند و تمایل زیادی به برقراری روابط اجتماعی در محیط کار ندارند. این افراد معمولاً ترجیح می‌دهند که به‌طور مستقل و با کمترین دخالت از دیگران وظایف خود را انجام دهند.","challenges":"چالش در محیط‌های کاری تیمی، کاهش انگیزه در محیط‌های اجتماعی","performance":"مناسب برای مشاغل فردی، تحلیلگر داده‌ها، مشاوران استراتژیک"},{"name":"صمیمیت","level":"متوسط","desc":"افرادی با صمیمیت متوسط به‌طور معمول روابط اجتماعی را مهم می‌دانند، اما می‌توانند به‌خوبی بین تعاملات اجتماعی و نیازهای حرفه‌ای خود توازن برقرار کنند. آن‌ها به‌راحتی می‌توانند در محیط‌های کاری که نیاز به استقلال و تصمیم‌گیری فردی دارند نیز عملکرد خوبی داشته باشند.","traits":"این افراد قادر به برقراری روابط اجتماعی هستند اما در عین حال می‌توانند مرزهای حرفه‌ای و شخصی را حفظ کنند.\nمی‌توانند به‌طور انعطاف‌پذیر روابط خود را با همکاران تنظیم کنند و به کار تیمی اهمیت بدهند، اما در مواقع ضروری می‌توانند روی وظایف فردی خود تمرکز کنند.","challenges":"توازن میان کار و روابط اجتماعی، تضاد میان نیازهای شغلی و اجتماعی","performance":"مناسب برای مشاغل مدیریتی و مشاوره در محیط‌های حرفه‌ای"},{"name":"صمیمیت","level":"بالا","desc":"افرادی با صمیمیت بالا معمولاً برقراری روابط دوستانه و اجتماعی را در اولویت قرار می‌دهند و به‌طور طبیعی در محیط‌های تیمی و گروهی عملکرد خوبی دارند. این افراد به‌دنبال ایجاد حس تعلق و تعامل مثبت با همکاران خود هستند و بیشتر در مشاغلی موفق خواهند بود که نیاز به ارتباط نزدیک و همکاری مداوم دارند.","traits":"آن‌ها می‌خواهند در محیط کار احساس تعلق داشته باشند و روابط گرم و صمیمانه‌ای با همکاران برقرار کنند.\nبه‌طور معمول در محیط‌های اجتماعی و تیمی خوشحال هستند و از تعاملات مثبت لذت می‌برند.\nتمایل به همدلی و شنیدن مشکلات و نیازهای دیگران دارند و از کمک به همکاران خود برای حل مسائل شخصی و حرفه‌ای استقبال می‌کنند.","challenges":"پیش‌دستی در مسائل احساسی، تمرکز زیاد بر روابط اجتماعی","performance":"مناسب برای مشاغل تیمی و مشاوران اجتماعی، منابع انسانی"},{"name":"جمع گرایی","level":"پایین","desc":"افراد با سطح پایین معاشرتی بودن معمولاً در محیط‌های اجتماعی حضور کمتری دارند و به‌دنبال آرامش و خلوت هستند. آنها ترجیح می‌دهند کمتر در تعاملات گروهی شرکت کنند و بیشتر بر کار فردی و استقلال تمرکز دارند.","traits":"متمرکز بر کار فردی: تمایل به انجام وظایف خود به‌صورت مستقل و بدون حواس‌پرتی از دیگران.\nتوجه به جزئیات: به دلیل ترجیح به تمرکز بیشتر بر کار، می‌توانند به جزئیات دقت بیشتری داشته باشند.\nثبات رفتاری: در محیط‌های پرتنش، توانایی حفظ آرامش و تمرکز بالاتر را دارند.","challenges":"ضعف در مشاغل نیازمند ارتباط، تنهایی در محیط‌های تیمی","performance":"مناسب برای مشاغل مستقل مانند برنامه‌نویسی و تحقیق"},{"name":"جمع گرایی","level":"متوسط","desc":"افراد با سطح متوسط معاشرتی بودن، تمایل دارند که تعادلی بین تعاملات اجتماعی و تمرکز بر کار خود برقرار کنند. آنها از برقراری ارتباط با دیگران لذت می‌برند، اما می‌توانند به راحتی نیازهای شغلی و اجتماعی خود را تنظیم کنند.","traits":"تعادل بین تعاملات اجتماعی و کار: می‌توانند در جمع‌ها حضور داشته باشند، اما در عین حال به‌خوبی بر وظایف خود متمرکز می‌شوند.\nروحیه تیمی: قادرند به‌خوبی در تیم‌های کاری عمل کنند و هم در نقش‌های رهبری و هم به‌عنوان عضو تیم، مؤثر باشند.\nتوانایی سازگاری: قادر به تنظیم خود با شرایط مختلف محیطی و شغلی هستند و به‌خوبی با دیگران تعامل برقرار می‌کنند.","challenges":"نیاز به یادگیری مدیریت زمان، چالش در محیط‌های رقابتی","performance":"مناسب برای مشاغل ترکیبی مانند مشاوره و مدیریت پروژه"},{"name":"جمع گرایی","level":"بالا","desc":"افراد با سطح بالای معاشرتی بودن معمولاً فعال، پرانرژی و تمایل دارند که در محیط‌های اجتماعی حضور پررنگ داشته باشند. آنها دوست دارند در جمع‌های مختلف باشند و از تعاملات اجتماعی لذت می‌برند.","traits":"انرژی بالا: تمایل به فعالیت و مشارکت در پروژه‌ها و جلسات متعدد.\nرهبری طبیعی: توانایی برقراری ارتباط مؤثر با دیگران، جلب اعتماد و انگیزش در تیم‌های کاری.\nتماس اجتماعی گسترده: داشتن روابط متعدد با همکاران و دیگر اعضای سازمان.\nاعتماد به نفس بالا: اعتماد به نفس قوی در مواجهه با موقعیت‌های اجتماعی و شغلی.","challenges":"حواس‌پرتی در محیط‌های آرام، توجه کم به جزئیات","performance":"عالی در مشاغل تعامل‌محور مانند فروش و بازاریابی"},{"name":"قاطعیت","level":"پایین","desc":"افراد با سطح پایین ابراز وجود معمولاً تمایل دارند از بیان نظرات و احساسات خود خودداری کرده و بیشتر به اخذ تعاملات دیگران بپردازند. این افراد ممکن است به‌عنوان افرادی منفعل دیده شوند.","traits":"همکاری بی‌قید و شرط: توانایی بالا در پذیرش نظرات دیگران بدون ابراز تضاد.\nمیل به اجتناب از مواجهه: تمایل به دوری از موقعیت‌های چالش‌برانگیز و تعارض‌آمیز.","challenges":"","performance":""},{"name":"قاطعیت","level":"متوسط","desc":"افراد با سطح متوسط ابراز وجود، تعادل خوبی بین بیان نظرات خود و گوش دادن به دیدگاه‌های دیگران برقرار می‌کنند. آنها معمولاً می‌توانند نظرات خود را به‌صورت متعادل و بدون فشار بیان کنند.","traits":"تعادل در ابراز خود: توانایی بیان نظرات و احساسات به‌صورت متعادل بدون افراط یا تفریط.\nمهارت در تعاملات اجتماعی: می‌توانند به‌خوبی در تیم‌ها و گروه‌ها مشارکت کنند.\nپذیرش انتقاد: قادر به دریافت انتقاد به‌طور سازنده و بدون واکنش‌های منفی شدید.","challenges":"","performance":""},{"name":"قاطعیت","level":"بالا","desc":"افرادی با سطح بالای ابراز وجود تمایل دارند دیدگاه‌ها و نیازهای خود را به‌وضوح و بدون تردید بیان کنند. این افراد معمولاً در تعاملات خود مستقیم و مطمئن عمل می‌کنند.","traits":"مستقل و خودمحور: توانایی بیان نظرات و احساسات به‌صورت واضح و مستقیم.\nمهارت در مذاکرات: توانایی مؤثر در مدیریت گفتگوها و مذاکرات به نفع خود و تیم.\nاعتماد به نفس بالا: معمولاً در محیط کار از میزان زیادی اعتماد به نفس برخوردارند.","challenges":"","performance":""},{"name":"فعالیت","level":"پایین","desc":"افراد با سطح فعالیت کم معمولاً تمایل دارند کمتر درگیر فعالیت‌های فیزیکی یا ذهنی باشند و ترجیح می‌دهند بیشتر زمان خود را در شرایط آرام و بدون فشار سپری کنند. این افراد به فعالیت‌های با سرعت پایین‌تر و کم‌تحرک تمایل دارند و ممکن است در محیط‌های آرام و بدون اضطراب عملکرد بهتری داشته باشند.","traits":"تمرکز بالا: به دلیل نیاز کمتر به تحرک، این افراد قادر به تمرکز طولانی‌مدت بر کارهای خاص و پیچیده هستند.\nکاهش استرس: در محیط‌های کاری آرام و بی‌فشار عملکرد بهتری دارند.\nآرامش در فشار: توانایی حفظ آرامش و تمرکز در شرایط استرس‌زا یا پر فشار.","challenges":"کمبود تحرک، دشواری در برقراری ارتباط‌ها","performance":"مناسب برای مشاغل با تمرکز بالا و کم تحرک مانند تحلیل داده‌ها"},{"name":"فعالیت","level":"متوسط","desc":"افراد با سطح فعالیت متوسط معمولاً به‌طور متعادل بین فعالیت‌های شغلی و استراحت‌های لازم در طول روز حرکت می‌کنند. آنها نیاز به فعالیت و تحرک دارند، اما می‌توانند به‌خوبی میان فعالیت‌های شغلی و زمان‌های استراحت توازن برقرار کنند.","traits":"تعادل در انرژی: قادر به انجام کارها به‌طور مؤثر با حفظ سطح انرژی متعادل. آنها در حالی که مشتاق به انجام کار هستند، به‌خوبی می‌توانند در مواقع نیاز استراحت کنند.\nانعطاف‌پذیری: توانایی تطبیق با تغییرات در محیط کار و تغییر وظایف بدون احساس فشار زیاد.\nکنترل بر استرس: توانایی مدیریت استرس به‌طور مؤثر و حفظ آرامش در شرایط مختلف.","challenges":"چالش در محیط‌های پرسرعت، افت عملکرد در زمان‌های بی‌تحرکی","performance":"مناسب برای مشاغل متوازن مانند مدیریت منابع انسانی و مشاوره"},{"name":"فعالیت","level":"بالا","desc":"افرادی با سطح فعالیت بالا معمولاً تمایل دارند همیشه مشغول به کار و در حال انجام فعالیت‌های مختلف باشند. این افراد برای انجام چندین کار به‌طور همزمان یا مشارکت در پروژه‌های متنوع انرژی دارند و از فعالیت‌های فیزیکی یا ذهنی زیاد لذت می‌برند.","traits":"انرژی بالا: افراد با سطح بالای فعالیت معمولاً بسیار پرانرژی هستند و می‌توانند به سرعت و به‌طور مؤثر در محیط‌های شلوغ کار کنند.\nپویایی: توانایی انجام چندین کار به‌طور همزمان و تغییر سریع بین وظایف مختلف.\nتلاش مداوم: تمایل دارند تا در هر شرایطی مشغول به کار باشند و احساس می‌کنند که به‌طور دائم باید در حال انجام کاری باشند.\nتسلط بر موقعیت‌ها: توانایی مدیریت بحران‌ها و شرایط پر فشار با سرعت و دقت.","challenges":"خستگی و فرسودگی، تمرکز کم بر جزئیات","performance":"مناسب برای مشاغل پرسرعت و تحرک بالا مانند فروش و مدیریت بحران"},{"name":"هیجان خواهی","level":"پایین","desc":"افراد با سطح هیجان‌خواهی کم تمایل دارند در محیط‌هایی باشند که پیش‌بینی‌پذیر و کنترل‌شده هستند. این افراد با الگوهای مشخص و فعالیت‌های روتین راحت‌تر هستند و از تغییرات زیاد اجتناب می‌کنند.","traits":"پایداری بالا: اجرای کارها با دقت و ثبات، ترجیح کارهای روتین و آشنا.\nاجتناب از ریسک: تمرکز بر حفظ امنیت و پرهیز از فعالیت‌های پرریسک.\nقدرت تحمل بالا در موقعیت‌های ثابت: قادر به ماندن و تمرکز در محیط‌هایی با تغییرات کم.","challenges":"کندی در پذیرش تغییرات، احساس عدم راحتی در شرایط ناپایدار","performance":"مناسب برای ثبات و دقت بالا مانند کارهای دفتری و حسابداری"},{"name":"هیجان خواهی","level":"متوسط","desc":"افراد با سطح هیجان‌خواهی متوسط تمایل دارند توازنی بین تجربیات جدید و هیجان‌انگیز با محیط‌های پایدار و آشنا برقرار کنند. این افراد می‌توانند ریسک‌هایی کنترل‌شده را بپذیرند و به‌طور متعادل از تجربه‌های نو بهره‌گیرند.","traits":"تعادل در پذیرش تغییرات: پذیرش تغییرات مطابق با استراتژی و برنامه‌های موجود.\nمدیریت مناسب ریسک: توانایی ارزیابی سطح ریسک و پذیرش آن در صورت منطقی بودن.\nتطبیق‌پذیری: حفظ توانایی خود در مواجهه با شرایط متفاوت و نیازهای موقعیتی.","challenges":"کندی در پذیرش فناوری‌های جدید، تمایل به الگوهای آشنا","performance":"مناسب برای تطبیق با تغییرات و حفظ ثبات مانند مشاوره مدیریت"},{"name":"هیجان خواهی","level":"بالا","desc":"افرادی با سطح بالای هیجان‌خواهی علاقه‌مند به فعالیت‌هایی هستند که شامل تجربیات جدید، پرخطر و هیجان‌آور باشند. این افراد از چالش‌های محیط‌های جدید لذت می‌برند و تمایل دارند همواره در تلاش برای تجربه‌های جدید باشند.","traits":"پیشگام: به‌دنبال کشف راه‌های جدید و نوآورانه در کارهای خود هستند.\nتحمل ریسک بالا: تمایل به پذیرش ریسک‌های بالا در پروژه‌ها به‌منظور کسب نتایج برجسته.\nانعطاف‌پذیری بالا: قادر به تطبیق با تغییرات سریع و شرایط ناپایدار.\nخلاقیت زیاد: ایده‌پردازی‌های خلاقانه و نوآورانه در مواجهه با مسائل پیچیده.","challenges":"عدم ثبات شغلی، برنامه‌ریزی ناقص","performance":"مناسب برای نوآوری و جسارت مانند کارآفرینی و تحقیق و توسعه"},{"name":"هیجان مثبت","level":"پایین","desc":"افرادی با سطح پایین هیجانات مثبت بیشتر به مسائل کاری، حرفه‌ای و روابط بین‌فردی با نگرش خنثی یا گاهی منفی نگاه می‌کنند. این افراد ممکن است به جای شور و اشتیاق، احتیاط و مقاومت بیشتری از خود نشان دهند.","traits":"واقع‌گرایی یا بدبینی: تمرکز بر مشکلات و ریسک‌ها به جای فرصت‌ها.\nعدم ابراز احساسات مثبت: معمولاً حالتی خنثی‌تر یا حتی منفی‌تر در تعاملات خود دارند.\nثبات احساسی: می‌توانند در محیط‌های پراسترس یا بحرانی بدون هیجان‌های بالا مقاومت کنند.","challenges":"نگرش محتاطانه، مقاومت در برابر تغییرات","performance":"مناسب برای کارهای با نیاز به ثبات مانند حسابرسی و تحلیل مالی"},{"name":"هیجان مثبت","level":"متوسط","desc":"افرادی با سطح متوسط هیجانات مثبت، تعادلی خوبی بین خوش‌بینی و واقع‌بینی برقرار می‌کنند. این افراد توانایی اثرگذاری مثبت بر محیط کار را دارند، اما بدون قطع ارتباط با واقعیت‌ها.","traits":"رفتاری متعادل: توانایی ترکیب خوش‌بینی و انتقادپذیری. قادر هستند مسائل را واقعی به نظر بیاورند اما همچنان حس امیدواری را منتقل می‌کنند.\nتعامل‌پذیری متعادل: تمایل به ایجاد ارتباطات مثبت با افراد، اما به‌صورت مدیریت‌شده و نه بیش از حد.\nتفکر استراتژیک: توانایی نگاه به آینده با حفظ توجه به موقعیت حال.","challenges":"کمبود شور در مواقع بحران، کندی در تصمیم‌گیری","performance":"مناسب برای کارهای متوازن مانند مدیریت پروژه و تحلیل‌گری"},{"name":"هیجان مثبت","level":"بالا","desc":"افرادی با سطح بالای هیجانات مثبت معمولاً افرادی پرانرژی، خوش‌بین و با انگیزه هستند. آن‌ها توانایی این را دارند که محیط کار خود را با انرژی و حس خوب پر کنند و حتی بر دیگران نیز تأثیر مثبت بگذارند.","traits":"نگرش خوش‌بینانه: تمایل به دیدن فرصت‌ها در هر چالش و رویکردی سازنده نسبت به مسائل کاری.\nانرژی بالا: اشتیاق و نشاط در انجام وظایف و مواجهه با چالش‌های روزمره.\nاثرگذاری مثبت: انتقال انرژی مثبت به همکاران و ایجاد فضای کاری مطلوب.\nانعطاف‌پذیری احساسی: توانایی مدیریت استرس و حفظ روحیه بالا حتی در شرایط دشوار.","challenges":"خطر نادیده‌گرفتن واقعیت‌ها، پراکندگی تلاش‌ها","performance":"مناسب برای مشاغل با تعامل بالا مانند فروش و مدیریت تیم"},{"name":"اضطراب","level":"پایین","desc":"افراد با سطح کم اضطراب معمولاً توانایی مقابله با موقعیت‌های استرس‌زا را به خوبی دارند. آن‌ها احساس راحتی و آرامش بیشتری در شرایط پیچیده و چالش‌برانگیز تجربه می‌کنند و قادرند در مواقع بحرانی نیز با اطمینان تصمیم‌گیری کنند.","traits":"اعتماد به نفس بالا: توانایی مدیریت استرس و موقعیت‌های غیرمنتظره به‌طور مؤثر.\nپایداری عاطفی: این افراد در مواجهه با فشارهای شغلی آرامش خود را حفظ می‌کنند و نمی‌گذارند اضطراب یا نگرانی‌ها بر روی عملکردشان تأثیر بگذارند.\nتمرکز بالا: توانایی تمرکز بر وظایف و کارها بدون نگرانی‌های زیاد یا افکار منفی.","challenges":"کمبود حساسیت در شرایط بحرانی، عدم درک احساسات دیگران","performance":"مناسب برای مشاغلی که نیاز به تصمیم‌گیری سریع و مدیریت بحران دارند مانند رهبری تیم‌ها و مدیریت پروژه‌های حساس"},{"name":"اضطراب","level":"متوسط","desc":"افراد با اضطراب متوسط معمولاً به‌طور موقت تحت تأثیر نگرانی‌ها و استرس‌ها قرار می‌گیرند، اما قادر به مدیریت این احساسات در بیشتر مواقع هستند. این افراد می‌توانند با موقعیت‌های چالش‌برانگیز مواجه شوند، اما نیاز به کنترل و حمایت بیشتر دارند تا بتوانند به عملکرد مطلوب دست یابند.","traits":"توانایی مدیریت استرس: توانایی تعدیل اضطراب در مواقع نیاز، اما ممکن است گاهی احساس فشار کنند.\nپاسخ به انتقاد: این افراد به انتقادها و بازخوردها واکنش نشان می‌دهند، اما معمولاً از آن‌ها به‌عنوان فرصتی برای بهبود استفاده می‌کنند.\nنگرانی محدود: نگرانی در شرایط خاص و پیش از موقعیت‌های چالش‌برانگیز (مثل ارائه‌ها یا جلسه‌های مهم) افزایش می‌یابد، اما در مجموع تحت کنترل است.","challenges":"مایل به اجتناب از تغییرات، تأخیر در تصمیم‌گیری","performance":"مناسب برای مشاغل متعادل مانند مشاوره و مدیریت پروژه"},{"name":"اضطراب","level":"بالا","desc":"افراد با سطح بالای اضطراب اغلب در موقعیت‌های پرتنش یا نامشخص احساس نگرانی و استرس زیادی دارند. آن‌ها ممکن است به‌طور مداوم از آینده و پیامدهای احتمالی نگران باشند و این نگرانی‌ها می‌تواند بر عملکرد شغلی‌شان تأثیر منفی بگذارد.","traits":"افکار منفی مداوم: تمایل به نگرانی زیاد و جلب توجه به جنبه‌های منفی هر وضعیت.\nکاهش تمرکز: به دلیل اضطراب مداوم، ممکن است فرد نتواند تمرکز کاملی بر وظایف خود داشته باشد.\nنیاز به تایید مداوم: افراد با اضطراب زیاد ممکن است به تأیید و تأمین امنیت از دیگران نیاز داشته باشند.\nحساسیت زیاد به ارزیابی: ممکن است از انتقادات یا قضاوت‌های منفی بیش‌ازحد رنج ببرند و این موجب کاهش اعتماد به نفس و عملکردشان شود.","challenges":"عدم توانایی در تصمیم‌گیری سریع، کاهش بهره‌وری","performance":"مناسب برای مشاغل روتین و با استرس کم مانند امور اداری و حسابداری"},{"name":"پرخاشگری","level":"پایین","desc":"افراد با پرخاشگری کم در مواجهه با چالش‌ها و فشارهای محیطی تمایل دارند تا واکنش‌های آرام و منطقی نشان دهند. این افراد معمولاً در روابط خود با دیگران سازگارتر هستند و کمتر در معرض تعارضات و درگیری‌ها قرار می‌گیرند.","traits":"خونسردی در مواجهه با بحران‌ها: افراد با پرخاشگری کم معمولاً آرامش خود را حفظ می‌کنند و می‌توانند در موقعیت‌های استرس‌زا تصمیمات مؤثری بگیرند.\nتمایل به همکاری: این افراد اغلب تمایل دارند که با دیگران همکاری کرده و مسائل را از زاویه‌ای مثبت و متعادل بررسی کنند.\nتوانایی حل مسئله: این افراد تمایل دارند که به‌جای واکنش‌های هیجانی، به‌طور منطقی به حل مشکلات بپردازند و از روش‌های صلح‌آمیز برای حل اختلافات استفاده کنند.","challenges":"در صورت فشار بالا ممکن است نیاز به رهبری و مدیریت بحران داشته باشند","performance":"مشاغل مناسب: مدیریت پروژه، مشاغلی که نیاز به تصمیم‌گیری سریع و کم‌تنش دارند"},{"name":"پرخاشگری","level":"متوسط","desc":"افراد با پرخاشگری متوسط، زمانی که با فشارهای محیطی یا استرس‌های اجتماعی مواجه می‌شوند، واکنش‌هایی متعادل‌تر از افراد با پرخاشگری زیاد نشان می‌دهند. این افراد قادرند تا حدی خود را کنترل کنند و به‌طور کلی عملکرد نسبتاً سازگارانه‌ای در محیط‌های کاری دارند.","traits":"واکنش‌های نسبی به استرس: این افراد ممکن است گاهی تحت تأثیر استرس و فشار قرار بگیرند، اما توانایی کنترل خود را دارند و نمی‌گذارند رفتارهای پرخاشگرانه به‌طور مداوم بر تصمیمات یا روابط‌شان تأثیر بگذارد.\nاعتراض سازنده: در مواقع نیاز به انتقاد یا بحث، این افراد معمولاً به شیوه‌ای مستقیم و سازنده این کار را انجام می‌دهند، اما ممکن است در برخی مواقع کنترل کمتری بر خود داشته باشند.\nتمایل به دفاع از خود: افراد با پرخاشگری متوسط به‌طور معمول در مواقع احساس تهدید یا بی‌احترامی از خود دفاع می‌کنند، اما این رفتارها معمولاً در حد معقول و در قالب انتقاد یا اعتراض است.","challenges":"بهبود عملکرد تحت بازخورد و مدیریت، ممکن است در مواجهه با فشار دچار واکنش‌های دفاعی شود","performance":"مشاغل مناسب: فروش، مشاوره، مدیریت منابع انسانی، موقعیت‌های تیمی با نیاز به بازخورد"},{"name":"پرخاشگری","level":"بالا","desc":"افراد با سطح پرخاشگری بالا تمایل دارند به‌طور مکرر و اغلب به‌صورت غیرمنتظره‌ای وارد رفتارهای تهاجمی یا تحریک‌آمیز شوند. این افراد به‌طور معمول واکنش‌های شدیدی به احساسات منفی مانند خشم، ناامیدی و تهدید دارند و می‌توانند روابط خود را تحت تأثیر قرار دهند.","traits":"واکنش‌های سریع و شدید: افراد با پرخاشگری زیاد ممکن است به‌طور ناگهانی به انتقادها یا شکست‌ها واکنش‌های عصبی و تند داشته باشند.\nکاهش کنترل خود: در شرایط فشار یا عدم توافق، این افراد ممکن است کنترل کمتری بر رفتار خود داشته باشند و از بیان افکار خود به‌صورت تهاجمی استفاده کنند.\nافزایش تعارضات: این افراد احتمالاً در تعاملات اجتماعی و گروهی با دیگران دچار تعارض می‌شوند، چرا که رفتارهای تهاجمی یا حرف‌های تند از آن‌ها بر محیط اجتماعی تأثیر منفی می‌گذارد.","challenges":"کاهش بهره‌وری تیمی، احتمال بروز تنش‌های زیاد، دشواری در انجام کار گروهی","performance":"مشاغل مناسب: مشاغل فنی، مستقل و نیاز به تمرکز فردی مانند تحقیق و توسعه، پشتیبانی فنی"},{"name":"افسردگی","level":"پایین","desc":"افرادی که سطح افسردگی پایینی دارند، معمولاً قادرند احساسات منفی را به راحتی مدیریت کرده و کمتر تحت تأثیر مشکلات روحی قرار می‌گیرند. این افراد تمایل دارند که از جنبه‌های مثبت محیط کاری لذت ببرند و از قدرت‌های شخصی خود در حل مشکلات بهره ببرند.","traits":"انرژی و انگیزه بالا: این افراد معمولاً دارای سطح بالایی از انرژی و انگیزه هستند که آن‌ها را قادر می‌سازد تا به خوبی وظایف خود را انجام دهند.\nنگرش مثبت به چالش‌ها: در مواجهه با مشکلات، آن‌ها نگرش مثبت‌تری دارند و معمولاً خود را قادر به حل مسائل می‌دانند.\nتمرکز بالا: توانایی تمرکز بالا بر روی کارها و حفظ عملکرد در شرایط مختلف را دارند.","challenges":"مشکل در محیط های با فشار عاطفی","performance":"مناسب برای مشاغل فنی و تحلیل‌محور"},{"name":"افسردگی","level":"متوسط","desc":"افرادی با سطح متوسط افسردگی، ممکن است برخی از ویژگی‌های افسردگی را تجربه کنند، اما معمولاً توانایی مدیریت و کنترل احساسات منفی خود را دارند. این افراد معمولاً می‌توانند وظایف خود را انجام دهند، اما گاهی تحت تأثیر وضعیت روحی خود قرار می‌گیرند.","traits":"احساس گاهی کم‌انرژی: این افراد ممکن است در برخی مواقع احساس خستگی یا بی‌انگیزگی داشته باشند، اما معمولاً می‌توانند آن را مدیریت کنند.\nنگرانی‌های دوره‌ای: احساس نگرانی یا عدم اطمینان درباره توانایی‌های خود در مواجهه با چالش‌های شغلی می‌تواند بر عملکرد آن‌ها تأثیر بگذارد.\nمشتاق به حمایت: این افراد ممکن است از همکاران یا مدیران خود حمایت عاطفی و روانی بخواهند تا بتوانند به بهترین شکل وظایف خود را انجام دهند.","challenges":"کاهش کارآیی در شرایط پر تنش","performance":"مناسب برای مشاغل تعاملی و هدف‌محور"},{"name":"افسردگی","level":"بالا","desc":"افرادی که سطح بالایی از افسردگی را تجربه می‌کنند، معمولاً در معرض احساسات منفی مداوم مانند غم، ناامیدی و اضطراب هستند. این افراد ممکن است در طول روز دچار افت انرژی و انگیزه شده و کمتر از محیط اطراف خود لذت ببرند.","traits":"کاهش انگیزه: این افراد ممکن است تمایلی به شروع یا ادامه کار نداشته باشند و در مواجهه با چالش‌های شغلی، احساس ناتوانی کنند.\nافزایش احساس ناامیدی: غالباً در محیط کار احساس می‌کنند که هیچ‌گونه پیشرفتی نخواهند داشت یا در مسیر موفقیت قرار نمی‌گیرند.\nتمرکز پایین: در انجام وظایف کاری خود ممکن است با مشکلاتی در حفظ تمرکز مواجه شوند، زیرا ذهنشان مشغول افکار منفی است.\nپاسخ‌دهی ضعیف به بازخوردها: ممکن است به بازخوردهای مثبت واکنش ضعیفی نشان دهند یا آن‌ها را نادیده بگیرند.","challenges":"کاهش بهره وری و مشکل در تصمیم گیری","performance":"مناسب برای مشاغل با فشار کم و مستقل"},{"name":"حساسیت به خویشتن","level":"پایین","desc":"افراد با کمرویی کم معمولاً به خوبی با دیگران تعامل کرده و در محیط‌های اجتماعی با قدرت فعالیت می‌کنند. این ویژگی باعث می‌شود که به راحتی ارتباط برقرار کنند و از چالش‌های اجتماعی استقبال نمایند.","traits":"اعتماد به نفس بالا در تعاملات اجتماعی: این افراد به راحتی ارتباطات جدید برقرار کرده و با اطمینان در زمینه‌های مختلف حضور می‌یابند.\nبهره‌وری در کار گروهی: توانایی خوبی در همکاری با تیم‌ها و مشارکت فعال دارند.\nعملکرد قوی در شرایط متنوع: توانایی سازگاری سریع با شرایط و افراد جدید را دارند.","challenges":"رقابت‌طلبی زیاد، نیاز به تنوع","performance":"مناسب برای مشاغل با تعامل اجتماعی زیاد"},{"name":"حساسیت به خویشتن","level":"متوسط","desc":"افرادی با سطح متوسط کمرویی معمولاً در بیشتر مواقع می‌توانند از پس تعاملات اجتماعی برآیند، اما در برخی شرایط خاص ممکن است احساس ناراحتی کنند.","traits":"تعاملات محدود: این افراد قادرند در محیط‌های اجتماعی عملکرد خوبی داشته باشند اما ممکن است گاهی احساس ضرورت بیش از حد برای حفظ تعاملات نکنند.\nپذیرش تدریجی تعاملات: به مرور زمان و با آشنایی بیشتر، این افراد می‌توانند تعاملات بهتری با همکاران داشته باشند.\nاحتیاط در روابط جدید: ممکن است در برقراری روابط جدید، محتاطانه عمل کنند و نیاز به زمان برای تطبیق با محیط جدید داشته باشند.","challenges":"مقاومت اولیه، کاهش مشارکت در پروژه‌ها","performance":"مناسب برای کارهای تعادلی و مدیریت پروژه"},{"name":"حساسیت به خویشتن","level":"بالا","desc":"افرادی که سطح بالایی از کمرویی دارند، اغلب از موقعیت‌های اجتماعی اجتناب می‌کنند و در تعاملات با دیگران ممکن است اضطراب زیادی را تجربه کنند.","traits":"اجتناب از تعاملات مستقیم: این افراد ممکن است تمایل به کار در محیط‌های تنها و دور از سایرین داشته باشند.\nاضطراب در مواجهه با جمع: در حضور جمع یا هنگام شرکت در جلسات ممکن است دچار اضطراب و استرس شوند.\nخودآگاهی بیش از حد: تمرکز زیاد بر روی نحوه برخورد و صحبت کردن، که می‌تواند تمرکز آن‌ها را بر وظایف کاری مختل کند.","challenges":"کاهش نقش فعال، افت عملکرد در جلسات","performance":"مناسب برای مشاغل با تمرکز فردی"},{"name":"تکانش وری","level":"پایین","desc":"افرادی که تکانشوری کمی دارند، به‌طور کلی تمایل دارند که قبل از هر تصمیمی به دقت فکر کنند و از اعمال سریع و غیرمؤثر پرهیز کنند. این ویژگی باعث می‌شود که آن‌ها اغلب در موقعیت‌های پیچیده و استراتژیک عملکرد خوبی داشته باشند.","traits":"تصمیم‌گیری متفکرانه: این افراد تمایل دارند قبل از انجام هر کاری، تمامی جنبه‌های آن را بررسی کرده و به‌طور عمیق تصمیم بگیرند.\nدقت در انجام وظایف: افراد با تکانشوری کم، معمولاً به جزئیات توجه زیادی دارند و از اشتباهات جلوگیری می‌کنند.\nپرهیز از خطرات: به طور کلی این افراد تمایل دارند که از ریسک‌های غیرضروری دوری کنند و بیشتر به دنبال حفظ ثبات و انجام کارها به بهترین نحو هستند. الا در مدیریت و مقابله با شرایط پر فشار.\nثبات خلقی و احساسی: کمتر دچار نوسانات احساسی می‌شوند و می‌توانند تحت شرایط سخت به کار ادامه دهند.\nتمرکز بالا و تصمیم‌گیری منطقی: در مواجهه با محیط‌های چالش برانگیز، قادرند تصمیم‌گیری‌های هوشمندانه‌تری داشته باشند.","challenges":"عملکرد برتر، مناسب برای شرایط چالش‌برانگیز","performance":"مناسب برای نقش‌های مدیریتی و رهبری در شرایط فشار"},{"name":"آسیب پذیری","level":"متوسط","desc":"افراد با آسیب‌پذیری متوسط به استرس، می‌توانند در شرایط استرس‌زا عملکرد مناسبی داشته باشند اما همچنان با چالش‌هایی در مدیریت استرس مواجه هستند.","traits":"توانایی مدیریت نسبی استرس: می‌توانند فشارهای معمول را تحمل کنند اما در مواجهه با استرس شدید ممکن است دچار مشکل شوند.\nهشیاری به تغییرات محیطی: حساسیت نسبت به تغییرات محیطی و همکاری با دیگران برای مدیریت استرس.\nواکنش‌های احساسی قابل کنترل: قادر به مدیریت احساسات در محیط کار اما نیاز به پشتیبانی در شرایط خیلی سخت.","challenges":"کاهش موقت بهره‌وری، نیاز به استراحت","performance":"مناسب برای محیط‌های متعادل و کنترل‌شده"},{"name":"آسیب پذیری","level":"بالا","desc":"افراد با آسیب‌پذیری بالا نسبت به استرس، معمولاً در شرایط فشار و چالش‌برانگیز زودتر دچار ناراحتی روانی و فیزیکی می‌شوند. این افراد اغلب نیاز به محیط‌های آرام و کمتر تنش‌زا دارند.","traits":"پاسخ سریع به استرس: این افراد در مواجهه با کوچک‌ترین تغییرات یا فشارهای کاری به سرعت دچار اضطراب یا استرس می‌شوند.\nاحساسات قوی و ناپایدار: نوسانات خلقی شدید که می‌تواند تأثیرات منفی بر تعاملات روزانه داشته باشد.\nاجتناب از موقعیت‌های فشارزا: تمایل به اجتناب از شرایطی که باعث استرس می‌شود.","challenges":"کاهش بهره‌وری، نیاز به محیط حمایتی","performance":"مناسب برای محیط‌های آرام و کمتر تنش‌زا"},{"name":"اعتماد","level":"پایین","desc":"افرادی با اعتماد کم معمولاً با احتیاط عمل می‌کنند و در روابط کاری خود تمایل دارند تا به دیگران کمتر اعتماد کنند. این افراد ممکن است نسبت به دیگران مشکوک باشند و به دقت رفتارهای اطرافیان را ارزیابی کنند.","traits":"عدم اعتماد به دیگران: این افراد معمولاً به سختی به دیگران اعتماد می‌کنند و بیشتر به توانایی‌ها و تجربیات خود ت ن‌ها برای بهبود عملکرد خود استفاده می‌کنند.","challenges":"ریسک در تصمیم‌گیری‌های گروهی، مشکل در مدیریت تضاد","performance":"مناسب برای مشاغلی که نیاز به همکاری تیمی و اعتماد متقابل دارند"},{"name":"سادگی","level":"پایین","desc":"افرادی با رک‌گویی کم معمولاً در بیان نظرات و احساسات خود محتاط هستند و تمایل دارند که از بیان مستقیم نظرات خودداری کنند.","traits":"احتیاط در بیان نظرات: این افراد معمولاً در بیان نظرات و احساسات خود محتاط هستند و تمایل دارند که از بیان مستقیم نظرات خودداری کنند.\nترس از واکنش‌های منفی: ممکن است به دلیل ترس از واکنش‌های منفی دیگران، از بیان نظرات خودداری کنند.","challenges":"مشکل در تصمیم‌گیری، ناتوانی در مدیریت تعارضات","performance":"مناسب برای مشاغلی که نیاز به تعاملات دیپلماتیک و حساسیت به واکنش‌های دیگران دارند"},{"name":"سادگی","level":"متوسط","desc":"افراد با رک‌گویی متوسط تمایل دارند که نظرات و احساسات خود را به صورت متعادل و با در نظر گرفتن شرایط بیان کنند. این افراد معمولاً در ارتباطات خود محتاط‌تر عمل می‌کنند.","traits":"بیان متعادل نظرات: این افراد تمایل دارند که نظرات خود را به صورت متعادل و با در نظر گرفتن شرایط و مخاطب بیان کنند.\nحساسیت به واکنش دیگران: در بیان نظرات خود، به واکنش‌ها و احساسات دیگران توجه می‌کنند و سعی می‌کنند از ایجاد ناراحتی جلوگیری کنند.","challenges":"مشکل در تصمیم‌گیری سریع، ناتوانی در مدیریت تعارضات","performance":"مناسب برای مشاغلی که نیاز به ارزیابی دقیق و گام‌های تدریجی دارند"},{"name":"سادگی","level":"بالا","desc":"افرادی با سطح بالای رک‌گویی به طور طبیعی تمایل دارند که نظرات و احساسات خود را به صورت مستقیم و بدون پیچیدگی بیان کنند. این افراد معمولاً در ارتباطات خود شفاف و صادق هستند.","traits":"بیان مستقیم نظرات: این افراد به راحتی می‌توانند نظرات و احساسات خود را بیان کنند و از پیچیدگی‌های غیرضروری در ارتباطات پرهیز می‌کنند.\nشفافیت در ارتباطات: تمایل دارند که در ارتباطات خود شفاف و صادق باشند و از هرگونه ابهام یا سوءتفاهم جلوگیری کنند.\nپذیرش انتقاد: به دلیل رک‌گویی، این افراد معمولاً به راحتی انتقاد را می‌پذیرند و از آن برای بهبود عملکرد خود استفاده می‌کنند.","challenges":"ریسک در روابط کاری، مشکل در تیم‌های چندفرهنگی","performance":"مناسب برای مشاغلی که نیاز به شفافیت و صداقت در ارتباطات دارند"},{"name":"نوع دوستی","level":"پایین","desc":"این افراد معمولاً تمایل کمتری به مداخله در کمک به دیگران دارند و بیشتر به اولویت‌های شخصی خود تمرکز دارند.","traits":"تمرکز بر اهداف فردی: بیشتر به دنبال دستیابی به اهداف خود هستند و توجه کمتری به نیازهای دیگران دارند.\nخودگرایی مثبت: به توانایی‌ها و نیازهای خود اهمیت می‌دهند.","challenges":"تمایل به رقابت بیش از همکاری، تمرکز زیاد بر اهداف شخصی","performance":"مناسب برای مشاغلی که نیاز به تمرکز فردی و اهداف شخصی دارند"},{"name":"نوع دوستی","level":"متوسط","desc":"افراد با نوع‌دوستی متوسط معمولاً تمایل به کمک به دیگران دارند اما این کار را با در نظر گرفتن نیازها و منابع شخصی‌شان انجام می‌دهند.","traits":"کمک‌های متعادل: در فرصت‌های مناسب تمایل به کمک دارند اما اولویت را به اهداف و وظایف خود می‌دهند.\nهمدلی معقول: به نیازهای دیگران اهمیت می‌دهند اما با در نظرگیری تعادل میان کمک به دیگران و خود.","challenges":"راضی‌سازی همه‌ ی طرف‌ها، نبود تمرکز خاص بر یک بعد از کار","performance":"مناسب برای محیط‌هایی که به سنجش دقیق و تصمیم‌گیری با ملاحظه نیازها دارند"},{"name":"نوع دوستی","level":"بالا","desc":"افرادی با سطح بالای نوع‌دوستی تمایل بالایی به کمک به دیگران و ملاحظه رفاه آن‌ها دارند، حتی اگر به هزینه شخصی خودشان باشد.","traits":"تمایل به کمک: غالباً آماده‌اند به دیگران کمک کنند، چه در موقعیت‌های کاری و چه شخصی.\nهمدلی جویی: به احساسات و نیازهای دیگران توجه ویژه دارند.\nروحیه تیمی قوی: تمایل به همکاری و ایجاد محیط کاری حمایتی دارند.","challenges":"خستگی و فشار کاری، کمبود تمرکز بر اهداف شخصی","performance":"مناسب برای مشاغلی که نیاز به همکاری تیمی و حمایت از همکاران دارند"},{"name":"تبعیت","level":"پایین","desc":"افرادی با همراهی کم تمایل دارند که قوانین و هنجارهای جمعی را زیر سؤال ببرند و بیشتر به نظرات و راهکارهای مستقل خود اعتماد می‌کنند. آنان معمولاً از دستورپذیری کورکورانه اجتناب می‌کنند و هنجارهای رایج را به چالش می‌کشند.","traits":"روحیه انتقادی بالا: این افراد معمولاً قوانین، هنجارها و دستورات را ارزیابی می‌کنند و د function getResults(answers,user){
  const results={}; const subRaw={}, mainRaw={}, subParent={};
  DATA.Q.forEach((q,i)=>{const ans=answers[i];const score=ans?(q.scores[ans]||0):0;subRaw[q.subscale]=(subRaw[q.subscale]||0)+score;mainRaw[q.scale]=(mainRaw[q.scale]||0)+score;subParent[q.subscale]=q.scale;});
  DATA.MAIN.forEach(sc=>{const raw=mainRaw[sc]||0;const t=getT(sc,raw,user.gender);results[sc]={type:'main',raw,t,l5:getLevel5(t),l3:getLevel3(t)};});
  Object.entries(subRaw).forEach(([sub,raw])=>{const t=getT(sub,raw,user.gender);results[sub]={type:'sub',raw,t,l5:getLevel5(t),l3:getLevel3(t),parent:subParent[sub]};});
  return results;
}
function getT(scale,raw,gender){const key=scale+'_'+(gender==='female'?'زن':'مرد');const lookup=DATA.TS[key];if(!lookup){console.error('[NEO] Missing norm table for '+key);return 50;}const s=String(raw);if(lookup[s]!==undefined)return lookup[s];let best=null,min=Infinity;for(const k in lookup){const diff=Math.abs(parseInt(k)-raw);if(diff<min){min=diff;best=lookup[k];}}return best!==null?best:50;}
function getLevel5(t){if(t<=35)return 'بسیار پایین';if(t<=44)return 'پایین';if(t<=55)return 'متوسط';if(t<=64)return 'بالا';return 'بسیار بالا';}
function getLevel3(t){if(t<=44)return 'پایین';if(t<=55)return 'متوسط';return 'بالا';}
function getDimensionInterpretation(scale,level){const isHigh=level==='بالا'||level==='بسیار بالا';const isLow=level==='پایین'||level==='بسیار پایین';switch(scale){case 'روان نژندی':return isHigh?'مستعد تجربه استرس، نگرانی و احساسات منفی هستید و در مواجهه با فشارهای محیطی حساسیت بیشتری نشان می‌دهید.':isLow?'فردی آرام، خونسرد و مقاوم در برابر استرس هستید و به ندرت دچار نگرانی‌های شدید می‌شوید.':'در مواجهه با استرس تعادل مناسبی دارید؛ نه بیش از حد حساس هستید و نه کاملاً بی‌تفاوت.';case 'برونگرایی':return isHigh?'فردی اجتماعی، پرانرژی و قاطع هستید که از حضور در جمع و تعامل با دیگران لذت می‌برید.':isLow?'فردی تودار، مستقل و محتاط هستید که به تنهایی یا جمع‌های کوچک و صمیمی تمایل بیشتری دارید.':'رفتاری متعادل در جمع دارید؛ گاهی از حضور در جمع لذت می‌برید و گاهی به تنهایی نیاز دارید.';case 'انعطاف پذیری':return isHigh?'دارای تخیل قوی، کنجکاوی فکری و تمایل به تجربیات جدید و ایده‌های نوآورانه هستید.':isLow?'واقع‌گرا، عمل‌گرا و پایبند به سنت‌ها هستید و روال‌های آشنا و اثبات‌شده را ترجیح می‌دهید.':'بین نوآوری و حفظ سنت‌ها تعادل برقرار می‌کنید و در صورت لزوم پذیرای تغییر هستید.';case 'دلپذیر بودن':return isHigh?'فردی مهربان، همدل، قابل اعتماد و سازگار هستید که به رفاه دیگران اهمیت زیادی می‌دهید.':isLow?'فردی رقابت‌جو، صریح و انتقادپذیر هستید که بیشتر بر روی اهداف خود تمرکز دارید تا رضایت دیگران.':'به طور کلی با دیگران سازگارید، اما در مواقع لزوم می‌توانید روی مواضع و منافع خود پافشاری کنید.';case 'با وجدان بودن':return isHigh?'فردی منظم، هدف‌گرا، مسئولیت‌پذیر و دارای انضباط شخصی بالایی هستید.':isLow?'فردی انعطاف‌پذیر و خودجوش هستید، اما ممکن است در برنامه‌ریزی و پیگیری اهداف بلندمدت دچار مشکل شوید.':'از نظم و مسئولیت‌پذیری کافی برخوردارید و معمولاً به تعهدات خود عمل می‌کنید.';default:return '';}}
function detectCareless(answers){const warnings=[];if(!answers||answers.length===0)return warnings;const counts={};let neutral=0;answers.forEach(a=>{if(a){counts[a]=(counts[a]||0)+1;if(a==='نظری ندارم')neutral++;}});const total=answers.filter(a=>a!==null).length;if(total>0){const max=Math.max(...Object.values(counts));if(max===total&&total>20)warnings.push('پاسخ‌های یکسان: به نظر می‌رسد به همه سوالات یک گزینه یکسان پاسخ داده‌اید.');else if(max>total*.9)warnings.push('الگوی مشکوک: بیش از ۹۰ درصد پاسخ‌های شما یکسان است که ممکن است نشان‌دهنده عدم دقت باشد.');if(neutral>total*.5)warnings.push('پاسخ‌های خنثی زیاد: انتخاب بیش از حد گزینه «نظری ندارم» می‌تواند اعتبار نتایج آزمون را کاهش دهد.');}return warnings;}
function completedTests(){try{return JSON.parse(localStorage.getItem('neo_completed_tests')||'[]')}catch(e){return []}}

function currentDraft(){try{return JSON.parse(localStorage.getItem('neo_draft_session')||'null')}catch(e){return null}}
function saveDraft(){if(state.user&&state.answers){localStorage.setItem('neo_draft_session',JSON.stringify({user:state.user,answers:state.answers,curPage:state.page}))}}
function startQuiz(){state.answers=new Array(DATA.Q.length).fill(null);state.page=0;localStorage.removeItem('neo_draft_session');state.step='quiz';render();window.scrollTo(0,0)}
function continueQuiz(){const d=currentDraft();if(d){state.answers=d.answers;state.page=d.curPage||0;}else{state.answers=new Array(DATA.Q.length).fill(null);state.page=0}state.step='quiz';render();window.scrollTo(0,0)}
function completeQuiz(){const res=getResults(state.answers,state.user);const warnings=detectCareless(state.answers);state.results=res;state.warnings=warnings;saveCompleted({id:String(Date.now()),date:new Date().toISOString(),user:state.user,answers:state.answers,results:res,warnings});localStorage.removeItem('neo_draft_session');state.step='results';state.activeTab='summary';state.isHRView=false;render();}

function validateAndFinish(){const unanswered=state.answers.filter(a=>a===null).length;if(unanswered>0){showConfirm(`مجموعاً ${unanswered} سوال بی‌پاسخ مانده است. آیا می‌خواهید آزمون را پایان دهید و نتایج را ببینید؟`,completeQuiz);return}completeQuiz()}
let confirmHandler=null;

function confirmModal(){const h=confirmHandler;closeModal();if(h)h()}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();confirmHandler=null}
function selectAnswer(i,ans){state.answers[i]=ans;saveDraft();render()}
function nextPage(){const start=state.page*DATA.PER,end=Math.min(start+DATA.PER,DATA.Q.length),un=DATA.Q.slice(start,end).filter((_,i)=>state.answers[start+i]===null).length,last=state.page>=Math.ceil(DATA.Q.length/DATA.PER)-1;if(un>0&&!last){showConfirm(`در این صفحه ${un} سوال بی‌پاسخ است. آیا می‌خواهید به صفحه بعد بروید؟`,()=>{state.page++;saveDraft();render();window.scrollTo(0,0)});return}if(!last){state.page++;saveDraft();render();window.scrollTo(0,0)}else validateAndFinish()}
